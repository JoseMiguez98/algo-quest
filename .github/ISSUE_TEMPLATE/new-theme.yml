name: New theme
description: Propose a new look & sound (a console, an era, high contrast…).
labels: [theme]
body:
  - type: input
    id: name
    attributes:
      label: Theme
      placeholder: Game Boy (DMG)
    validations:
      required: true
  - type: textarea
    id: look
    attributes:
      label: Look
      description: Palette, typography, renderer (pixel or vector) and visual references.
    validations:
      required: true
  - type: textarea
    id: sound
    attributes:
      label: Sound
      description: Which chip or style it emulates (APU, FM, PSG, soft…) and whether it would have music.
  - type: checkboxes
    id: doing
    attributes:
      label: Will you implement it?
      options:
        - label: I want to implement it following CONTRIBUTING.md
