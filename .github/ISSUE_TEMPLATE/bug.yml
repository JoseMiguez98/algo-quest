name: Bug
description: Algo no funciona o un algoritmo muestra un paso incorrecto.
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: URL
      description: Página donde pasa. Si usaste el playground, copiá el enlace con el botón de compartir.
      placeholder: https://josemiguez98.github.io/algo-quest/sorting/quick-sort/?d=5,3,8
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Qué pasó y qué esperabas
      description: Si es un error del algoritmo, indicá el número de paso y por qué es incorrecto (con una referencia si podés).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Abrí …
        2. Presioné …
  - type: input
    id: env
    attributes:
      label: Navegador, sistema y theme
      placeholder: Chrome 140, macOS, theme Mega Drive
