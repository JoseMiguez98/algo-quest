name: Bug
description: Something doesn't work or an algorithm shows a wrong step.
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: URL
      description: The page where it happens. If you used the playground, copy the link with the share button.
      placeholder: https://josemiguez98.github.io/algo-quest/sorting/quick-sort/?d=5,3,8
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: If the algorithm is wrong, give the step number and why it's incorrect (with a reference if you can).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open …
        2. Press …
  - type: input
    id: env
    attributes:
      label: Browser, OS and theme
      placeholder: Chrome 140, macOS, Mega Drive theme
