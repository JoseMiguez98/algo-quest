name: New algorithm
description: Propose an algorithm (or a category) to visualize.
labels: [algorithm]
body:
  - type: input
    id: name
    attributes:
      label: Algorithm
      placeholder: Comb sort
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Sorting
        - Graphs / traversals
        - New category (explain below)
    validations:
      required: true
  - type: textarea
    id: variant
    attributes:
      label: Variant and references
      description: The exact variant (pivot, gap sequence, tie-breaking…) and 2–3 sources that describe it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it teaches
      description: What new idea it brings compared to the algorithms already on the site.
  - type: checkboxes
    id: doing
    attributes:
      label: Will you implement it?
      options:
        - label: I want to implement it following CONTRIBUTING.md
