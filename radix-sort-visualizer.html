<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LSD Radix Sort - 16-bit Visualizer</title>
<style>
html,body{margin:0;height:100%;background:#0e0f1a;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Courier New",monospace}
#screen{display:block;background:#0e0f1a;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 8px 4px}
button{font:bold 13px "Courier New",monospace;letter-spacing:1px;text-transform:uppercase;color:#f4f4f4;background:#3b5dc9;border:0;border-radius:0;padding:7px 11px;cursor:pointer;
box-shadow:inset -3px -3px 0 #29366f,inset 3px 3px 0 #73eff7,0 0 0 2px #0e0f1a,0 0 0 4px #566c86}
button:hover{background:#41a6f6}
button:active{box-shadow:inset 3px 3px 0 #29366f,inset -3px -3px 0 #73eff7,0 0 0 2px #0e0f1a,0 0 0 4px #566c86}
button:disabled{opacity:.4;cursor:default;background:#3b5dc9}
</style>
</head>
<body>
<canvas id="screen" aria-label="LSD Radix Sort visualizer"></canvas>
<div id="bar">
<button id="bStart">Start</button>
<button id="bPause">Pause</button>
<button id="bStep">Step</button>
<button id="bReset">Reset</button>
<button id="bShuffle">Shuffle</button>
<button id="bSound">Sound: On</button>
<button id="bSpeed">Speed 1x</button>
<button id="bIds">IDs: On</button>
</div>
<script>
(() => {
'use strict';
/* ================= CONSTANTS / PALETTE ================= */
const W = 128, H = 96;
const HEX = ['#0e0f1a','#1a1c2c','#262b44','#3a4466','#566c86','#94b0c2','#f4f4f4','#ffcd75','#ef7d57','#b13e53','#5d275d','#a7f070','#38b764','#257179','#73eff7','#41a6f6','#3b5dc9','#f6757a','#b55088','#333c57','#d5e4f0','#ffe9a8','#1e4a35','#29366f'];
const cBG=0,cPANEL=1,cPANEL2=2,cLINE=3,cDIM=4,cMID=5,cWHITE=6,cYEL=7,cORG=8,cLGRN=11,cCYAN=14,cPINK=17,cLIGHT=20,cCREAM=21,cDGRN=22,cCOLHI=23,cBLUE=15;
const PC = [cORG, cLGRN, cCYAN, cPINK, cYEL, cBLUE];
const NAMES = ['ONES','TENS','HUNDREDS','THOUSANDS'];
const dname = p => NAMES[p] || ('DIGIT ' + p);
const PAL = new Uint32Array(HEX.length);
HEX.forEach((h, i) => {
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  PAL[i] = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
});

/* ================= RENDERING PRIMITIVES (integer framebuffer) ================= */
const img = new ImageData(W, H);
const fb = new Uint32Array(img.data.buffer);
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const bctx = buf.getContext('2d');
const scr = document.getElementById('screen');
const sctx = scr.getContext('2d');
let scale = 4;

function pset(x, y, c) { if (x < 0 || y < 0 || x >= W || y >= H) return; fb[y * W + x] = PAL[c]; }
function rect(x, y, w, h, c) {
  const x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(W, x + w), y1 = Math.min(H, y + h);
  const col = PAL[c];
  for (let yy = y0; yy < y1; yy++) { const o = yy * W; for (let xx = x0; xx < x1; xx++) fb[o + xx] = col; }
}
function outline(x, y, w, h, c) {
  for (let i = 0; i < w; i++) { pset(x + i, y, c); pset(x + i, y + h - 1, c); }
  for (let j = 0; j < h; j++) { pset(x, y + j, c); pset(x + w - 1, y + j, c); }
}
function dv(x, y0, y1, c) { for (let y = y0; y <= y1; y++) if ((y & 1) === 0) pset(x, y, c); }
function dh(y, x0, x1, c) { for (let x = x0; x <= x1; x++) if ((x & 1) === 0) pset(x, y, c); }

/* 3x5 pixel font */
const FONT = Object.create(null);
(function () {
  const src = {
    'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110','E':'111100110100111',
    'F':'111100110100100','G':'011100101101011','H':'101101111101101','I':'111010010010111','J':'001001001101010',
    'K':'101101110101101','L':'100100100100111','M':'101111111101101','N':'111101101101101','O':'010101101101010',
    'P':'110101110100100','Q':'010101101111011','R':'110101110101101','S':'011100010001110','T':'111010010010010',
    'U':'101101101101111','V':'101101101101010','W':'101101111111101','X':'101101010101101','Y':'101101010010010',
    'Z':'111001010100111',
    '0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001',
    '5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
    ':':'000010000010000','.':'000000000000010','-':'000000111000000','>':'100010001010100','<':'001010100010001',
    '/':'001001010100100','=':'000111000111000','+':'000010111010000','(':'010100100100010',')':'010001001001010',
    '[':'110100100100110',']':'011001001001011',',':'000000000010100','!':'010010010000010','^':'010111010010010',
    '_':'000000000000111','*':'101010111010101','?':'110001010000010','%':'101001010100101'
  };
  for (const k in src) { const s = src[k], a = new Uint8Array(15); for (let i = 0; i < 15; i++) a[i] = s.charCodeAt(i) === 49 ? 1 : 0; FONT[k] = a; }
})();
function glyph(ch, x, y, c) {
  const g = FONT[ch]; if (!g) return;
  for (let r = 0; r < 5; r++) for (let q = 0; q < 3; q++) if (g[r * 3 + q]) pset(x + q, y + r, c);
}
function text(s, x, y, c) { s = String(s).toUpperCase(); for (let i = 0; i < s.length; i++) glyph(s[i], x + i * 4, y, c); }
function tw(s) { return String(s).length * 4 - 1; }
const pad3 = v => v < 10 ? '00' + v : v < 100 ? '0' + v : '' + v;

/* ================= DETERMINISTIC DATA ================= */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const BASE = [329, 457, 657, 839, 436, 720, 355, 102, 598, 241];
const N = BASE.length, SEED = 20260926;
let shuffleN = 0;

/* ================= 1. ALGORITHM LAYER ================= */
const S = {
  arr: new Int32Array(N), ids: new Int32Array(N), out: new Int32Array(N), outIds: new Int32Array(N),
  count: new Int32Array(10), placed: new Int32Array(10),   // placed: visual-only, used to flag "same digit" for stability
  max: 0, exp: 0, digitPos: -1, pass: 0, totalPasses: 0,
  inIdx: -1, cIdx: -1, curVal: -1, curDigit: -1, outPos: -1,
  countOps: 0, writes: 0, comparisons: 0, completedPasses: 0, done: false, phase: 'IDLE'
};
function loadData() {
  const d = BASE.slice();
  if (shuffleN > 0) {
    const r = mulberry32(SEED + shuffleN * 7919);
    for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = d[i]; d[i] = d[j]; d[j] = t; }
  }
  for (let i = 0; i < N; i++) { S.arr[i] = d[i]; S.ids[i] = i; }
  S.out.fill(-1); S.outIds.fill(-1); S.count.fill(0); S.placed.fill(0);
  S.max = Math.max.apply(null, d);
  S.totalPasses = 0; for (let e = 1; Math.floor(S.max / e) > 0; e *= 10) S.totalPasses++;
  S.exp = 0; S.digitPos = -1; S.pass = 0; S.inIdx = -1; S.cIdx = -1; S.curVal = -1; S.curDigit = -1; S.outPos = -1;
  S.countOps = 0; S.writes = 0; S.comparisons = 0; S.completedPasses = 0; S.done = false; S.phase = 'IDLE';
}

/* ================= 2. EVENT LAYER (single reused event object) ================= */
const EV = { type: '', i: -1, d: -1, v: -1, a: 0, b: 0 };
function E(t, i, d, v, a, b) {
  EV.type = t; EV.i = i === undefined ? -1 : i; EV.d = d === undefined ? -1 : d; EV.v = v === undefined ? -1 : v; EV.a = a || 0; EV.b = b || 0; return EV;
}
const listeners = [];
function emit(e) { for (let i = 0; i < listeners.length; i++) listeners[i](e); }
const DUR = { RESET:0, SORT_START:800, DIGIT_PASS_START:1000, DIGIT_SELECTED:800, READ_VALUE:140, DIGIT_EXTRACTED:320, COUNT_INCREMENT:280,
  COUNT_PHASE_COMPLETE:800, PREFIX_SUM_START:900, PREFIX_SUM_STEP:460, PREFIX_SUM_COMPLETE:900, OUTPUT_PHASE_START:1000,
  OUTPUT_VALUE_SELECTED:160, OUTPUT_POSITION_CALCULATED:420, OUTPUT_WRITE_START:460, OUTPUT_WRITE_COMPLETE:120, COUNT_DECREMENT:280,
  OUTPUT_PHASE_COMPLETE:800, COPY_BACK_START:800, COPY_BACK_STEP:280, DIGIT_PASS_COMPLETE:1400, NEXT_DIGIT:1000, SORT_COMPLETE:0 };

/* The real LSD Radix Sort with a stable counting sort per digit, as a generator: one yield = one meaningful event.
   Event fields: i=index, d=digit, v=value, a/b = event specific numbers (see explain()). */
function* radixGen() {
  const n = S.arr.length;
  S.max = Math.max(...S.arr);
  S.totalPasses = 0; for (let e = 1; Math.floor(S.max / e) > 0; e *= 10) S.totalPasses++;
  yield E('SORT_START');
  let p = 0;
  for (let exp = 1; Math.floor(S.max / exp) > 0; exp *= 10, p++) {
    // ---- countingSortByDigit(array, exp) ----
    S.exp = exp; S.digitPos = p; S.pass = p + 1;
    S.count.fill(0); S.out.fill(-1); S.outIds.fill(-1); S.placed.fill(0);
    S.inIdx = -1; S.cIdx = -1; S.curVal = -1; S.curDigit = -1; S.outPos = -1; S.phase = 'COUNT';
    yield E('DIGIT_PASS_START', S.pass, -1, -1, S.totalPasses, exp);
    yield E('DIGIT_SELECTED', p);
    // count digit frequencies
    for (let i = 0; i < n; i++) {
      S.inIdx = i; S.curVal = S.arr[i]; S.curDigit = -1;
      yield E('READ_VALUE', i, -1, S.curVal);
      const d = Math.floor(S.arr[i] / exp) % 10; S.curDigit = d;
      yield E('DIGIT_EXTRACTED', i, d, S.curVal);
      const old = S.count[d]; S.count[d]++; S.countOps++;
      yield E('COUNT_INCREMENT', i, d, S.curVal, old, S.count[d]);
    }
    S.inIdx = -1; S.curVal = -1; S.curDigit = -1;
    yield E('COUNT_PHASE_COMPLETE');
    // cumulative counts
    S.phase = 'PREFIX'; S.cIdx = 0;
    yield E('PREFIX_SUM_START');
    for (let k = 1; k < 10; k++) {
      S.cIdx = k;
      const a = S.count[k], b = S.count[k - 1];
      S.count[k] += S.count[k - 1];
      yield E('PREFIX_SUM_STEP', k, -1, S.count[k], a, b);
    }
    yield E('PREFIX_SUM_COMPLETE');
    // stable placement, right to left
    S.phase = 'OUTPUT'; S.cIdx = -1;
    yield E('OUTPUT_PHASE_START');
    for (let i = n - 1; i >= 0; i--) {
      S.inIdx = i; S.curVal = S.arr[i]; S.curDigit = -1; S.outPos = -1;
      yield E('OUTPUT_VALUE_SELECTED', i, -1, S.curVal);
      const d = Math.floor(S.arr[i] / exp) % 10; S.curDigit = d;
      yield E('DIGIT_EXTRACTED', i, d, S.curVal);
      const pos = S.count[d] - 1; S.outPos = pos;
      yield E('OUTPUT_POSITION_CALCULATED', i, d, S.curVal, S.count[d], pos);
      S.out[pos] = S.arr[i]; S.outIds[pos] = S.ids[i]; S.writes++;
      const same = S.placed[d] > 0 ? 1 : 0; S.placed[d]++;
      yield E('OUTPUT_WRITE_START', i, d, S.curVal, pos, same);
      yield E('OUTPUT_WRITE_COMPLETE', i, d, S.curVal, pos, same);
      const old = S.count[d]; S.count[d]--;
      yield E('COUNT_DECREMENT', i, d, S.curVal, old, S.count[d]);
    }
    S.inIdx = -1; S.curVal = -1; S.curDigit = -1; S.outPos = -1;
    yield E('OUTPUT_PHASE_COMPLETE');
    // copy back
    S.phase = 'COPY';
    yield E('COPY_BACK_START');
    for (let i = 0; i < n; i++) {
      S.arr[i] = S.out[i]; S.ids[i] = S.outIds[i];
      yield E('COPY_BACK_STEP', i, -1, S.arr[i]);
    }
    S.completedPasses++; S.phase = 'PASSDONE';
    yield E('DIGIT_PASS_COMPLETE', S.pass);
    if (Math.floor(S.max / (exp * 10)) > 0) yield E('NEXT_DIGIT', p + 1);
  }
  S.phase = 'DONE'; S.done = true;
  yield E('SORT_COMPLETE');
}

/* ================= EXPLANATION PANEL ================= */
let msgL = ['', ''], msgC = cLIGHT;
function setMsg(s, col) {
  const out = [];
  for (const part of s.split('\n')) {
    let line = '';
    for (const w of part.split(' ')) {
      if (line && line.length + 1 + w.length > 31) { out.push(line); line = w; } else line = line ? line + ' ' + w : w;
    }
    out.push(line);
  }
  msgL[0] = out[0] || ''; msgL[1] = out[1] || ''; msgC = col === undefined ? cLIGHT : col;
}
function explain(e) {
  const nm = dname(S.digitPos);
  switch (e.type) {
    case 'RESET': setMsg('PRESS START OR STEP.\nSHUFFLE CHANGES THE ORDER.'); break;
    case 'SORT_START': setMsg('LSD RADIX SORT: LEAST\nSIGNIFICANT DIGIT FIRST.'); break;
    case 'DIGIT_PASS_START': setMsg((e.i === e.a ? 'FINAL PASS ' : 'PASS ') + e.i + ' OF ' + e.a + ': ' + nm + '\nEXP=' + e.b + '. COUNTS START AT ZERO.'); break;
    case 'DIGIT_SELECTED': setMsg('THE CURRENT DIGIT: ' + nm + '.\nONLY THAT DIGIT MATTERS NOW.'); break;
    case 'READ_VALUE': setMsg('READ VALUE ' + pad3(e.v) + '.\nNO FULL-NUMBER COMPARISON.'); break;
    case 'DIGIT_EXTRACTED': setMsg(pad3(e.v) + ' HAS A ' + nm + ' DIGIT OF ' + e.d + '.\nFLOOR(' + e.v + '/' + S.exp + ')%10 = ' + e.d); break;
    case 'COUNT_INCREMENT': setMsg('COUNT[' + e.d + ']: ' + e.a + ' > ' + e.b + '\nCOUNTING DIGITS 0 THROUGH 9.'); break;
    case 'COUNT_PHASE_COMPLETE': setMsg('FREQUENCIES COMPLETE.\nNEXT: BUILD PREFIX SUMS.'); break;
    case 'PREFIX_SUM_START': setMsg('PREFIX SUMS:\nCOUNT[I] += COUNT[I-1]'); break;
    case 'PREFIX_SUM_STEP': setMsg('COUNT[' + e.i + '] = ' + e.a + ' + ' + e.b + ' = ' + e.v + '\n' + e.v + ' ITEMS HAVE DIGIT <= ' + e.i + '.'); break;
    case 'PREFIX_SUM_COMPLETE': setMsg('PREFIX SUMS TURN COUNTS INTO\nOUTPUT POSITIONS.'); break;
    case 'OUTPUT_PHASE_START': setMsg('STABLE OUTPUT: SCAN THE INPUT\nFROM RIGHT TO LEFT.'); break;
    case 'OUTPUT_VALUE_SELECTED': setMsg('SELECT ' + pad3(e.v) + ' AT INDEX ' + e.i + '.\nRIGHT>LEFT KEEPS IT STABLE.'); break;
    case 'OUTPUT_POSITION_CALCULATED': setMsg('POS = COUNT[' + e.d + ']-1 = ' + e.a + '-1 = ' + e.b + '\nNO SEARCH FOR EMPTY SLOTS.'); break;
    case 'OUTPUT_WRITE_START':
      if (e.b) setMsg('SAME DIGIT\nPRESERVE ORDER', cPINK);
      else setMsg('OUTPUT[' + e.a + '] = ' + pad3(e.v) + '\nPOSITION COMES FROM THE COUNT.');
      break;
    case 'COUNT_DECREMENT': setMsg('COUNT[' + e.d + ']--: ' + e.a + ' > ' + e.b + '\nNEXT EQUAL DIGIT GOES LEFT.'); break;
    case 'OUTPUT_PHASE_COMPLETE': setMsg('OUTPUT COMPLETE: STABLE ORDER\nBY THE CURRENT DIGIT.'); break;
    case 'COPY_BACK_START': setMsg('COPY BACK: ARRAY[I]=OUTPUT[I].\nNEXT PASS USES THIS ORDER.'); break;
    case 'COPY_BACK_STEP': setMsg('ARRAY[' + e.i + '] = ' + pad3(e.v) + '\nOUTPUT COPIED BACK TO INPUT.'); break;
    case 'DIGIT_PASS_COMPLETE':
      if (e.i === S.totalPasses) setMsg(nm + ' PASS COMPLETE.\nALL DIGIT POSITIONS DONE.', cYEL);
      else setMsg(nm + ' COMPLETE. STABLE PASS:\nEQUAL DIGITS KEEP PRIOR ORDER.', cYEL);
      break;
    case 'NEXT_DIGIT': setMsg('NEXT: ' + dname(e.i) + ' REFINES THE\n' + dname(e.i - 1) + ' PASS ORDER.'); break;
    case 'SORT_COMPLETE': setMsg('ALL DIGIT POSITIONS PROCESSED.\nSORTED. COST GROWS WITH D.', cLGRN); break;
  }
}

/* ================= 3. ANIMATION LAYER ================= */
const IB = [{ x: 2, w: 36, l: 'HUNDREDS' }, { x: 42, w: 20, l: 'TENS' }, { x: 66, w: 20, l: 'ONES' }];
const CXo = i => 4 + 12 * i;
const lx = i => 4 + 12 * i + 8;
const Y_IN = 21, Y_OUT = 61;
const ease = t => t * t * (3 - 2 * t);
const PN = 64;
const P = { x: new Float32Array(PN), y: new Float32Array(PN), vx: new Float32Array(PN), vy: new Float32Array(PN), l: new Float32Array(PN), c: new Uint8Array(PN) };
let ps = 12345;
function pr() { ps = (Math.imul(ps, 1664525) + 1013904223) >>> 0; return ps / 4294967296; }
function spawn(x, y, n, c1, c2, sp) {
  let k = 0;
  for (let i = 0; i < PN && k < n; i++) if (P.l[i] <= 0) {
    const a = pr() * 6.2832, s = (0.4 + pr() * 0.6) * sp;
    P.x[i] = x; P.y[i] = y; P.vx[i] = Math.cos(a) * s; P.vy[i] = Math.sin(a) * s - 10; P.l[i] = 350 + pr() * 300; P.c[i] = pr() < 0.5 ? c1 : c2; k++;
  }
}
const A = {
  fl: [], hidIn: new Uint8Array(N), hidOut: new Uint8Array(N),
  flC: new Float32Array(10), flK: new Uint8Array(10), flO: new Float32Array(N), flI: new Float32Array(N),
  link: { i: -1, d: -1, o: -1 }, notice: { a: -1, b: -1 },
  cur: { fx: IB[2].x, fw: IB[2].w, tx: IB[2].x, tw: IB[2].w, t: 9999 }
};
for (let i = 0; i < 12; i++) A.fl.push({ on: false, kind: 0, x0: 0, y0: 0, x1: 0, y1: 0, t: 0, dur: 1, v: 0, idx: 0 });
const curT = () => Math.min(1, A.cur.t / 350);
A.curX = () => Math.round(A.cur.fx + (A.cur.tx - A.cur.fx) * ease(curT()));
A.curW = () => Math.round(A.cur.fw + (A.cur.tw - A.cur.fw) * ease(curT()));
function startFlight(kind, x0, y0, x1, y1, dur, v, idx) {
  for (let i = 0; i < A.fl.length; i++) { const f = A.fl[i]; if (!f.on) { f.on = true; f.kind = kind; f.x0 = x0; f.y0 = y0; f.x1 = x1; f.y1 = y1; f.t = 0; f.dur = dur; f.v = v; f.idx = idx; return; } }
}
A.reset = function () {
  for (const f of A.fl) f.on = false;
  A.flC.fill(0); A.flO.fill(0); A.flI.fill(0);
  A.link.i = A.link.d = A.link.o = -1; A.notice.a = A.notice.b = -1;
  A.cur.fx = A.cur.tx = IB[2].x; A.cur.fw = A.cur.tw = IB[2].w; A.cur.t = 9999;
  P.l.fill(0); ps = 12345;
};
A.finishAll = function () {
  for (const f of A.fl) f.on = false;
  A.flC.fill(0); A.flO.fill(0); A.flI.fill(0); A.cur.t = 9999;
};
A.onEvent = function (e) {
  switch (e.type) {
    case 'RESET': A.reset(); break;
    case 'DIGIT_PASS_START': {
      const b = IB[2 - S.digitPos];
      A.cur.fx = A.curX(); A.cur.fw = A.curW(); A.cur.tx = b.x; A.cur.tw = b.w; A.cur.t = 0;
      A.link.i = A.link.d = A.link.o = -1; A.notice.a = A.notice.b = -1;
      if (e.i > 1) spawn(b.x + (b.w >> 1), 10, 10, PC[S.digitPos], cCREAM, 40);
      break;
    }
    case 'READ_VALUE': A.link.i = A.link.d = A.link.o = -1; A.flI[e.i] = 1; break;
    case 'DIGIT_EXTRACTED': A.link.i = e.i; A.link.d = e.d; A.link.o = -1; break;
    case 'COUNT_INCREMENT': A.flC[e.d] = 1; A.flK[e.d] = 0; break;
    case 'COUNT_PHASE_COMPLETE': case 'PREFIX_SUM_START': A.link.i = A.link.d = A.link.o = -1; break;
    case 'PREFIX_SUM_STEP': A.flC[e.i] = 1; A.flK[e.i] = 1; break;
    case 'OUTPUT_VALUE_SELECTED': A.link.i = A.link.d = A.link.o = -1; A.notice.a = A.notice.b = -1; A.flI[e.i] = 1; break;
    case 'OUTPUT_POSITION_CALCULATED': A.link.i = e.i; A.link.d = e.d; A.link.o = e.b; break;
    case 'OUTPUT_WRITE_START':
      startFlight(0, CXo(e.i), Y_IN, CXo(e.a), Y_OUT, 420, e.v, e.a);
      if (e.b) { A.notice.a = e.a; A.notice.b = e.a + 1; }
      break;
    case 'OUTPUT_WRITE_COMPLETE': A.flO[e.a] = 1; spawn(CXo(e.a) + 5, Y_OUT + 3, 7, PC[S.digitPos], cWHITE, 40); break;
    case 'COUNT_DECREMENT': A.flC[e.d] = 1; A.flK[e.d] = 2; break;
    case 'OUTPUT_PHASE_COMPLETE': A.link.i = A.link.d = A.link.o = -1; A.notice.a = A.notice.b = -1; break;
    case 'COPY_BACK_STEP': startFlight(1, CXo(e.i), Y_OUT, CXo(e.i), Y_IN, 250, e.v, e.i); break;
    case 'DIGIT_PASS_COMPLETE': spawn(64, 24, 14, PC[S.digitPos], cCREAM, 45); break;
    case 'SORT_COMPLETE': spawn(64, 24, 48, cYEL, cLGRN, 70); break;
  }
};
A.update = function (adv) {
  for (const f of A.fl) if (f.on) { f.t += adv; if (f.t >= f.dur) f.on = false; }
  const k = adv / 320;
  for (let i = 0; i < 10; i++) if (A.flC[i] > 0) A.flC[i] = Math.max(0, A.flC[i] - k);
  for (let i = 0; i < N; i++) { if (A.flO[i] > 0) A.flO[i] = Math.max(0, A.flO[i] - k); if (A.flI[i] > 0) A.flI[i] = Math.max(0, A.flI[i] - k); }
  A.cur.t += adv;
  const s = adv / 1000;
  for (let i = 0; i < PN; i++) if (P.l[i] > 0) { P.l[i] -= adv; P.x[i] += P.vx[i] * s; P.y[i] += P.vy[i] * s; P.vy[i] += 70 * s; }
};

/* ================= 5. AUDIO LAYER ================= */
const AU = {
  ctx: null, on: true, nb: null,
  init() {
    if (!this.ctx) {
      try {
        const C = window.AudioContext || window.webkitAudioContext;
        if (C) {
          this.ctx = new C();
          const c = this.ctx, b = c.createBuffer(1, Math.floor(c.sampleRate * 0.15), c.sampleRate), d = b.getChannelData(0);
          let s = 1; for (let i = 0; i < d.length; i++) { s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }
          this.nb = b;
        }
      } catch (err) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d, type, vol, slide, delay) {
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.linearRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.05, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d, vol) {
    if (!this.ctx || !this.on || !this.nb) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), g = c.createGain();
    s.buffer = this.nb; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(g); g.connect(c.destination); s.start(t); s.stop(t + d + 0.01);
  },
  onEvent(e) {
    if (!this.ctx || !this.on) return;
    switch (e.type) {
      case 'DIGIT_SELECTED': this.tone(440, 0.09, 'square', 0.05); break;
      case 'DIGIT_EXTRACTED': this.tone(880, 0.04, 'square', 0.04); break;
      case 'COUNT_INCREMENT': this.tone(1320, 0.03, 'triangle', 0.06); break;
      case 'PREFIX_SUM_STEP': this.tone(523, 0.05, 'square', 0.04); this.tone(784, 0.06, 'square', 0.04, 0, 0.06); break;
      case 'OUTPUT_WRITE_START': this.tone(700, 0.1, 'square', 0.05, 320); break;
      case 'OUTPUT_WRITE_COMPLETE': this.noise(0.05, 0.05); break;
      case 'COPY_BACK_STEP': this.tone(300, 0.05, 'triangle', 0.07); break;
      case 'DIGIT_PASS_COMPLETE': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.09, 'square', 0.05, 0, i * 0.08)); break;
      case 'SORT_COMPLETE': [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.14, i % 2 ? 'triangle' : 'square', 0.06, 0, i * 0.11)); break;
    }
  }
};

/* ================= ENGINE ================= */
let it = null, auto = false, frozen = false, wait = 0, grace = 0, speedIdx = 0, finished = false, curType = '', showIds = true;
const SPEEDS = [1, 2, 4];
listeners.push(A.onEvent, explain, e => AU.onEvent(e), e => { if (e.type === 'SORT_COMPLETE' || e.type === 'RESET') syncUI(); });
function newRun() { it = radixGen(); auto = false; frozen = false; wait = 0; grace = 0; finished = false; }
function loadAll() { loadData(); newRun(); A.reset(); emit(E('RESET')); syncUI(); }
function stepEvent() {
  if (finished) return false;
  const r = it.next();
  if (r.done) { finished = true; return false; }
  const e = r.value; curType = e.type;
  emit(e);
  wait += DUR[e.type] || 300;
  if (e.type === 'SORT_COMPLETE') { finished = true; auto = false; }
  return true;
}
function doStep() {
  if (finished) return;
  A.finishAll(); auto = false; frozen = true; wait = 0;
  stepEvent();
  grace = (DUR[curType] || 300) + 60;
  syncUI();
}
let last = 0;
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  let adv = dt * SPEEDS[speedIdx];
  if (frozen) { if (grace > 0) { const g = Math.min(adv, grace); grace -= g; adv = g; } else adv = 0; }
  if (adv > 0) {
    A.update(adv);
    if (auto && !finished) { wait -= adv; let g = 0; while (wait <= 0 && !finished && g++ < 3) stepEvent(); }
  }
  draw();
  requestAnimationFrame(frame);
}

/* ================= 4. RENDERING LAYER (reads state only) ================= */
function digitOf(v, k) { return Math.floor(v / (k === 0 ? 100 : k === 1 ? 10 : 1)) % 10; }
function cell(x, y, v, bg, base, hi, box, pc) {
  rect(x, y, 11, 7, bg);
  for (let k = 0; k < 3; k++) {
    const dx = x + k * 4, d = String(digitOf(v, k)), act = hi && (2 - k) === S.digitPos;
    if (act) {
      if (box) { rect(dx, y, 3, 7, pc); glyph(d, dx, y + 1, cBG); }
      else { rect(dx, y, 3, 7, cCOLHI); glyph(d, dx, y + 1, pc); }
    } else glyph(d, dx, y + 1, base);
  }
}
const pcol = () => S.digitPos >= 0 ? PC[S.digitPos] : cMID;

function drawLinks() {
  const L = A.link; if (L.i < 0) return;
  const c = pcol(), li = lx(L.i);
  dv(li, 28, 34, c);
  if (L.d >= 0) {
    const ld = lx(L.d);
    dh(34, Math.min(li, ld), Math.max(li, ld), c); dv(ld, 34, 46, c);
    if (L.o >= 0) { const lo = lx(L.o); dh(54, Math.min(ld, lo), Math.max(ld, lo), c); dv(lo, 54, 60, c); }
  }
}
function drawTitle() {
  text('RADIX SORT', 2, 1, cCREAM); text('LSD/BASE 10', 46, 1, cMID);
  text('PASS ' + (S.phase === 'IDLE' ? 0 : S.pass) + '/' + S.totalPasses, 94, 1, cYEL);
}
function drawIndicator() {
  const started = S.phase !== 'IDLE', dp = S.digitPos, done = S.phase === 'DONE';
  for (let k = 0; k < 3; k++) { const p = 2 - k; rect(IB[k].x, 7, IB[k].w, 7, started && (p < dp || done) ? cDGRN : cPANEL2); }
  let cx = 0, cw = 0;
  if (started) { cx = A.curX(); cw = A.curW(); rect(cx, 7, cw, 7, done ? cLGRN : PC[dp]); }
  for (let k = 0; k < 3; k++) {
    const b = IB[k], p = 2 - k, mid = b.x + (b.w >> 1);
    let col = cMID;
    if (started) col = (mid >= cx && mid < cx + cw) ? cBG : (p < dp || done ? cLGRN : cDIM);
    text(b.l, b.x + 2, 8, col);
  }
  text('<', 39, 8, cLINE); text('<', 62, 8, cLINE);
  text('EXP=' + (started ? S.exp : '-'), 94, 8, pcol());
}
function inLabel() {
  switch (S.phase) {
    case 'IDLE': return ['ORIGINAL ORDER', cMID];
    case 'DONE': return ['SORTED', cLGRN];
    case 'PASSDONE': return ['AFTER ' + dname(S.digitPos), cYEL];
    case 'COPY': return ['COPY BACK', cMID];
    default: return ['DIGIT PASS: ' + dname(S.digitPos), pcol()];
  }
}
function drawInput() {
  text('INPUT', 2, 15, cMID);
  const l = inLabel(); text(l[0], 126 - tw(l[0]), 15, l[1]);
  const act = S.phase !== 'IDLE', done = S.phase === 'DONE', pc = pcol();
  for (let i = 0; i < N; i++) {
    const x = CXo(i);
    if (A.hidIn[i]) { rect(x, Y_IN, 11, 7, cPANEL); continue; }
    const cur = i === S.inIdx && (S.phase === 'COUNT' || S.phase === 'OUTPUT');
    const consumed = S.phase === 'OUTPUT' && S.inIdx >= 0 && i > S.inIdx;
    cell(x, Y_IN, S.arr[i], done ? cDGRN : (A.flI[i] > 0 ? cPANEL2 : cPANEL), done ? cLGRN : (consumed ? cDIM : cLIGHT), act && !done, cur, pc);
    if (cur) outline(x - 1, Y_IN - 1, 13, 9, cYEL);
    if (showIds) {
      if (cur) glyph('^', x + (2 - S.digitPos) * 4, 29, pc);
      else glyph(String.fromCharCode(65 + S.ids[i]), x + 4, 29, cDIM);
    }
  }
}
function drawCounts() {
  if (S.phase === 'DONE') {
    rect(2, 34, 124, 21, cPANEL); outline(2, 34, 124, 21, cLINE);
    text('TIME O(D*(N+K)) N=' + N + ' K=10 D=' + S.totalPasses, 5, 36, cCREAM);
    text('SPACE O(N+K)  STABLE: YES', 5, 42, cLGRN);
    text('COMPARISON SORT: NO', 5, 48, cYEL);
    return;
  }
  const pc = pcol();
  text('COUNT[0-9]', 2, 35, cMID);
  const ph = { COUNT: 'FREQUENCIES', PREFIX: 'PREFIX SUMS', OUTPUT: 'POSITIONS', COPY: 'DONE', PASSDONE: 'DONE', IDLE: 'ALL ZERO' }[S.phase] || '';
  text(ph, 46, 35, pc);
  const ops = 'OPS ' + S.countOps; text(ops, 126 - tw(ops), 35, cMID);
  const cumu = S.phase === 'OUTPUT' || S.phase === 'COPY' || S.phase === 'PASSDONE';
  for (let d = 0; d < 10; d++) {
    const x = CXo(d), v = S.count[d];
    const cd = (S.phase === 'COUNT' || S.phase === 'OUTPUT') && S.curDigit === d && S.inIdx >= 0;
    glyph(String(d), x + 4, 41, cd ? pc : cDIM);
    const f = A.flC[d];
    let bg = cPANEL, fg = v === 0 ? cDIM : cWHITE;
    if (cumu || (S.phase === 'PREFIX' && d <= S.cIdx)) { if (v > 0) fg = cYEL; }
    if (f > 0.5) { bg = A.flK[d] === 0 ? cCREAM : A.flK[d] === 1 ? cCYAN : cORG; fg = cBG; } else if (f > 0) bg = cPANEL2;
    rect(x, 47, 11, 7, bg);
    const s = String(v); text(s, x + (s.length > 1 ? 2 : 4), 48, fg);
    if (cd) outline(x - 1, 46, 13, 9, pc);
    if (S.phase === 'PREFIX') { if (d === S.cIdx) outline(x - 1, 46, 13, 9, cYEL); else if (d === S.cIdx - 1) outline(x - 1, 46, 13, 9, cCYAN); }
  }
}
function drawOutput() {
  text('OUTPUT', 2, 55, cMID);
  const mid = S.phase === 'OUTPUT' ? 'STABLE R>L' : S.phase === 'COPY' ? 'COPYING' : '';
  text(mid, 34, 55, pcol());
  const wr = 'WR ' + S.writes; text(wr, 126 - tw(wr), 55, cMID);
  const act = S.phase !== 'IDLE', pc = pcol();
  for (let i = 0; i < N; i++) {
    const x = CXo(i), v = S.out[i];
    if (v < 0 || A.hidOut[i]) { rect(x, Y_OUT, 11, 7, cPANEL); glyph(String(i), x + 4, Y_OUT + 1, cLINE); }
    else {
      cell(x, Y_OUT, v, A.flO[i] > 0.5 ? cPANEL2 : cPANEL, cLIGHT, act, false, pc);
      if (showIds) glyph(String.fromCharCode(65 + S.outIds[i]), x + 4, 69, cDIM);
    }
    if (A.flO[i] > 0) outline(x - 1, Y_OUT - 1, 13, 9, cCREAM);
    if (i === A.notice.a || i === A.notice.b) outline(x - 1, Y_OUT - 1, 13, 9, cPINK);
  }
  if (A.notice.a >= 0 && A.notice.b < N) for (let x = CXo(A.notice.a) + 4; x <= CXo(A.notice.b) + 6; x++) pset(x, Y_OUT - 2, cPINK);
}
function drawFlights() {
  for (const f of A.fl) {
    if (!f.on) continue;
    const e = ease(Math.min(1, f.t / f.dur));
    const x = Math.round(f.x0 + (f.x1 - f.x0) * e), y = Math.round(f.y0 + (f.y1 - f.y0) * e);
    cell(x, y, f.v, cPANEL2, cWHITE, true, true, pcol());
    outline(x - 1, y - 1, 13, 9, cWHITE);
  }
}
function drawParticles() {
  for (let i = 0; i < PN; i++) if (P.l[i] > 0) pset(Math.round(P.x[i]), Math.round(P.y[i]), P.c[i]);
}
function hudStr() {
  if (S.phase === 'DONE') return 'PASSES ' + S.completedPasses + '/' + S.totalPasses + ' OPS ' + S.countOps + ' WR ' + S.writes + ' CMP ' + S.comparisons;
  return 'IDX ' + (S.inIdx >= 0 ? S.inIdx : '-') + ' VAL ' + (S.curVal >= 0 ? pad3(S.curVal) : '---') + ' DIG ' + (S.curDigit >= 0 ? S.curDigit : '-') +
    ' POS ' + (S.outPos >= 0 ? S.outPos : '-') + ' CMP ' + S.comparisons;
}
function drawBottom() {
  rect(0, 75, W, 21, cPANEL); rect(0, 75, W, 1, cLINE);
  text(hudStr(), 2, 77, cYEL);
  text(msgL[0], 2, 83, msgC); text(msgL[1], 2, 89, msgC);
}
function draw() {
  A.hidIn.fill(0); A.hidOut.fill(0);
  for (const f of A.fl) if (f.on) { if (f.kind === 0) A.hidOut[f.idx] = 1; else A.hidIn[f.idx] = 1; }
  fb.fill(PAL[cBG]);
  drawLinks(); drawTitle(); drawIndicator(); drawInput(); drawCounts(); drawOutput(); drawFlights(); drawParticles(); drawBottom();
  bctx.putImageData(img, 0, 0);
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(buf, 0, 0, W * scale, H * scale);
}

/* ================= LAYOUT & UI ================= */
const bar = document.getElementById('bar');
const $ = id => document.getElementById(id);
function layout() {
  const dpr = window.devicePixelRatio || 1;
  const aw = window.innerWidth, ah = window.innerHeight - bar.offsetHeight - 12;
  let s = Math.floor(Math.min(aw * dpr / W, ah * dpr / H)); if (s < 1) s = 1;
  scale = s; scr.width = W * s; scr.height = H * s;
  scr.style.width = (W * s / dpr) + 'px'; scr.style.height = (H * s / dpr) + 'px';
  sctx.imageSmoothingEnabled = false;
}
function syncUI() {
  $('bStart').disabled = finished || (auto && !frozen);
  $('bPause').disabled = !auto;
  $('bStep').disabled = finished;
  $('bSound').textContent = 'Sound: ' + (AU.on ? 'On' : 'Off');
  $('bSpeed').textContent = 'Speed ' + SPEEDS[speedIdx] + 'x';
  $('bIds').textContent = 'IDs: ' + (showIds ? 'On' : 'Off');
}
function doStart() { AU.init(); if (finished) return; auto = true; frozen = false; grace = 0; syncUI(); }
function doPause() { auto = false; frozen = true; grace = 0; syncUI(); }
$('bStart').onclick = doStart;
$('bPause').onclick = doPause;
$('bStep').onclick = () => { AU.init(); doStep(); };
$('bReset').onclick = () => { shuffleN = 0; loadAll(); };
$('bShuffle').onclick = () => { shuffleN++; loadAll(); };
$('bSound').onclick = () => { AU.init(); AU.on = !AU.on; syncUI(); };
$('bSpeed').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; syncUI(); };
$('bIds').onclick = () => { showIds = !showIds; syncUI(); };
window.addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (k === ' ') { ev.preventDefault(); if (auto) doPause(); else doStart(); }
  else if (k === 'n' || k === 'arrowright') { AU.init(); doStep(); }
  else if (k === 'r') $('bReset').click();
  else if (k === 's') $('bShuffle').click();
  else if (k === 'm') $('bSound').click();
});
window.addEventListener('resize', layout);

layout();
loadAll();
layout();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
