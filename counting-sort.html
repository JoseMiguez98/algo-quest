<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counting Sort - 16-bit Visualizer</title>
<style>
html,body{margin:0;height:100%;background:#0d0b14;overflow:hidden;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Courier New",Courier,monospace}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0d0b14}
#bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px;padding:0 10px}
button{font:bold 13px "Courier New",Courier,monospace;letter-spacing:1px;color:#c9c5ee;background:#2c2650;border:0;border-radius:0;padding:8px 12px;cursor:pointer;
  box-shadow:0 0 0 2px #0d0b14,0 0 0 4px #7a72b8,0 6px 0 4px #4a4380;transform:translateY(0)}
button:hover{background:#4a4380;color:#fff}
button:active{transform:translateY(4px);box-shadow:0 0 0 2px #0d0b14,0 0 0 4px #7a72b8,0 2px 0 4px #4a4380}
button:focus{outline:none}
#b-start{background:#2ec27e;color:#0d0b14}
#b-pause{background:#ffd23f;color:#0d0b14}
#b-step{background:#1fb5c9;color:#0d0b14}
#b-reset{background:#e63946;color:#fff}
#b-shuffle{background:#7b5cff;color:#fff}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="bar">
  <button id="b-start">START</button>
  <button id="b-pause">PAUSE</button>
  <button id="b-step">STEP</button>
  <button id="b-reset">RESET</button>
  <button id="b-shuffle">SHUFFLE</button>
  <button id="b-sound">SOUND: ON</button>
  <button id="b-speed">SPEED: 1X</button>
</div>
<script>
'use strict';
/* =====================================================================
   COUNTING SORT - retro pixel visualizer
   Layers: Algorithm (generator) -> Events -> Animation -> Rendering -> Audio
   ===================================================================== */
const W = 128, H = 96;

/* ---------- palette (24 colours) ---------- */
const PALHEX = ['#0d0b14','#1b1730','#2c2650','#4a4380','#7a72b8','#c9c5ee','#ffffff','#e63946',
  '#ff8c42','#ffd23f','#8ac926','#2ec27e','#1fb5c9','#3a86ff','#7b5cff','#ff5db1',
  '#8a3b2a','#5c1f2a','#164b3a','#163a5c','#3d3d3d','#9a9a9a','#f4d9a6','#b56cff'];
const PAL = new Uint32Array(PALHEX.length);
for (let i = 0; i < PALHEX.length; i++) {
  const h = PALHEX[i];
  const r = parseInt(h.substr(1, 2), 16), g = parseInt(h.substr(3, 2), 16), b = parseInt(h.substr(5, 2), 16);
  PAL[i] = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
}
const C = { BG:0, PANEL:1, PANEL2:2, LINE:3, DIM:4, LIGHT:5, WHITE:6, RED:7, ORANGE:8, YELLOW:9, LIME:10,
  GREEN:11, CYAN:12, BLUE:13, VIOLET:14, PINK:15, DRED:17 };
const VCOL = [7, 8, 9, 10, 12, 13, 14, 15];   // colour per key
const VTXT = [6, 0, 0, 0, 0, 6, 6, 0];         // text colour drawn on that fill

/* ---------- pixel buffer + primitives (integer coordinates only) ---------- */
const buf = new Uint32Array(W * H);
const img = new ImageData(new Uint8ClampedArray(buf.buffer), W, H);
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d');
const cv = document.getElementById('screen');
const mctx = cv.getContext('2d');

function px(x, y, c) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return; buf[y * W + x] = PAL[c]; }
function rect(x, y, w, h, c) {
  x |= 0; y |= 0; w |= 0; h |= 0;
  const col = PAL[c];
  for (let j = Math.max(0, y); j < Math.min(H, y + h); j++)
    for (let i = Math.max(0, x); i < Math.min(W, x + w); i++) buf[j * W + i] = col;
}
function outline(x, y, w, h, c) { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
function dither(y0, y1) {
  const col = PAL[C.BG];
  for (let y = y0; y <= y1; y++) for (let x = 0; x < W; x++) if ((x + y) & 1) buf[y * W + x] = col;
}

/* ---------- 3x5 pixel font ---------- */
const GL = {
 '0':'111 101 101 101 111','1':'010 110 010 010 111','2':'111 001 111 100 111','3':'111 001 111 001 111','4':'101 101 111 001 001',
 '5':'111 100 111 001 111','6':'111 100 111 101 111','7':'111 001 010 010 010','8':'111 101 111 101 111','9':'111 101 111 001 111',
 'A':'010 101 111 101 101','B':'110 101 110 101 110','C':'011 100 100 100 011','D':'110 101 101 101 110','E':'111 100 110 100 111',
 'F':'111 100 110 100 100','G':'011 100 101 101 011','H':'101 101 111 101 101','I':'111 010 010 010 111','J':'001 001 001 101 010',
 'K':'101 101 110 101 101','L':'100 100 100 100 111','M':'101 111 111 101 101','N':'110 101 101 101 101','O':'010 101 101 101 010',
 'P':'110 101 110 100 100','Q':'010 101 101 110 011','R':'110 101 110 101 101','S':'011 100 010 001 110','T':'111 010 010 010 010',
 'U':'101 101 101 101 111','V':'101 101 101 101 010','W':'101 101 111 111 101','X':'101 101 010 101 101','Y':'101 101 010 010 010',
 'Z':'111 001 010 100 111',' ':'000 000 000 000 000','.':'000 000 000 000 010',',':'000 000 000 010 100',':':'000 010 000 010 000',
 '[':'110 100 100 100 110',']':'011 001 001 001 011','-':'000 000 111 000 000','+':'000 010 111 010 000','=':'000 111 000 111 000',
 '<':'001 010 100 010 001','>':'100 010 001 010 100','(':'010 100 100 100 010',')':'010 001 001 001 010','/':'001 001 010 100 100',
 '!':'010 010 010 000 010','?':'111 001 011 000 010','}':'010 001 111 001 010','{':'010 100 111 100 010','*':'000 101 010 101 000'
};
const FONT = {};
for (const k in GL) FONT[k] = GL[k].split(' ').map(r => parseInt(r, 2));
function text(s, x, y, c) {
  s = String(s);
  for (let n = 0; n < s.length; n++) {
    const ch = s[n];
    const g = FONT[ch] || FONT[ch.toUpperCase()];
    if (g) for (let r = 0; r < 5; r++) {
      const b = g[r];
      if (b & 4) px(x, y + r, c);
      if (b & 2) px(x + 1, y + r, c);
      if (b & 1) px(x + 2, y + r, c);
    }
    x += 4;
  }
}
function tw(s) { return String(s).length * 4 - 1; }
function textC(s, cx, y, c) { text(s, cx - (tw(s) >> 1), y, c); }

/* =====================================================================
   1. ALGORITHM LAYER  (real state + generator that yields semantic events)
   ===================================================================== */
const INITIAL = [4, 2, 7, 3, 2, 6, 4, 1, 5, 3, 2, 6];
const SEED = 0xC0FFEE;
let shuffleN = 0;
let startInput = INITIAL.slice();

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffledInput() {   // deterministic permutation of the same multiset
  shuffleN++;
  const rnd = mulberry32((SEED + Math.imul(shuffleN, 0x9E3779B1)) >>> 0);
  const a = INITIAL.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* Duplicate labels (A, B, C...) are purely educational: they never touch the numeric values. */
function makeTags(arr, mn, range) {
  const tot = new Array(range).fill(0), seen = new Array(range).fill(0);
  for (let i = 0; i < arr.length; i++) tot[arr[i] - mn]++;
  return arr.map(v => { const k = v - mn; seen[k]++; return tot[k] > 1 ? seen[k] : 0; });
}

let S;  // algorithm state
function makeState(arr) {
  const n = arr.length;
  const mx = Math.max(...arr), mn = Math.min(...arr);
  const range = mx - mn + 1;
  return {
    input: arr.slice(), n, min: mn, max: mx, range,
    count: new Array(range).fill(0),
    output: new Array(n).fill(null),
    inTag: makeTags(arr, mn, range), outTag: new Array(n).fill(0),
    placedIn: new Array(n).fill(false),
    phase: 'IDLE', i: -1, key: -1, value: -1, pos: -1, ci: -1,
    countOps: 0, writes: 0, comparisons: 0, complete: false
  };
}

/* one reusable event object */
const E = { type: '', marker: false, i: -1, key: -1, value: -1, pos: -1, before: 0, after: 0, prev: 0, cur: 0, idx: -1, cnt: 0, tag: 0, beforeTag: 0 };
function ev(type, marker) {
  E.type = type; E.marker = !!marker;
  E.i = E.key = E.value = E.pos = E.idx = -1;
  E.before = E.after = E.prev = E.cur = E.cnt = E.tag = E.beforeTag = 0;
  return E;
}

/* Stable Counting Sort, written as a generator: every yield is one semantic event,
   and the real arrays are mutated exactly where the reference algorithm mutates them. */
function* countingSortRun() {
  const input = S.input, count = S.count, output = S.output, min = S.min, n = S.n, range = S.range;

  ev('SORT_START', true); yield E;
  S.phase = 'COUNT'; ev('COUNT_PHASE_START', true); yield E;

  // PHASE 1 - count frequencies
  for (let i = 0; i < n; i++) {
    const value = input[i], key = value - min;
    S.i = i; S.value = value; S.key = key;
    ev('READ_VALUE'); E.i = i; E.value = value; E.key = key; yield E;
    const before = count[key];
    count[key]++; S.countOps++;
    ev('COUNT_INCREMENT'); E.i = i; E.value = value; E.key = key; E.before = before; E.after = count[key]; yield E;
  }
  ev('COUNT_PHASE_COMPLETE', true); yield E;

  // PHASE 2 - prefix sums
  S.phase = 'PREFIX'; S.i = -1; S.key = -1;
  ev('PREFIX_SUM_PHASE_START', true); yield E;
  for (let i = 1; i < range; i++) {
    const prev = count[i - 1], cur = count[i];
    count[i] += prev; S.countOps++; S.ci = i;
    ev('PREFIX_SUM_CALCULATE'); E.idx = i; E.prev = prev; E.cur = cur; E.before = cur; E.after = count[i]; yield E;
  }
  ev('PREFIX_SUM_COMPLETE', true); yield E;

  // PHASE 3a - stable placement, right to left
  S.phase = 'OUTPUT'; S.i = -1; S.key = -1; S.ci = -1;
  ev('OUTPUT_PHASE_START', true); yield E;
  for (let i = n - 1; i >= 0; i--) {
    const value = input[i], key = value - min;
    S.i = i; S.value = value; S.key = key; S.pos = -1;
    ev('READ_OUTPUT_VALUE'); E.i = i; E.value = value; E.key = key; E.cnt = count[key]; yield E;

    const pos = count[key] - 1;          // position = count[key] - 1
    S.pos = pos;
    ev('POSITION_CALCULATED'); E.i = i; E.value = value; E.key = key; E.cnt = count[key]; E.pos = pos; yield E;

    output[pos] = value; S.outTag[pos] = S.inTag[i]; S.placedIn[i] = true; S.writes++;
    ev('OUTPUT_WRITE_START'); E.i = i; E.value = value; E.key = key; E.pos = pos; E.tag = S.inTag[i]; yield E;
    ev('OUTPUT_WRITE_COMPLETE', true); E.i = i; E.value = value; E.key = key; E.pos = pos; E.tag = S.inTag[i]; yield E;

    const before = count[key];
    count[key]--; S.countOps++;
    ev('COUNT_DECREMENT'); E.i = i; E.value = value; E.key = key; E.before = before; E.after = count[key]; yield E;
  }
  ev('OUTPUT_PHASE_COMPLETE', true); yield E;

  // PHASE 3b - copy back
  S.phase = 'COPY'; S.i = -1; S.key = -1; S.pos = -1;
  ev('COPY_BACK_START', true); yield E;
  for (let i = 0; i < n; i++) {
    const old = input[i], oldTag = S.inTag[i];
    input[i] = output[i]; S.inTag[i] = S.outTag[i];
    S.i = i;
    ev('COPY_BACK_STEP'); E.i = i; E.value = output[i]; E.before = old; E.beforeTag = oldTag; E.tag = S.outTag[i]; yield E;
  }
  S.phase = 'DONE'; S.complete = true;
  ev('SORT_COMPLETE', true); yield E;
}

/* =====================================================================
   CONTROLLER / ANIMATION TIMING
   ===================================================================== */
const DUR = { SORT_START:250, COUNT_PHASE_START:800, READ_VALUE:450, COUNT_INCREMENT:550, COUNT_PHASE_COMPLETE:800,
  PREFIX_SUM_PHASE_START:800, PREFIX_SUM_CALCULATE:650, PREFIX_SUM_COMPLETE:800, OUTPUT_PHASE_START:900,
  READ_OUTPUT_VALUE:450, POSITION_CALCULATED:600, OUTPUT_WRITE_START:650, OUTPUT_WRITE_COMPLETE:160,
  COUNT_DECREMENT:450, OUTPUT_PHASE_COMPLETE:800, COPY_BACK_START:800, COPY_BACK_STEP:450, SORT_COMPLETE:1100 };
const BAN = { COUNT_PHASE_START:'COUNT FREQUENCIES', COUNT_PHASE_COMPLETE:'FREQUENCIES COMPLETE',
  PREFIX_SUM_PHASE_START:'BUILD PREFIX SUMS', PREFIX_SUM_COMPLETE:'PREFIX SUMS READY',
  OUTPUT_PHASE_START:'PLACE VALUES', OUTPUT_PHASE_COMPLETE:'OUTPUT COMPLETE',
  COPY_BACK_START:'COPY BACK', SORT_COMPLETE:'SORTED!' };
const FXT = { COUNT_INCREMENT:0.4, PREFIX_SUM_CALCULATE:0.55, OUTPUT_WRITE_START:0.75, COUNT_DECREMENT:0.4,
  COPY_BACK_STEP:0.7, SORT_COMPLETE:0, POSITION_CALCULATED:0.85 };
const SPEEDS = [1, 2, 4];

let gen = null, mode = 'idle', stepPending = false, active = false, tEl = 0, dur = 1, fxDone = false;
let spd = 0, uiT = 0, evType = '', pE = 1;
let hud1 = '', hud2 = '', expl = ['', '', ''];

/* ---------- layout ---------- */
const IN_Y = 14, CELL_H = 8, HDR_Y = 25, CNT_Y = 31, CNT_H = 10, OUT_Y = 48;
let inPitch = 10, inW = 9, inX0 = 4, colW = 15, ccw = 14, xC = 19;
function layout() {
  inPitch = Math.floor(120 / S.n); inW = inPitch - 1; inX0 = (W - (S.n * inPitch - 1)) >> 1;
  colW = Math.min(15, Math.floor(110 / S.range)); ccw = colW - 1; xC = 17 + ((110 - colW * S.range) >> 1);
}
const cellX = j => inX0 + j * inPitch;
const inCX = j => cellX(j) + (inW >> 1);
const colX = k => xC + k * colW;
const colCX = k => colX(k) + (ccw >> 1);

/* ---------- info text (HUD + explanation) derived from the real event ---------- */
function phaseName() {
  switch (S.phase) {
    case 'COUNT': return '1 COUNT'; case 'PREFIX': return '2 PREFIX SUM'; case 'OUTPUT': return '3 OUTPUT';
    case 'COPY': return '3 COPY BACK'; case 'DONE': return 'SORTED!'; default: return 'READY';
  }
}
function tagCh(t) { return t ? String.fromCharCode(64 + t) : ''; }
function wrapInto(s) {
  const words = s.split(' ');
  expl[0] = expl[1] = expl[2] = '';
  let l = 0, cur = '';
  for (let w = 0; w < words.length; w++) {
    const word = words[w];
    if (cur.length && cur.length + 1 + word.length > 32) { expl[l++] = cur; cur = word; if (l > 2) return; }
    else cur = cur.length ? cur + ' ' + word : word;
  }
  if (l <= 2) expl[l] = cur;
}
function setIdleInfo() {
  hud1 = 'PHASE:READY';
  hud2 = 'N:' + S.n + ' K:' + S.range + ' MIN:' + S.min + ' MAX:' + S.max;
  wrapInto('FREQUENCY } POSITION } OUTPUT. NO COMPARISONS AT ALL. PRESS START OR STEP.');
}
function setInfo() {
  const t = E.type, v = E.value, i = E.i, min = S.min;
  let x = '';
  hud1 = 'PHASE:' + phaseName(); hud2 = 'OPS:' + S.countOps + ' WR:' + S.writes + ' CMP:0';
  switch (t) {
    case 'SORT_START': x = 'COUNTING SORT NEVER COMPARES ELEMENTS. IT COUNTS HOW OFTEN EACH VALUE APPEARS.'; break;
    case 'COUNT_PHASE_START': x = 'PHASE 1: COUNT HOW MANY TIMES EACH VALUE OCCURS. READ INPUT LEFT TO RIGHT.'; break;
    case 'READ_VALUE':
      hud1 = 'PHASE:COUNT IDX:' + i + ' VAL:' + v; hud2 = 'COUNT[' + v + ']:' + S.count[E.key] + ' OPS:' + S.countOps;
      x = 'READ INPUT[' + i + '] = ' + v + '. KEY = VALUE - MIN = ' + v + ' - ' + min + ' = ' + E.key + '.'; break;
    case 'COUNT_INCREMENT':
      hud1 = 'PHASE:COUNT IDX:' + i + ' VAL:' + v; hud2 = 'COUNT[' + v + ']:' + E.before + '}' + E.after + ' OPS:' + S.countOps;
      x = 'THE VALUE ' + v + ' WAS FOUND. COUNT[' + v + ']++ : ' + E.before + ' } ' + E.after + '.' +
          (E.before > 0 ? ' DUPLICATE: SAME COUNTER GROWS.' : ''); break;
    case 'COUNT_PHASE_COMPLETE': x = 'ALL FREQUENCIES ARE KNOWN. NOW CONVERT THEM INTO CUMULATIVE POSITIONS.'; break;
    case 'PREFIX_SUM_PHASE_START': x = 'PHASE 2: PREFIX SUMS. EACH COUNT ADDS THE COUNT BEFORE IT.'; break;
    case 'PREFIX_SUM_CALCULATE':
      hud1 = 'PHASE:PREFIX SUM INDEX:' + E.idx; hud2 = 'PREV:' + E.prev + ' CUR:' + E.cur + ' RESULT:' + E.after;
      x = 'COUNT[' + (min + E.idx) + '] = ' + E.cur + ' + ' + E.prev + ' = ' + E.after + '. COUNT[' + (min + E.idx) +
          '] TELLS HOW MANY VALUES ARE <= ' + (min + E.idx) + '.'; break;
    case 'PREFIX_SUM_COMPLETE': x = 'COUNT[V] = NUMBER OF ELEMENTS <= V. THE LAST SLOT FOR V IS COUNT[V]-1.'; break;
    case 'OUTPUT_PHASE_START': x = 'PHASE 3: SCAN INPUT RIGHT TO LEFT. THIS KEEPS EQUAL VALUES IN ORIGINAL ORDER: STABLE.'; break;
    case 'READ_OUTPUT_VALUE':
      hud1 = 'PHASE:OUTPUT IDX:' + i + ' VAL:' + v; hud2 = 'POS:- COUNT[' + v + ']:' + E.cnt + ' WR:' + S.writes;
      x = 'INPUT[' + i + '] = ' + v + '. RIGHT TO LEFT KEEPS EQUAL VALUES STABLE. COUNT[' + v + '] IS ' + E.cnt + '.'; break;
    case 'POSITION_CALCULATED':
      hud1 = 'PHASE:OUTPUT IDX:' + i + ' VAL:' + v; hud2 = 'POS:' + E.pos + ' COUNT[' + v + ']:' + E.cnt + ' WR:' + S.writes;
      x = 'POSITION = COUNT[' + v + '] - 1 = ' + E.cnt + ' - 1 = ' + E.pos + '. ' + v + ' BELONGS AT OUTPUT[' + E.pos + '].'; break;
    case 'OUTPUT_WRITE_START':
      hud1 = 'PHASE:OUTPUT IDX:' + i + ' VAL:' + v; hud2 = 'POS:' + E.pos + ' COUNT[' + v + ']:' + S.count[E.key] + ' WR:' + S.writes;
      x = 'WRITE ' + v + (E.tag ? tagCh(E.tag) : '') + ' INTO OUTPUT[' + E.pos + ']. NO SEARCHING, JUST INDEXING.'; break;
    case 'OUTPUT_WRITE_COMPLETE': x = 'OUTPUT[' + E.pos + '] = ' + v + ' IS WRITTEN.'; break;
    case 'COUNT_DECREMENT':
      hud1 = 'PHASE:OUTPUT IDX:' + i + ' VAL:' + v; hud2 = 'COUNT[' + v + ']:' + E.before + '}' + E.after + ' WR:' + S.writes;
      x = 'COUNT[' + v + ']-- : ' + E.before + ' } ' + E.after + '. THE NEXT ' + v + ' GOES ONE SLOT LEFT.'; break;
    case 'OUTPUT_PHASE_COMPLETE': x = 'THE OUTPUT ARRAY IS COMPLETE. NOW COPY IT BACK INTO THE ORIGINAL ARRAY.'; break;
    case 'COPY_BACK_START': x = 'COPY BACK: OUTPUT[I] REPLACES INPUT[I], LEFT TO RIGHT.'; break;
    case 'COPY_BACK_STEP':
      hud1 = 'PHASE:COPY BACK INDEX:' + i; hud2 = 'OUT[' + i + ']:' + v + ' } IN[' + i + ']';
      x = 'INPUT[' + i + '] = OUTPUT[' + i + '] = ' + v + '.'; break;
    case 'SORT_COMPLETE': x = 'SORTED! NO COMPARISONS WERE MADE. EQUAL VALUES KEPT THEIR ORIGINAL ORDER.'; break;
  }
  wrapInto(x);
}

/* ---------- controller ---------- */
function resetRun(arr) {
  startInput = arr;
  S = makeState(startInput);
  layout();
  gen = null; mode = 'idle'; stepPending = false; active = false; tEl = 0; fxDone = false;
  ev('', false); E.type = '';
  for (let i = 0; i < PN; i++) plife[i] = 0;
  setIdleInfo();
}
function beginRun() { gen = countingSortRun(); }
function pull() {
  const r = gen.next();
  if (r.done) { mode = 'done'; stepPending = false; active = false; gen = null; return; }
  active = true; tEl = 0; fxDone = false; dur = DUR[E.type] || 400;
  setInfo(); sfx();
}
function update(dtReal) {
  const dt = dtReal * SPEEDS[spd];
  const adv = mode === 'running' || stepPending;
  if (adv) {
    if (active) {
      tEl += dt;
      const p = Math.min(1, tEl / dur);
      if (!fxDone && FXT[E.type] !== undefined && p >= FXT[E.type]) { fxDone = true; doFx(); }
      if (tEl >= dur) { active = false; if (!E.marker) stepPending = false; }
    } else if (gen) pull();
  }
  if (adv || mode === 'done') stepParticles(dtReal / 1000);
}

/* =====================================================================
   3. ANIMATION LAYER helpers (particles)
   ===================================================================== */
const PN = 64;
const pX = new Float32Array(PN), pY = new Float32Array(PN), pVX = new Float32Array(PN), pVY = new Float32Array(PN),
      plife = new Float32Array(PN), pC = new Uint8Array(PN);
let prs = 12345;
function prand() { prs = (Math.imul(prs, 1103515245) + 12345) >>> 0; return (prs >>> 8) / 16777216; }
function spawn(x, y, c, n) {
  for (let k = 0; k < PN && n > 0; k++) if (plife[k] <= 0) {
    pX[k] = x; pY[k] = y; pVX[k] = (prand() - 0.5) * 40; pVY[k] = -8 - prand() * 26; plife[k] = 0.35 + prand() * 0.3; pC[k] = c; n--;
  }
}
function stepParticles(d) {
  for (let k = 0; k < PN; k++) if (plife[k] > 0) {
    plife[k] -= d; pX[k] += pVX[k] * d; pY[k] += pVY[k] * d; pVY[k] += 70 * d;
  }
}
function doFx() {
  const key = E.key, k = key < 0 ? 0 : key;
  switch (E.type) {
    case 'COUNT_INCREMENT': spawn(colCX(k), CNT_Y, VCOL[k % 8], 6); break;
    case 'PREFIX_SUM_CALCULATE': spawn(colCX(E.idx), CNT_Y, C.YELLOW, 6); break;
    case 'POSITION_CALCULATED': spawn(inCX(E.pos), OUT_Y, C.YELLOW, 4); break;
    case 'OUTPUT_WRITE_START': spawn(inCX(E.pos), OUT_Y, VCOL[k % 8], 8); break;
    case 'COUNT_DECREMENT': spawn(colCX(k), CNT_Y, C.RED, 5); break;
    case 'COPY_BACK_STEP': spawn(inCX(E.i), IN_Y + CELL_H, C.GREEN, 5); break;
    case 'SORT_COMPLETE': for (let j = 0; j < S.n; j++) spawn(inCX(j), OUT_Y, VCOL[(S.output[j] - S.min) % 8], 3); break;
  }
}

/* =====================================================================
   5. AUDIO LAYER (reacts to semantic events only)
   ===================================================================== */
let AC = null, soundOn = true, noiseBuf = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type, vol, delay, slide) {
  if (!AC || !soundOn) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
function noise(d, vol) {
  if (!AC || !soundOn) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.2, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0); let s = 1;
    for (let i = 0; i < ch.length; i++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; ch[i] = (s / 4294967296) * 2 - 1; }
  }
  const t0 = AC.currentTime, src = AC.createBufferSource(), g = AC.createGain();
  src.buffer = noiseBuf; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  src.connect(g); g.connect(AC.destination); src.start(t0); src.stop(t0 + d + 0.01);
}
const NOTE = [523, 587, 659, 698, 784, 880, 988, 1047];
function sfx() {
  if (!AC || !soundOn) return;
  const k = Math.max(0, E.key) % 8;
  switch (E.type) {
    case 'READ_VALUE': case 'READ_OUTPUT_VALUE': tone(660, 0.05, 'square', 0.05); break;
    case 'COUNT_INCREMENT': tone(NOTE[k], 0.05, 'square', 0.06); break;
    case 'PREFIX_SUM_CALCULATE': tone(523, 0.06, 'square', 0.05); tone(784, 0.07, 'square', 0.05, 0.07); break;
    case 'POSITION_CALCULATED': tone(988, 0.06, 'triangle', 0.09); tone(1319, 0.08, 'triangle', 0.08, 0.06); break;
    case 'OUTPUT_WRITE_COMPLETE': tone(700, 0.1, 'square', 0.06, 0, 300); noise(0.04, 0.05); break;
    case 'COUNT_DECREMENT': tone(330, 0.05, 'square', 0.05); break;
    case 'COPY_BACK_STEP': tone(400, 0.09, 'triangle', 0.09, 0, 520); break;
    case 'SORT_COMPLETE': [523, 659, 784, 1047].forEach((f, n) => tone(f, 0.12, 'square', 0.06, n * 0.11)); break;
    case 'SORT_START': break;
    default: tone(262, 0.09, 'triangle', 0.08);
  }
}

/* =====================================================================
   4. RENDERING LAYER (reads state only)
   ===================================================================== */
function cellText(x, y, w, s, tag, c) {
  if (tag) { const dx = w >= 9 ? 1 : 0, tx = w >= 9 ? w - 4 : w - 3; text(s, x + dx, y + 2, c); text(tag, x + tx, y + 2, c); }
  else text(s, x + ((w - tw(s)) >> 1), y + 2, c);
}
/* style 0 filled, 1 dim (already consumed), 2 empty */
function drawCell(x, y, w, h, style, v, tag, ol) {
  const key = v - S.min, kc = ((key % 8) + 8) % 8;
  if (style === 0) { rect(x, y, w, h, VCOL[kc]); cellText(x, y, w, String(v), tagCh(tag), VTXT[kc]); }
  else if (style === 1) { rect(x, y, w, h, C.PANEL2); cellText(x, y, w, String(v), tagCh(tag), VCOL[kc]); }
  else { rect(x, y, w, h, C.BG); outline(x, y, w, h, C.LINE); }
  if (ol >= 0) outline(x, y, w, h, ol);
}
function ball(cx, cy, c) { rect(cx - 1, cy - 1, 3, 3, c); px(cx, cy, C.WHITE); }
function lerp(a, b, q) { return Math.round(a + (b - a) * q); }
function seg(p, a, b) { return Math.max(0, Math.min(1, (p - a) / (b - a))); }

function shownCount(k) {
  const c = S.count[k];
  if (evType === 'COUNT_INCREMENT' && k === E.key && pE < 0.4) return E.before;
  if (evType === 'PREFIX_SUM_CALCULATE' && k === E.idx && pE < 0.55) return E.before;
  if (evType === 'COUNT_DECREMENT' && k === E.key && pE < 0.4) return E.before;
  return c;
}

function render() {
  buf.fill(PAL[C.BG]);
  evType = E.type; pE = active ? Math.min(1, tEl / dur) : 1;
  const ph = S.phase, blink = ((uiT / 140) | 0) & 1;
  const BL = blink ? C.WHITE : C.YELLOW;

  /* header */
  rect(0, 0, W, 7, C.PANEL2); rect(0, 7, W, 1, C.LINE);
  text('COUNTING SORT', 2, 1, C.YELLOW);
  const pn = phaseName(); text(pn, W - 2 - tw(pn), 1, ph === 'DONE' ? C.GREEN : C.CYAN);

  /* which key column / cells are currently in play */
  let activeKey = -1;
  switch (evType) {
    case 'READ_VALUE': case 'COUNT_INCREMENT': case 'READ_OUTPUT_VALUE': case 'POSITION_CALCULATED':
    case 'OUTPUT_WRITE_START': case 'COUNT_DECREMENT': activeKey = E.key; break;
  }
  const isPrefEv = evType === 'PREFIX_SUM_CALCULATE';

  /* ---- INPUT ---- */
  text('INPUT', 4, 8, C.LIGHT);
  if (ph === 'OUTPUT') { const s = '{ RIGHT TO LEFT'; text(s, W - 4 - tw(s), 8, blink ? C.YELLOW : C.ORANGE); }
  else if (ph === 'COPY') { const s = 'LEFT TO RIGHT }'; text(s, W - 4 - tw(s), 8, blink ? C.YELLOW : C.ORANGE); }
  let cursorAt = -1;
  for (let j = 0; j < S.n; j++) {
    let v = S.input[j], tag = S.inTag[j], style = 0, ol = -1;
    if (evType === 'COPY_BACK_STEP' && j === E.i && pE < 0.7) { v = E.before; tag = E.beforeTag; }
    if (ph === 'COUNT') {
      if (j < S.i) style = 1;
      else if (j === S.i) { if (evType === 'READ_VALUE' || evType === 'COUNT_INCREMENT') { ol = BL; cursorAt = j; } else style = 1; }
    } else if (ph === 'OUTPUT') {
      if (S.placedIn[j]) style = (evType === 'OUTPUT_WRITE_START' && j === E.i) ? 2 : 1;
      else if (j === S.i) { ol = BL; cursorAt = j; }
      if (evType === 'OUTPUT_WRITE_START' && j === E.i) cursorAt = j;
    } else if (ph === 'COPY') {
      if (j < S.i) ol = C.GREEN; else if (j === S.i) { ol = BL; cursorAt = j; }
    } else if (ph === 'DONE') ol = C.GREEN;
    drawCell(cellX(j), IN_Y, inW, CELL_H, style, v, tag, ol);
  }
  if (cursorAt >= 0) {
    const cx = inCX(cursorAt), cc = BL;
    px(cx, IN_Y + CELL_H, cc); rect(cx - 1, IN_Y + CELL_H + 1, 3, 1, cc);
  }
  if (ph === 'PREFIX') dither(8, 24);

  /* ---- COUNT / PREFIX ---- */
  text('VAL', 1, HDR_Y, C.DIM);
  text((ph === 'COUNT' || ph === 'IDLE') ? 'FREQ' : 'SUM', 1, CNT_Y + 2, (ph === 'COUNT' || ph === 'IDLE') ? C.CYAN : C.YELLOW);
  for (let k = 0; k < S.range; k++) {
    const x = colX(k), kc = k % 8;
    const isActive = k === activeKey;
    const isSrc = isPrefEv && k === E.idx - 1, isDst = isPrefEv && k === E.idx;
    const hs = String(S.min + k);
    text(hs, x + ((ccw - tw(hs)) >> 1), HDR_Y, isActive ? BL : VCOL[kc]);
    const cnt = shownCount(k);
    let fill = C.PANEL, txt = VCOL[kc], bord = C.LINE, flash = -1;
    if (evType === 'COUNT_INCREMENT' && k === E.key && pE >= 0.4 && pE < 0.8) flash = 0;
    if (isPrefEv && k === E.idx && pE >= 0.55 && pE < 0.9) flash = 1;
    if (evType === 'COUNT_DECREMENT' && k === E.key && pE >= 0.4 && pE < 0.8) flash = 2;
    if (flash === 0) { fill = VCOL[kc]; txt = VTXT[kc]; }
    else if (flash === 1) { fill = C.YELLOW; txt = C.BG; }
    else if (flash === 2) { fill = C.RED; txt = C.WHITE; }
    if (isActive) bord = BL;
    if (isSrc) bord = C.LIME;
    if (isDst) bord = C.ORANGE;
    rect(x, CNT_Y, ccw, CNT_H, fill); outline(x, CNT_Y, ccw, CNT_H, bord);
    const cs = String(cnt);
    text(cs, x + ((ccw - tw(cs)) >> 1), CNT_Y + 2, txt);
    const pips = Math.min(cnt, ccw - 2);
    if (pips > 0) rect(x + 1, CNT_Y + 8, pips, 1, flash >= 0 ? txt : VCOL[kc]);
  }
  if (ph === 'COPY') dither(24, 42);

  /* ---- OUTPUT ---- */
  text('OUTPUT', 4, 42, C.LIGHT);
  let outHi = -1;
  for (let j = 0; j < S.n; j++) {
    let v = S.output[j], tag = S.outTag[j], style = v === null ? 2 : 0, ol = -1;
    if (evType === 'OUTPUT_WRITE_START' && j === E.pos && pE < 0.75) style = 2;
    if (evType === 'POSITION_CALCULATED' && j === E.pos) { ol = BL; outHi = j; }
    if ((evType === 'OUTPUT_WRITE_START' || evType === 'OUTPUT_WRITE_COMPLETE') && j === E.pos) { outHi = j; if (style === 0) ol = BL; }
    if (ph === 'COPY') { if (j < S.i) ol = C.GREEN; else if (j === S.i) ol = BL; }
    if (ph === 'DONE') ol = C.GREEN;
    if (style === 2 && v === null && !(evType === 'OUTPUT_WRITE_START' && j === E.pos)) drawCell(cellX(j), OUT_Y, inW, CELL_H, 2, 0, 0, ol);
    else if (style === 2) { rect(cellX(j), OUT_Y, inW, CELL_H, C.BG); outline(cellX(j), OUT_Y, inW, CELL_H, ol >= 0 ? ol : C.LINE); }
    else drawCell(cellX(j), OUT_Y, inW, CELL_H, style, v, tag, ol);
    const is = String(j);
    text(is, cellX(j) + ((inW - tw(is)) >> 1), OUT_Y + CELL_H + 1, j === outHi ? C.YELLOW : C.DIM);
  }
  if (ph === 'COUNT' || ph === 'PREFIX') dither(42, 62);

  /* ---- moving tokens ---- */
  if ((evType === 'READ_VALUE' || evType === 'READ_OUTPUT_VALUE') && pE > 0.1 && pE < 0.9) {
    const q = seg(pE, 0.1, 0.85), kc = E.key % 8;
    ball(lerp(inCX(E.i), colCX(E.key), q), lerp(IN_Y + 4, CNT_Y + 5, q), VCOL[kc]);
  }
  if (evType === 'PREFIX_SUM_CALCULATE' && pE > 0.05 && pE < 0.55) {
    const q = seg(pE, 0.05, 0.5);
    ball(lerp(colCX(E.idx - 1), colCX(E.idx), q), CNT_Y + 5, C.LIME);
  }
  if (evType === 'POSITION_CALCULATED' && pE > 0.1 && pE < 0.9) {
    const q = seg(pE, 0.1, 0.85);
    ball(lerp(colCX(E.key), inCX(E.pos), q), lerp(CNT_Y + 5, OUT_Y + 3, q), C.YELLOW);
  }
  if (evType === 'OUTPUT_WRITE_START' && pE > 0.05 && pE < 0.75) {
    let q = seg(pE, 0.05, 0.75); q = 1 - (1 - q) * (1 - q);
    drawCell(lerp(cellX(E.i), cellX(E.pos), q), lerp(IN_Y, OUT_Y, q), inW, CELL_H, 0, E.value, E.tag, C.WHITE);
  }
  if (evType === 'COPY_BACK_STEP' && pE > 0.05 && pE < 0.7) {
    let q = seg(pE, 0.05, 0.7); q = 1 - (1 - q) * (1 - q);
    drawCell(lerp(cellX(E.i), cellX(E.i), q), lerp(OUT_Y, IN_Y, q), inW, CELL_H, 0, E.value, E.tag, C.WHITE);
  }

  /* ---- phase banner (markers only) ---- */
  if (active && E.marker && BAN[E.type]) {
    const s = BAN[E.type], w = tw(s) + 12, x = (W - w) >> 1;
    rect(x, 28, w, 13, C.BG); outline(x, 28, w, 13, C.WHITE); outline(x + 1, 29, w - 2, 11, C.LINE);
    textC(s, W >> 1, 32, E.type === 'SORT_COMPLETE' ? C.GREEN : C.YELLOW);
  }

  /* ---- bottom panel ---- */
  rect(0, 63, W, 33, C.PANEL); rect(0, 63, W, 1, C.LINE);
  if (mode === 'done') {
    const page = ((uiT / 3500) | 0) & 1;
    if (!page) {
      text('TOTAL O(N+K)  SPACE O(N+K)', 2, 65, C.YELLOW);
      text('COUNT O(N)  PREFIX O(K)', 2, 71, C.LIGHT);
      text('PLACE O(N)  COPY O(N)', 2, 77, C.LIGHT);
      text('N=' + S.n + ' K=' + S.range + ' OPS ' + S.countOps + ' WR ' + S.writes + ' CMP ' + S.comparisons, 2, 83, C.CYAN);
      text('STABLE:YES  COMPARISON SORT:NO', 2, 89, C.GREEN);
    } else {
      text('N = NUMBER OF ELEMENTS', 2, 65, C.LIGHT);
      text('K = RANGE OF KEY VALUES', 2, 71, C.LIGHT);
      text('FAST WHEN K IS SMALL VS N.', 2, 77, C.YELLOW);
      text('NOT ALWAYS FASTER THAN', 2, 83, C.CYAN);
      text('COMPARISON SORTS.', 2, 89, C.CYAN);
    }
  } else {
    text(hud1, 2, 65, C.LIGHT); text(hud2, 2, 71, C.CYAN);
    rect(0, 77, W, 1, C.LINE);
    for (let l = 0; l < 3; l++) text(expl[l], 2, 79 + l * 6, C.WHITE);
  }

  /* ---- particles ---- */
  for (let k = 0; k < PN; k++) if (plife[k] > 0) px(pX[k], pY[k], pC[k]);

  octx.putImageData(img, 0, 0);
  mctx.imageSmoothingEnabled = false;
  mctx.drawImage(off, 0, 0, cv.width, cv.height);
}

/* ---------- canvas scaling (integer factor, centered) ---------- */
function resize() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / W, (window.innerHeight - 90) / H)));
  cv.width = W * s; cv.height = H * s;
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);

/* ---------- controls ---------- */
function doStart() { ensureAudio(); if (mode === 'done') return; if (mode === 'idle') beginRun(); mode = 'running'; stepPending = false; }
function doPause() { if (mode === 'running') mode = 'paused'; }
function doStep() {
  ensureAudio(); if (mode === 'done') return;
  if (mode === 'running') { mode = 'paused'; return; }
  if (mode === 'idle') beginRun();
  mode = 'paused'; stepPending = true;
}
function doReset() { ensureAudio(); shuffleN = 0; resetRun(INITIAL.slice()); }
function doShuffle() { ensureAudio(); resetRun(shuffledInput()); }
const $ = id => document.getElementById(id);
$('b-start').onclick = doStart; $('b-pause').onclick = doPause; $('b-step').onclick = doStep;
$('b-reset').onclick = doReset; $('b-shuffle').onclick = doShuffle;
$('b-sound').onclick = function () { ensureAudio(); soundOn = !soundOn; this.textContent = 'SOUND: ' + (soundOn ? 'ON' : 'OFF'); };
$('b-speed').onclick = function () { spd = (spd + 1) % SPEEDS.length; this.textContent = 'SPEED: ' + SPEEDS[spd] + 'X'; };
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (mode === 'running') doPause(); else doStart(); }
  else if (e.code === 'KeyN' || e.code === 'ArrowRight') doStep();
  else if (e.code === 'KeyR') doReset();
  else if (e.code === 'KeyS') doShuffle();
});
document.querySelectorAll('button').forEach(b => b.addEventListener('mouseup', () => b.blur()));

/* ---------- main loop ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(50, now - last); last = now; uiT = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
resize();
resetRun(INITIAL.slice());
requestAnimationFrame(loop);
</script>
</body>
