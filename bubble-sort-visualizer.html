/* =====================================================================

/* ------------------------------------------------------------------ */
/* CONSTANTS / LAYOUT                                                  */
/* ------------------------------------------------------------------ */
const N = 12;                  /* array length */
const PRESET = [7, 3, 9, 2, 10, 1, 6, 3, 8, 4, 9, 5];   /* duplicates: 3, 9 */
const P = 9, BW = 7;           /* bar pitch / width */

/* ------------------------------------------------------------------ */
/* SEEDED PRNG + DATASETS                                              */

/* ------------------------------------------------------------------ */
/* ALGORITHM LAYER  (single source of truth)                           */
/* ------------------------------------------------------------------ */

let seed = 0;

const ALG = {
  i: 0, j: -1, swapped: false, passNo: 0, passCmp: 0, passCmpTotal: 0, activeEnd: N - 1,
  sortedStart: N, sortedBefore: N, cmpCount: 0, swapCount: 0, passesDone: 0, earlyExit: false, done: false

/* ------------------------------------------------------------------ */
/* EVENT LAYER                                                         */
/* ------------------------------------------------------------------ */

              SORT_COMPLETE: 12, RESET: 13 };

           swapped: false, lockedIndex: -1, lockedValue: 0, sortedBefore: N, autoNext: 0 };

/* ------------------------------------------------------------------ */
/* COSMETIC FX (particles) - never touches the algorithm               */
/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
/* AUDIO LAYER (procedural 8-bit; created only after user gesture)     */
/* ------------------------------------------------------------------ */

      cmpText = 'SWAP ' + l + ' AND ' + r; cmpCol = C.LPINK; ex1 = 'THEY ARE OUT OF ORDER, SO'; ex2 = 'BUBBLE SORT SWAPS THEM.'; break;
    case EVT.SWAP_COMPLETE:
      cmpText = 'A[J]=' + A[e.leftIndex] + ' A[J+1]=' + A[e.rightIndex]; cmpCol = C.LPINK; ex1 = A[e.rightIndex] + ' MOVED ONE STEP RIGHT.'; ex2 = 'LARGER VALUES BUBBLE RIGHT.'; break;
    case EVT.NO_SWAP:
      cmpText = l + ' <= ' + r + '  ' + CHK + ' OK'; cmpCol = C.CYAN; ex1 = 'LEFT <= RIGHT: KEEP IN PLACE.'; ex2 = 'MOVE ON TO THE NEXT PAIR.'; break;
    case EVT.PASS_COMPLETE:
      cmpText = 'PASS ' + (e.passIndex + 1) + ' COMPLETE'; cmpCol = C.SKY; ex1 = 'THE LARGEST REMAINING VALUE IS'; ex2 = 'NOW IN ITS FINAL POSITION.'; break;
    case EVT.ELEMENT_LOCKED:
      cmpText = e.lockedValue + ' LOCKED AT INDEX ' + e.lockedIndex; cmpCol = C.LIME; ex1 = 'INDEX ' + e.lockedIndex + ' IS NOW LOCKED.'; ex2 = 'SORTED SUFFIX: ' + (N - e.lockedIndex) + ' OF ' + N + '.'; break;
    case EVT.EARLY_TERMINATION:
      cmpText = 'NO SWAPS ' + ARW + ' ARRAY SORTED'; cmpCol = C.LIME; ex1 = 'A FULL PASS MADE NO SWAPS,'; ex2 = 'SO THE ARRAY IS ALREADY SORTED'; break;
    case EVT.SORT_COMPLETE:
      cmpText = 'SORT COMPLETE'; cmpCol = C.LIME; ex1 = 'EVERY ADJACENT PAIR IS ORDERED'; ex2 = 'THE ARRAY IS SORTED.'; break;
    default: break;
  }
}
function setIntroTexts() {
  cmpText = ''; cmpCol = C.YEL; ex1 = 'COMPARE NEIGHBORS.'; ex2 = 'LARGER VALUES BUBBLE RIGHT.';
  laneText = seed === 0 ? 'PRESET DATA  SEED 0' : 'SHUFFLED  SEED ' + seed;
}
function setHoldPage(pg) {
  lastPage = pg;
  if (pg === 0) { ex1 = 'PASSES ' + ALG.passesDone + ' COMPARES ' + ALG.cmpCount + ' SWAPS ' + ALG.swapCount; ex2 = null; }
  else if (pg === 1) { ex1 = 'TIME: AVG/WORST O(N^2)'; ex2 = 'BEST O(N): SORTED + EARLY EXIT'; }
  else if (pg === 2) { ex1 = 'SPACE O(1): SORTS IN PLACE.'; ex2 = 'STABLE: EQUAL KEYS KEEP ORDER'; }
  else { ex1 = 'SEED ' + seed + '  EVENTS ' + evSeq; ex2 = 'EVENT HASH ' + hashHex; }
}

function beginEvent() {
  anim.t = 0; anim.active = true; anim.lastSweep = -1;
  const base = DUR[cur.type];
  anim.dur = Math.max(2, Math.round(base / SPEEDS[speedIdx]));
  anim.sweepStep = Math.max(0.5, (anim.dur - 8) / N);
  setTexts();
  audio.onEvent(cur);
  if (cur.type === EVT.ELEMENT_LOCKED) {
    const k = cur.lockedIndex; burst(barX(k) + 3, YB - A[k] * SC - 2, 14, C.YEL, C.LIME, 0.9, 0.5);
  }
}
function onAnimTick() {
  if (cur.type === EVT.SWAP_START && anim.t === (anim.dur >> 1)) {       /* SWAP_PROGRESS (animation-layer event) */
    audio.onEvent({ type: EVT.SWAP_PROGRESS });
    const j = cur.leftIndex; const top = YB - Math.max(A[j], A[j + 1]) * SC;
    burst(barX(j) + P, top - 4, 9, C.YEL, C.LPINK, 0.8, 0.6);
  }
  if (cur.type === EVT.SORT_COMPLETE) {
    const s = (anim.t / anim.sweepStep) | 0;
    if (s !== anim.lastSweep && s < N) { anim.lastSweep = s; audio.sweepTick(s); burst(barX(s) + 3, YB - A[s] * SC - 2, 4, C.LIME, C.WHITE, 0.7, 0.4); }
  }
}
function pullNext() {
  if (finished) return;
  if (!gen) gen = bubbleSortGen();
  const r = gen.next();
  if (r.done) return;
  copyEv(cur, EV);
  cur.autoNext = AUTO[cur.type];
  beginEvent();
}
function enterHold() {
  finished = true; running = false; stepActive = false; holdT = 0; lastPage = -1;
  hashHex = (evHash >>> 0).toString(16).toUpperCase(); while (hashHex.length < 8) hashHex = '0' + hashHex;
}
function finishEvent() {
  if (cur.type === EVT.SORT_COMPLETE) { enterHold(); return; }
  if (running || AUTO[cur.type]) pullNext(); else stepActive = false;
}
function simTick() {
  frame++; if (riseT < 400) riseT++;
  fxUpdate();
  if (finished) { holdT++; return; }
  if (!started || !(running || stepActive)) return;
  if (anim.active) {
    anim.t++; onAnimTick();
    if (anim.t >= anim.dur) { anim.active = false; finishEvent(); }
  } else pullNext();
}

/* ---- controls ---- */
function resetAll() {
  for (let i = 0; i < N; i++) A[i] = INIT[i];
  ALG.i = 0; ALG.j = -1; ALG.swapped = false; ALG.passNo = 0; ALG.passCmp = 0; ALG.passCmpTotal = 0; ALG.activeEnd = N - 1;
  ALG.sortedStart = N; ALG.sortedBefore = N; ALG.cmpCount = 0; ALG.swapCount = 0; ALG.passesDone = 0; ALG.earlyExit = false; ALG.done = false;
  gen = null; started = false; running = false; stepActive = false; finished = false;
  anim.active = false; anim.t = 0; anim.dur = 1;
  evSeq = 0; evHash = 2166136261 >>> 0;
  audio.stopAll(); fxClear();
  emit(EVT.RESET); copyEv(cur, EV); cur.autoNext = 0;
  riseT = 0; holdT = 0; lastPage = -1;
  setIntroTexts();
}
function doStart() {
  audio.unlock();
  if (finished) resetAll();
  started = true; running = true; stepActive = false; riseT = 999;
}
function doPause() { if (started && !finished) { running = false; stepActive = false; } }
function doStep() {
  audio.unlock();
  if (finished) return;
  started = true; running = false; riseT = 999;
  if (anim.active) {                                   /* finish the event in flight, then advance exactly one event */
    anim.active = false; anim.t = anim.dur;
    if (cur.type === EVT.SORT_COMPLETE) { enterHold(); return; }
  }
  pullNext(); stepActive = true;
}
function doReset() { audio.unlock(); resetAll(); }
function doShuffle() { audio.unlock(); seed = seed + 1; makeDataset(seed, INIT); resetAll(); }
function doSound() { audio.unlock(); audio.toggle(); }
function doSpeed() { speedIdx = (speedIdx + 1) % SPEEDS.length; }

/* ------------------------------------------------------------------ */
/* RENDERING LAYER (read-only)                                         */
/* ------------------------------------------------------------------ */
const ST_NORMAL = 0, ST_CMP = 1, ST_SWAP = 2, ST_OK = 3, ST_SORTED = 4, ST_WHITE = 5;
const PT = new Uint8Array([13,14,12,  8,5,7,  17,19,23,  15,5,11,  10,9,20,  5,5,4]);
const LBLC = [C.LSLATE, C.YEL, C.LPINK, C.CYAN, C.LIME, C.WHITE];
const IDXC = [C.SLATE, C.YEL, C.YEL, C.CYAN, C.TEAL, C.WHITE];

function stateOf(k) {
  const t = cur.type;
  if (t === EVT.SORT_COMPLETE) {
    if (anim.active) {
      const s = (anim.t / anim.sweepStep) | 0;
      if (k < s) return ST_SORTED; if (k === s) return ST_WHITE;
      return k >= cur.sortedBefore ? ST_SORTED : ST_OK;
    }
    return ST_SORTED;
  }
  if (k >= ALG.sortedStart) {
    if (t === EVT.ELEMENT_LOCKED && k === cur.lockedIndex && anim.active && (((anim.t / 4) | 0) & 1) === 0) return ST_WHITE;
    return ST_SORTED;
  }
  if (t === EVT.EARLY_TERMINATION) return (anim.active && ((anim.t >> 3) & 1)) ? ST_NORMAL : ST_OK;
  if (t === EVT.PASS_START && anim.active && ((anim.t >> 2) & 1)) return ST_OK;
  if (t === EVT.PASS_COMPLETE && k === ALG.activeEnd) return (anim.active && ((anim.t >> 2) & 1)) ? ST_WHITE : ST_NORMAL;
  if (k === cur.leftIndex || k === cur.rightIndex) {
    if (t === EVT.COMPARE) return ST_CMP;
    if (t === EVT.COMPARISON_RESULT) return cur.didSwap ? ST_SWAP : ST_CMP;
    if (t === EVT.SWAP_START || t === EVT.SWAP_COMPLETE) return ST_SWAP;
    if (t === EVT.NO_SWAP) return ST_OK;
  }
  return ST_NORMAL;
}

function drawBar(x, top, w, h, st) {
  const m = PT[st * 3], l = PT[st * 3 + 1], d = PT[st * 3 + 2];
  rect(x, top, w, h, m);
  rect(x, top, w, 1, l); rect(x, top, 1, h, l);
  rect(x + w - 1, top, 1, h, d); if (h > 1) rect(x, top + h - 1, w, 1, d);
  if (h >= 7) { pset(x + 2, top + 2, l); pset(x + 2, top + 3, l); if (h >= 12) { pset(x + 2, top + 5, l); pset(x + 2, top + 6, l); } }
}
function drawOneBar(k, x, hop) {
  const st = stateOf(k); let h = A[k] * SC;
  if (riseT < RISE_END) { const hv = Math.min(h, Math.max(0, (riseT - k * 2) * 2)); if (hv <= 0) return; h = hv; }
  const top = YB - h - hop;
  drawBar(x, top, BW, h, st);
  drawNumC(A[k], x + 3, top - 6, LBLC[st]);
}
function drawBars() {
  const swapping = cur.type === EVT.SWAP_START;
  let sj = -1, dx = 0, hopL = 0, hopR = 0;
  if (swapping) {
    sj = cur.leftIndex; const p = anim.t / anim.dur, e = p * p * (3 - 2 * p);
    dx = Math.round(e * P); const s = Math.sin(Math.PI * p); hopL = Math.round(s * 6); hopR = Math.round(s * 2);
  }
  for (let k = 0; k < N; k++) { if (swapping && (k === sj || k === sj + 1)) continue; drawOneBar(k, barX(k), 0); }
  if (swapping) { drawOneBar(sj + 1, barX(sj + 1) - dx, hopR); drawOneBar(sj, barX(sj) + dx, hopL); }
}

function drawLane() {
  const t = cur.type;
  if (t < EVT.COMPARE || t > EVT.NO_SWAP || t === EVT.SWAP_PROGRESS || cur.leftIndex < 0) return;
  const l = cur.leftIndex, xl = barX(l), xr = barX(l + 1) + BW - 1;
  const col = t === EVT.NO_SWAP ? C.CYAN : (t === EVT.SWAP_START || t === EVT.SWAP_COMPLETE || (t === EVT.COMPARISON_RESULT && cur.didSwap)) ? C.LPINK : C.YEL;
  drawTextC('J', xl + 3, 27, col); drawTextC('J+1', xr - 3, 27, col);
  hline(xl, 32, xr - xl + 1, col); pset(xl, 33, col); pset(xr, 33, col);
  rect(xl + BW, 33, 2, 3, ((frame >> 3) & 1) ? C.WHITE : col);
}

function drawFloor() {
  hline(4, YB, 120, C.PANL);
  const ss = ALG.sortedStart, xs = barX(Math.min(ss, N));
  if (ss < N) {
    hline(xs - 1, YB, barX(N - 1) + BW - xs + 1, C.GREEN); hline(xs - 1, YB + 1, barX(N - 1) + BW - xs + 1, C.GREEN);
    if (ss > 0) for (let y = 36; y < YB; y++) if (y % 3) pset(xs - 1, y, C.GREEN);
  }
  if (ss > 0 && !finished && !(cur.type === EVT.SORT_COMPLETE)) {             /* pixel bracket around the active range */
    const ae = Math.min(ALG.activeEnd, ss - 1); const xa = barX(0), xb = barX(ae) + BW - 1;
    const bc = (cur.type === EVT.PASS_START && anim.active && ((anim.t >> 2) & 1)) ? C.WHITE : C.SKY;
    hline(xa, YB, xb - xa + 1, bc); pset(xa, YB + 1, bc); pset(xb, YB + 1, bc);
  }
}

function drawHeader() {
  rect(0, 0, W, 7, C.PAN); hline(0, 7, W, C.PANL);
  drawText('BUBBLE SORT', 4, 2, C.RED); drawText('BUBBLE SORT', 3, 1, C.YEL);
  drawText(SPEEDS[speedIdx] + 'X', 52, 1, C.SLATE);
  drawText('VOL', 63, 1, C.SLATE);
  for (let k = 0; k < 5; k++) rect(76 + k * 4, 5 - k, 3, k + 1, k < audio.vol ? (audio.on ? C.LIME : C.SLATE) : C.PANL);
  drawText('O(N^2)', 101, 1, C.LSLATE);
}
function drawHud() {
  let x;
  x = drawText('PASS ', 3, 9, C.SLATE); x = drawNum(ALG.passNo, x, 9, C.WHITE); x = drawText('/', x, 9, C.SLATE); drawNum(N - 1, x, 9, C.LSLATE);
  x = drawText('CMP ', 45, 9, C.SLATE); x = drawNum(ALG.passCmp, x, 9, C.WHITE); x = drawText('/', x, 9, C.SLATE); drawNum(ALG.passCmpTotal, x, 9, C.LSLATE);
  x = drawText('RANGE ', 87, 9, C.SLATE); x = drawNum(0, x, 9, C.WHITE); x = drawText('-', x, 9, C.SLATE); drawNum(ALG.activeEnd, x, 9, C.WHITE);
  x = drawText('COMPS ', 3, 15, C.SLATE); drawNum(ALG.cmpCount, x, 15, C.WHITE);
  x = drawText('SWAPS ', 45, 15, C.SLATE); drawNum(ALG.swapCount, x, 15, C.WHITE);
  drawText(statusStr(), 87, 15, statusCol());
  for (let xx = 2; xx < 126; xx += 3) pset(xx, 20, C.PANL);          /* scanline-style separator */
}

/* controls */
const BTN = [{ l: 'START' }, { l: 'PAUSE' }, { l: 'STEP' }, { l: 'RESET' }, { l: 'SHUF' }, { l: 'SND' }];
(() => { let x = 3; for (const b of BTN) { b.w = textW(b.l) + 4; b.x = x; b.y = 89; b.h = 7; x += b.w; } })();
let hoverBtn = -1, pressBtn = -1;
function drawButtons() {
  for (let i = 0; i < BTN.length; i++) {
    const b = BTN[i];
    let lit = false, col = C.WHITE;
    if (i === 0) lit = running; else if (i === 1) lit = started && !running && !finished;
    if (i === 5) col = audio.on ? C.LIME : C.RED;
    const bg = pressBtn === i ? C.NAVY : lit ? C.BLUE : hoverBtn === i ? C.SLATE : C.PANL;
    rect(b.x, b.y, b.w, b.h, bg);
    hline(b.x, b.y, b.w, lit ? C.SKY : C.SLATE); hline(b.x, b.y + b.h - 1, b.w, C.PAN); vline(b.x + b.w - 1, b.y, b.h, C.PAN);
    drawText(b.l, b.x + 2, b.y + 1, col);
  }
}

function drawHold() {
  const pg = ((holdT / 150) | 0) & 3;
  if (pg !== lastPage) setHoldPage(pg);
}

function draw() {
  px32.fill(PAL[C.BG]);
  for (let y = 36; y < YB; y += 8) for (let x = 4; x < 124; x += 8) pset(x, y, C.PAN);      /* faint dot grid */
  drawHeader(); drawHud();

  /* compare / verdict line */
  if (!started && !finished) {
    if (((frame >> 5) & 1) === 0) drawTextC('PRESS START', 64, 21, C.YEL); else drawTextC('OR PRESS STEP', 64, 21, C.SKY);
    drawTextC(laneText, 64, 27, C.SLATE);
  } else if (finished) {
    drawTextC('SORT COMPLETE', 64, 21, ((frame >> 4) & 1) ? C.YEL : C.LIME);
    if (((frame >> 5) & 1) === 0) drawTextC('START = REPLAY   SHUF = NEW DATA', 64, 27, C.SLATE);
  } else if (cmpText) drawTextC(cmpText, 64, 21, (cur.type === EVT.EARLY_TERMINATION && ((frame >> 3) & 1)) ? C.WHITE : cmpCol);

  drawLane();
  drawFloor();
  drawBars();
  for (let k = 0; k < N; k++) { if (riseT < RISE_END && riseT < k * 2) continue; drawNumC(k, barX(k) + 3, YB + 3, IDXC[stateOf(k)]); }

  /* particles */
  for (let i = 0; i < MAXP; i++) if (PL[i] > 0) { const c = PC[i]; const x = Math.round(PX[i]), y = Math.round(PY[i]); if (PL[i] > 8) rect(x, y, 2, 2, c); else pset(x, y, c); }

  /* explanation panel */
  if (finished) drawHold();
  rect(1, 77, 126, 12, C.DEEP); rect(1, 77, 2, 12, cmpCol === C.LIME ? C.GREEN : C.YEL);
  drawText(ex1, 5, 78, C.WHITE);
  if (ex2 === null) {                                            /* final sorted array row */
    let x = 5; for (let i = 0; i < N; i++) { x = drawNum(A[i], x, 84, C.LIME) + 2 - 1; }
  } else drawText(ex2, 5, 84, C.LSLATE);

  drawButtons();
  octx.putImageData(img, 0, 0);
}

/* ------------------------------------------------------------------ */
/* DISPLAY: integer scale, centered, no smoothing                      */
/* ------------------------------------------------------------------ */
const screen = document.getElementById('screen');
const dctx = screen.getContext('2d', { alpha: false });
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');
let scale = 1, offX = 0, offY = 0, cw = W, ch = H, needClear = true;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cw = Math.max(W, Math.round(window.innerWidth * dpr)); ch = Math.max(H, Math.round(window.innerHeight * dpr));
  screen.width = cw; screen.height = ch;
  scale = Math.max(1, Math.floor(Math.min(cw / W, ch / H)));
  offX = ((cw - W * scale) / 2) | 0; offY = ((ch - H * scale) / 2) | 0; needClear = true;
}
function blit() {
  if (needClear) { dctx.fillStyle = HEX[C.BG]; dctx.fillRect(0, 0, cw, ch); needClear = false; }
  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(off, 0, 0, W, H, offX, offY, W * scale, H * scale);
}

/* ------------------------------------------------------------------ */
/* INPUT                                                               */
/* ------------------------------------------------------------------ */
let mx = -1, my = -1;
function toLogical(e) {
  const r = screen.getBoundingClientRect();
  mx = Math.floor(((e.clientX - r.left) / r.width * cw - offX) / scale);
  my = Math.floor(((e.clientY - r.top) / r.height * ch - offY) / scale);
}
function hitButton() { for (let i = 0; i < BTN.length; i++) { const b = BTN[i]; if (mx >= b.x && mx < b.x + b.w && my >= b.y && my < b.y + b.h) return i; } return -1; }
function runButton(i) { if (i === 0) doStart(); else if (i === 1) doPause(); else if (i === 2) doStep(); else if (i === 3) doReset(); else if (i === 4) doShuffle(); else if (i === 5) doSound(); }
screen.addEventListener('pointerdown', e => {
  audio.unlock(); toLogical(e); screen.focus();
  if (my >= 0 && my < 7 && mx >= 75 && mx < 96) { audio.setVol(Math.floor((mx - 75) / 4) + 1 === audio.vol ? audio.vol - 1 : Math.floor((mx - 75) / 4) + 1); return; }
  pressBtn = hitButton();
});
screen.addEventListener('pointermove', e => { toLogical(e); hoverBtn = hitButton(); });
screen.addEventListener('pointerup', e => { toLogical(e); const h = hitButton(); if (h >= 0 && h === pressBtn) runButton(h); pressBtn = -1; });
screen.addEventListener('pointerleave', () => { hoverBtn = -1; pressBtn = -1; });
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (running) doPause(); else doStart(); }
  else if (k === 'n' || k === 'N' || k === 'ArrowRight') { e.preventDefault(); doStep(); }
  else if (k === 'r' || k === 'R') doReset();
  else if (k === 's' || k === 'S') doShuffle();
  else if (k === 'm' || k === 'M') doSound();
  else if (k === 'f' || k === 'F') doSpeed();
  else if (k === '+' || k === '=') { audio.unlock(); audio.setVol(audio.vol + 1); }
  else if (k === '-' || k === '_') { audio.unlock(); audio.setVol(audio.vol - 1); }
});
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ */
/* MAIN LOOP: fixed 60 Hz simulation, rAF rendering                    */
/* ------------------------------------------------------------------ */
const STEP_MS = 1000 / 60;
let last = 0, acc = 0;
function loop(now) {
  if (!last) last = now;
  acc += Math.min(now - last, 100); last = now;
  while (acc >= STEP_MS) { simTick(); acc -= STEP_MS; }
  draw(); blit();
  requestAnimationFrame(loop);
}

makeDataset(seed, INIT);
resetAll();
resize();
requestAnimationFrame(loop);

/* debug hook for determinism checks */
window.__bubble = { A, ALG, get events() { return evSeq; }, get hash() { return evHash >>> 0; } };
})();
</script>
</body>
