<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bucket Sort - 16-bit Visualizer</title>
<style>
html,body{margin:0;height:100%;background:#05060d;color:#c9d1ee;font-family:"Courier New",monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
#view{display:block;image-rendering:crisp-edges;image-rendering:pixelated;background:#0b0d1a;border:4px solid #232a52;box-sizing:content-box}
#controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 8px}
button{font:bold 12px "Courier New",monospace;letter-spacing:1px;text-transform:uppercase;color:#f4f6ff;background:#3a6fe0;border:0;padding:8px 12px;cursor:pointer;
box-shadow:inset -3px -3px 0 #25409a,inset 3px 3px 0 #4cc3f0,0 0 0 3px #05060d}
button:hover{background:#4a80f0}
button:active{transform:translate(2px,2px)}
button:disabled{background:#3a4480;color:#8f9bc7;cursor:default;box-shadow:inset -3px -3px 0 #232a52,inset 3px 3px 0 #5b658f,0 0 0 3px #05060d}
#bStart{background:#2fa04a;box-shadow:inset -3px -3px 0 #1e6a3a,inset 3px 3px 0 #8fd23f,0 0 0 3px #05060d}
#bReset{background:#e0413c;box-shadow:inset -3px -3px 0 #8f2a3a,inset 3px 3px 0 #f08a2c,0 0 0 3px #05060d}
</style>
</head>
<body>
<canvas id="view" width="128" height="96" aria-label="Bucket Sort visualizer"></canvas>
<div id="controls">
  <button id="bStart">Start</button>
  <button id="bPause">Pause</button>
  <button id="bStep">Step</button>
  <button id="bReset">Reset</button>
  <button id="bShuffle">Shuffle</button>
  <button id="bSound">Sound: on</button>
  <button id="bSpeed">Speed 1x</button>
  <button id="bInfo" disabled>Info</button>
</div>
<script>
(function () {
'use strict';

/* =====================================================================
   CONSTANTS, PALETTE (24 colours), PRNG
   ===================================================================== */
const W = 128, H = 96;
const C = {
  bg0:'#0b0d1a', bg1:'#161a33', bg2:'#232a52', line:'#3a4480', dim:'#5b658f', mid:'#8f9bc7', light:'#c9d1ee', white:'#f4f6ff',
  red:'#e0413c', red2:'#8f2a3a', orange:'#f08a2c', yellow:'#f7d64a', lime:'#8fd23f', green:'#2fa04a', green2:'#1e6a3a', teal:'#33c9b3',
  cyan:'#4cc3f0', blue:'#3a6fe0', blue2:'#25409a', purple:'#8a55d6', magenta:'#d64fa8', pink:'#f29bc0', brown:'#8a5a34', black:'#05060d'
};
const BC = [C.cyan, C.lime, C.yellow, C.orange, C.pink];      // bucket bright colours
const BD = [C.blue2, C.green2, C.brown, C.red2, C.purple];    // bucket dark colours

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const INITIAL = [42, 7, 91, 33, 68, 15, 84, 26, 53, 3, 76, 47];
const N = INITIAL.length, K = 5, SEED = 0xB0C4E7;
let shuffleCount = 0;
let curInput = INITIAL.slice();

function permutation(cnt) {
  const a = INITIAL.slice();
  if (cnt === 0) return a;
  const r = mulberry32(SEED + cnt * 7919);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
const EV = {
  SORT_START:1, DISTRIBUTION_START:2, VALUE_SELECTED:3, BUCKET_INDEX_CALCULATED:4, VALUE_TO_BUCKET_START:5,
  VALUE_TO_BUCKET_COMPLETE:6, DISTRIBUTION_COMPLETE:7, BUCKET_SORT_START:8, KEY_SELECTED:9, LOCAL_COMPARE:10,
  SHIFT_START:11, SHIFT_COMPLETE:12, KEY_INSERTED:13, BUCKET_SORT_COMPLETE:14, ALL_BUCKETS_SORTED:15,
  CONCATENATION_START:16, CONCAT_VALUE_START:17, CONCAT_VALUE_COMPLETE:18, CONCATENATION_COMPLETE:19,
  COPY_BACK_START:20, COPY_BACK_STEP:21, SORT_COMPLETE:22, RESET:23
};
const Bus = {
  subs: [],
  on(f) { this.subs.push(f); },
  emit(t, a, b, c) { for (let i = 0; i < this.subs.length; i++) this.subs[i](t, a, b, c); }
};
const emit = (t, a, b, c) => Bus.emit(t, a, b, c);

/* =====================================================================
   1. ALGORITHM LAYER  (owns all real state; generator = one yield per meaningful step)
   ===================================================================== */
const PH = { IDLE:0, DIST:1, SORT:2, CONCAT:3, COPY:4, DONE:5 };
const EL = [];                                     // preallocated element objects (one per input slot)
for (let i = 0; i < N; i++) EL.push({ v:0, id:i, ox:0, oy:0, taken:false });

const S = {
  phase: PH.IDLE, array: [], min: 0, max: 0, R: 1, rangesKnown: false,
  lo: [0,0,0,0,0], hi: [0,0,0,0,0],
  buckets: [[],[],[],[],[]], output: new Array(N).fill(null), outFrom: new Array(N).fill(-1), outIdx: 0,
  inIdx: -1, curVal: null, curBucket: -1, calc: { frac: 0, idx: 0 }, placedThis: false,
  placedTo: new Array(N).fill(-1), placed: 0,
  selBucket: -1, sorted: [false,false,false,false,false],
  ins: { active:false, i:0, j:0, key:null, gap:-1, cmp:-1, gt:false },
  concat: { b:-1, k:-1 }, copyIdx: 0,
  comparisons: 0, shifts: 0, writes: 0, done: false, stable: true, verified: true
};

function resetState(arr) {
  S.array.length = 0;
  for (let i = 0; i < N; i++) { S.array.push(arr[i]); EL[i].v = arr[i]; EL[i].ox = 0; EL[i].oy = 0; EL[i].taken = false; }
  S.phase = PH.IDLE; S.min = 0; S.max = 0; S.R = 1; S.rangesKnown = false;
  for (let b = 0; b < K; b++) { S.buckets[b].length = 0; S.lo[b] = 0; S.hi[b] = 0; S.sorted[b] = false; }
  S.output.fill(null); S.outFrom.fill(-1); S.outIdx = 0;
  S.inIdx = -1; S.curVal = null; S.curBucket = -1; S.placedThis = false; S.placedTo.fill(-1); S.placed = 0;
  S.selBucket = -1;
  S.ins.active = false; S.ins.i = 0; S.ins.j = 0; S.ins.key = null; S.ins.gap = -1; S.ins.cmp = -1; S.ins.gt = false;
  S.concat.b = -1; S.concat.k = -1; S.copyIdx = 0;
  S.comparisons = 0; S.shifts = 0; S.writes = 0; S.done = false; S.stable = true; S.verified = true;
}

// Bucket index: exactly the formula from the spec.
function bucketIndex(value, min, max, bucketCount) {
  return Math.min(bucketCount - 1, Math.floor(((value - min) / (max - min + 1)) * bucketCount));
}

function* algo() {
  const arr = S.array;

  // ---- STEP: compute min / max / bucket ranges -------------------------
  S.min = Math.min(...arr); S.max = Math.max(...arr); S.R = S.max - S.min + 1;
  for (let b = 0; b < K; b++) {
    S.lo[b] = S.min + Math.ceil(b * S.R / K);
    S.hi[b] = S.min + Math.ceil((b + 1) * S.R / K) - 1;
  }
  for (let v = S.min; v <= S.max; v++) {           // ranges must agree with the real formula
    const idx = bucketIndex(v, S.min, S.max, K);
    if (v < S.lo[idx] || v > S.hi[idx]) console.warn('bucket range mismatch for', v);
  }
  S.rangesKnown = true; S.phase = PH.DIST;
  emit(EV.SORT_START); emit(EV.DISTRIBUTION_START);
  yield 50;

  // ---- PHASE 1: DISTRIBUTE (input order, no pre-sorting) ---------------
  for (let i = 0; i < N; i++) {
    const value = arr[i], el = EL[i];
    S.inIdx = i; S.curVal = value; S.placedThis = false;
    const frac = ((value - S.min) / (S.max - S.min + 1)) * K;
    const idx = bucketIndex(value, S.min, S.max, K);
    S.calc.frac = frac; S.calc.idx = idx; S.curBucket = idx;
    emit(EV.VALUE_SELECTED, i); emit(EV.BUCKET_INDEX_CALCULATED, i, idx);
    yield 34;

    S.buckets[idx].push(el); S.placed++; S.writes++;
    S.placedTo[i] = idx; S.placedThis = true;
    emit(EV.VALUE_TO_BUCKET_START, i, idx, S.buckets[idx].length - 1);
    yield 12;
  }
  S.inIdx = -1; S.curVal = null; S.curBucket = -1; S.placedThis = false; S.phase = PH.SORT;
  emit(EV.DISTRIBUTION_COMPLETE);
  yield 44;

  // ---- PHASE 2: SORT EACH BUCKET (real insertion sort, one bucket at a time)
  for (let b = 0; b < K; b++) {
    const bk = S.buckets[b];
    S.selBucket = b; S.ins.active = false; S.ins.gap = -1;
    emit(EV.BUCKET_SORT_START, b, bk.length);
    yield 34;
    if (bk.length > 1) {
      S.ins.active = true;
      for (let i = 1; i < bk.length; i++) {
        const key = bk[i]; let j = i - 1;
        S.ins.i = i; S.ins.j = j; S.ins.key = key; S.ins.gap = i; S.ins.cmp = -1;
        emit(EV.KEY_SELECTED, b, i);
        yield 30;
        while (j >= 0) {
          S.ins.j = j; S.ins.cmp = j; S.comparisons++;
          S.ins.gt = bk[j].v > key.v;
          emit(EV.LOCAL_COMPARE, b, j);
          yield 30;
          if (!S.ins.gt) break;
          bk[j + 1] = bk[j]; S.shifts++; S.writes++; S.ins.gap = j;
          emit(EV.SHIFT_START, b, j);
          yield 10;
          j--;
        }
        S.ins.cmp = -1; S.ins.j = j;
        bk[j + 1] = key; S.writes++; S.ins.gap = -1;
        emit(EV.KEY_INSERTED, b, j + 1);
        yield 14;
      }
      S.ins.active = false; S.ins.key = null;
    }
    S.sorted[b] = true;
    emit(EV.BUCKET_SORT_COMPLETE, b);
    yield 30;
  }
  S.selBucket = -1;
  emit(EV.ALL_BUCKETS_SORTED);
  yield 44;

  // ---- PHASE 3: CONCATENATE buckets low -> high --------------------------
  S.phase = PH.CONCAT;
  emit(EV.CONCATENATION_START);
  yield 50;
  let oi = 0;
  for (let b = 0; b < K; b++) {
    S.selBucket = b;
    for (let k = 0; k < S.buckets[b].length; k++) {
      const el = S.buckets[b][k];
      S.concat.b = b; S.concat.k = k;
      S.output[oi] = el; S.outFrom[oi] = b; S.outIdx = oi + 1; S.writes++; el.taken = true;
      emit(EV.CONCAT_VALUE_START, b, k, oi);
      oi++;
      yield 8;
    }
  }
  S.selBucket = -1; S.concat.b = -1; S.concat.k = -1;
  emit(EV.CONCATENATION_COMPLETE);
  yield 44;

  // ---- COPY BACK -----------------------------------------------------------
  S.phase = PH.COPY;
  emit(EV.COPY_BACK_START);
  yield 40;
  for (let i = 0; i < N; i++) {
    arr[i] = S.output[i].v; S.writes++; S.copyIdx = i + 1;
    emit(EV.COPY_BACK_STEP, i);
    yield 6;
  }

  // ---- verification (sortedness and stability) -----------------------------
  for (let i = 1; i < N; i++) {
    if (arr[i - 1] > arr[i]) S.verified = false;
    if (S.output[i - 1].v === S.output[i].v && S.output[i - 1].id > S.output[i].id) S.stable = false;
  }
  S.phase = PH.DONE; S.done = true;
  emit(EV.SORT_COMPLETE);
  yield 0;
}

/* =====================================================================
   CANVAS / PIXEL PRIMITIVES
   ===================================================================== */
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const off = document.createElement('canvas');
off.width = W; off.height = H;
const g = off.getContext('2d');
g.imageSmoothingEnabled = false;
let scale = 4;

function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); }
function pbox(x, y, w, h, b, f) {                   // pixel box with clipped corners
  R(x + 1, y, w - 2, h, f); R(x, y + 1, w, h - 2, f);
  R(x + 1, y, w - 2, 1, b); R(x + 1, y + h - 1, w - 2, 1, b);
  R(x, y + 1, 1, h - 2, b); R(x + w - 1, y + 1, 1, h - 2, b);
}
function outline(x, y, w, h, c) {
  R(x + 1, y, w - 2, 1, c); R(x + 1, y + h - 1, w - 2, 1, c);
  R(x, y + 1, 1, h - 2, c); R(x + w - 1, y + 1, 1, h - 2, c);
}

/* 3x5 bitmap font (rows top->bottom, 3 bits each, '.' ':' ',' '!' are 1px wide) */
const GL = {
 'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110','E':'111100110100111',
 'F':'111100110100100','G':'011100101101011','H':'101101111101101','I':'111010010010111','J':'001001001101010',
 'K':'101101110101101','L':'100100100100111','M':'101111111101101','N':'111101101101101','O':'010101101101010',
 'P':'110101110100100','Q':'010101101111011','R':'110101110101101','S':'011100010001110','T':'111010010010010',
 'U':'101101101101111','V':'101101101101010','W':'101101111111101','X':'101101010101101','Y':'101101010010010',
 'Z':'111001010100111',
 '0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001',
 '5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
 ' ':'000000000000000','.':'000000000000010',':':'000010000010000',',':'000000000010010','!':'010010010000010',
 '-':'000000111000000','+':'000010111010000','>':'100010001010100','<':'001010100010001','/':'001001010100100',
 '(':'010100100100010',')':'010001001001010','[':'110100100100110',']':'011001001001011','^':'010101000000000',
 '=':'000111000111000','?':'110001010000010','%':'101001010100101','_':'000000000000111','*':'000101010101000'
};
const NARROW = '.:,!';
function T(str, x, y, col) {
  g.fillStyle = col; x |= 0; y |= 0;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i], gl = GL[ch] || GL['?'], nar = NARROW.indexOf(ch) >= 0;
    for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) {
      if (gl.charCodeAt(r * 3 + c) === 49) {
        if (nar) { if (c === 1) g.fillRect(x, y + r, 1, 1); } else g.fillRect(x + c, y + r, 1, 1);
      }
    }
    x += (nar ? 1 : 3) + 1;
  }
}
function tw(s) { let w = 0; for (let i = 0; i < s.length; i++) w += (NARROW.indexOf(s[i]) >= 0 ? 1 : 3) + 1; return w > 0 ? w - 1 : 0; }

/* =====================================================================
   LAYOUT (logical 128x96)
   ===================================================================== */
const INY = 8, OUTY = 63, LANE = 62;
const INX = i => 4 + i * 10;
const OUTX = i => 4 + i * 10;
const BX = b => 2 + b * 25;
const BY = 27, BW = 23, BHT = 35, SLOT0 = 40;
function slotPitch(b, extra) { return Math.min(7, Math.floor(21 / Math.max(3, S.buckets[b].length, extra || 0))); }
function slotY(b, k) { return SLOT0 + k * slotPitch(b, k + 1); }

/* =====================================================================
   3. ANIMATION LAYER (consumes events; never decides algorithm outcomes)
   ===================================================================== */
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
let fx = mulberry32(99);

const A = {
  frame: 0, fl: [], of: [], pt: [], flash: [0,0,0,0,0],
  hideB: -1, hideK: -1, hideOut: -1, hideIn: -1
};
for (let i = 0; i < 6; i++) A.fl.push({ on:false, t:0, dur:1, n:0, px:[0,0,0,0], py:[0,0,0,0], ln:[0,0,0], total:0, type:0, v:0, bi:0, a:0, x:0, y:0 });
for (let i = 0; i < 24; i++) A.of.push({ on:false, el:null, t:0, dur:1, ox0:0, oy0:0, evt:0, b:0, k:0 });
for (let i = 0; i < 200; i++) A.pt.push({ on:false, x:0, y:0, vx:0, vy:0, t:0, life:1, c:C.white });

A.clear = function () {
  for (const f of this.fl) f.on = false;
  for (const o of this.of) { if (o.on && o.el) { o.el.ox = 0; o.el.oy = 0; } o.on = false; }
  for (const p of this.pt) p.on = false;
  this.flash.fill(0); this.hideB = -1; this.hideK = -1; this.hideOut = -1; this.hideIn = -1; this.frame = 0;
  fx = mulberry32(99);
};
A.busy = function () {
  for (let i = 0; i < this.fl.length; i++) if (this.fl[i].on) return true;
  for (let i = 0; i < this.of.length; i++) if (this.of[i].on) return true;
  return false;
};
A.anyParts = function () { for (let i = 0; i < this.pt.length; i++) if (this.pt[i].on) return true; return false; };
A.finishAll = function () { let n = 0; while (this.busy() && n++ < 800) this.update(); };

A.spawn = function (x, y, vx, vy, life, c) {
  for (let i = 0; i < this.pt.length; i++) {
    const p = this.pt[i];
    if (!p.on) { p.on = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.t = 0; p.life = life; p.c = c; return; }
  }
};
A.burst = function (x, y, c, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = fx() * 6.2832, s = (0.25 + fx()) * sp;
    this.spawn(x, y, Math.cos(a) * s, Math.sin(a) * s - 0.15, 12 + ((fx() * 14) | 0), c);
  }
};
A.offSet = function (el, ox0, oy0, dur, evt, b, k) {
  let o = null;
  for (let i = 0; i < this.of.length; i++) if (this.of[i].on && this.of[i].el === el) { o = this.of[i]; break; }
  if (!o) for (let i = 0; i < this.of.length; i++) if (!this.of[i].on) { o = this.of[i]; break; }
  if (!o) return;
  o.on = true; o.el = el; o.t = 0; o.dur = dur; o.ox0 = ox0; o.oy0 = oy0; o.evt = evt || 0; o.b = b || 0; o.k = k || 0;
  el.ox = ox0; el.oy = oy0;
};
A.flyBegin = function (type, v, bi, dur) {
  for (let i = 0; i < this.fl.length; i++) {
    const f = this.fl[i];
    if (!f.on) { f.on = true; f.t = 0; f.dur = dur; f.type = type; f.v = v; f.bi = bi; f.a = 0; return f; }
  }
  return this.fl[0];
};
function flyPrep(f, n) {
  f.n = n; f.total = 0;
  for (let i = 0; i < n - 1; i++) { f.ln[i] = Math.abs(f.px[i + 1] - f.px[i]) + Math.abs(f.py[i + 1] - f.py[i]); f.total += f.ln[i]; }
  f.x = f.px[0]; f.y = f.py[0];
}
function flyPos(f) {
  let d = ease(Math.min(1, f.t / f.dur)) * f.total;
  for (let i = 0; i < f.n - 1; i++) {
    if (d <= f.ln[i] || i === f.n - 2) {
      const r = f.ln[i] ? Math.min(1, d / f.ln[i]) : 1;
      f.x = f.px[i] + (f.px[i + 1] - f.px[i]) * r; f.y = f.py[i] + (f.py[i + 1] - f.py[i]) * r; return;
    }
    d -= f.ln[i];
  }
}
function routeDist(i, b, k, px, py) {
  px[0] = INX(i) + 4; py[0] = INY + 3;
  px[1] = px[0];      py[1] = 26;                        // lane just above the buckets
  px[2] = BX(b) + 11; py[2] = 26;
  px[3] = px[2];      py[3] = slotY(b, k) + 3;
}

A.update = function () {
  for (let i = 0; i < this.fl.length; i++) {
    const f = this.fl[i];
    if (!f.on) continue;
    f.t++; flyPos(f);
    if ((f.t & 3) === 0) this.spawn(f.x, f.y, 0, 0, 7, f.type === 3 ? C.lime : BC[f.bi]);
    if (f.t >= f.dur) {
      f.on = false;
      const tx = f.px[f.n - 1], ty = f.py[f.n - 1];
      if (f.type === 1) {
        this.hideB = -1; this.hideK = -1; this.hideIn = -1;
        this.burst(tx, ty, BC[f.bi], 7, 0.7); this.flash[f.bi] = 12;
        emit(EV.VALUE_TO_BUCKET_COMPLETE, f.bi, f.a);
      } else if (f.type === 2) {
        this.hideOut = -1; this.burst(tx, ty, BC[f.bi], 6, 0.6);
        emit(EV.CONCAT_VALUE_COMPLETE, f.bi, f.a);
      } else {
        this.hideIn = -1; this.burst(tx, ty, C.lime, 6, 0.6);
      }
    }
  }
  for (let i = 0; i < this.of.length; i++) {
    const o = this.of[i];
    if (!o.on) continue;
    o.t++;
    const e = ease(Math.min(1, o.t / o.dur));
    o.el.ox = o.ox0 * (1 - e); o.el.oy = o.oy0 * (1 - e);
    if (o.t >= o.dur) {
      o.on = false; o.el.ox = 0; o.el.oy = 0;
      if (o.evt) emit(o.evt, o.b, o.k);
    }
  }
  for (let i = 0; i < this.pt.length; i++) {
    const p = this.pt[i];
    if (!p.on) continue;
    p.t++; p.x += p.vx; p.y += p.vy; p.vy += 0.04;
    if (p.t >= p.life) p.on = false;
  }
  for (let b = 0; b < K; b++) if (this.flash[b] > 0) this.flash[b]--;
};

}

}

  const run = playing || stepFlag || S.done;
  if (!run) return;
  if (S.done && !A.busy() && !A.anyParts()) { playing = false; stepFlag = false; return; }
  A.frame++; A.update();
  if (S.done) { if (playing || stepFlag) { playing = false; stepFlag = false; refreshButtons(); } return; }
  if (A.busy()) return;
  if (cooldown > 0) { cooldown--; return; }
  if (playing) { advance(); if (S.done) refreshButtons(); }
  else stepFlag = false;
}

const $ = id => document.getElementById(id);
function refreshButtons() {
  $('bInfo').disabled = !S.done;
  $('bInfo').textContent = S.done ? 'Info ' + (UI.page + 1) + '/3' : 'Info';
  $('bSound').textContent = 'Sound: ' + (Snd.on ? 'on' : 'off');
  $('bSpeed').textContent = 'Speed ' + speed + 'x';
}
function doStart() {
  Snd.init();
  if (S.done) loadArray(curInput);
  playing = true; stepFlag = false;
}
function doPause() { playing = false; stepFlag = false; }
function doStep() {
  Snd.init();
  if (S.done) return;
  playing = false; A.finishAll(); cooldown = 0;
  advance(); stepFlag = true;
  if (S.done) refreshButtons();
}
function doReset() { shuffleCount = 0; curInput = permutation(0); loadArray(curInput); }
function doShuffle() { shuffleCount++; curInput = permutation(shuffleCount); loadArray(curInput); }

$('bStart').onclick = doStart;
$('bPause').onclick = doPause;
$('bStep').onclick = doStep;
$('bReset').onclick = doReset;
$('bShuffle').onclick = doShuffle;
$('bSound').onclick = () => { Snd.init(); Snd.on = !Snd.on; refreshButtons(); };
$('bSpeed').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; refreshButtons(); };
$('bInfo').onclick = () => { if (S.done) { UI.page = (UI.page + 1) % 3; refreshButtons(); } };
window.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); playing ? doPause() : doStart(); }
  else if (e.key === 'ArrowRight' || e.key === 'n') doStep();
  else if (e.key === 'r') doReset();
});

function fit() {
  const ch = $('controls').offsetHeight;
  const aw = window.innerWidth - 16, ah = window.innerHeight - ch - 36;
  scale = Math.max(1, Math.floor(Math.min(aw / W, ah / H)));
  view.width = W * scale; view.height = H * scale;
  vctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', fit);

let last = 0, acc = 0;
function frame(ts) {
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000 / 60) { acc -= 1000 / 60; for (let s = 0; s < speed; s++) tick(); }
  render();
  requestAnimationFrame(frame);
}

loadArray(curInput);
fit();
requestAnimationFrame(frame);

if (typeof window !== 'undefined') window.__BS = { S, EL, algo, EV, Bus, resetState, permutation, INITIAL, N, K };
})();
