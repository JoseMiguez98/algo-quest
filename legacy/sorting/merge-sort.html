<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Merge Sort Quest - 16-bit Visualizer</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0d0b17;overflow:hidden}
  #screen{position:fixed;left:0;top:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:default}
</style>
</head>
<body>
<canvas id="screen" aria-label="Merge Sort visualizer"></canvas>
<script>
(() => {
'use strict';

/* =====================================================================
   CONSTANTS, PALETTE, FONT
   ===================================================================== */
const W = 128, H = 96, STEP_MS = 1000 / 60;
const DEFAULT_DATA = [38, 12, 27, 43, 9, 31, 18, 27];   // 27 appears twice -> stability demo
const DEFAULT_SEED = 0x00C0FFEE;

// 24-colour NES-flavoured palette
const PAL = [
  '#0d0b17', '#1a1530', '#2a2350', '#3e3572', '#5a5194', '#8a83b8', '#c8c4e0', '#f4f2ff',
  '#8e1f2f', '#e8443c', '#f28c28', '#f8d84a', '#a8781c', '#17672f', '#2fb04a', '#78e878',
  '#1d3f8c', '#3a78e8', '#4fd8ec', '#7a3ec8', '#b070f8', '#e050b8', '#f8a8cc', '#8c5a30'
];
const C = { INK: 0, BG: 1, PANEL: 2, PHI: 3, LINE: 4, DIM: 5, GREY: 6, WHITE: 7, DRED: 8, RED: 9, ORG: 10,
  YEL: 11, DYEL: 12, DGRN: 13, GRN: 14, LGRN: 15, DBLU: 16, BLU: 17, CYN: 18, DPUR: 19, PUR: 20,
  MAG: 21, PINK: 22, BRN: 23 };
const ID_COL = [C.RED, C.ORG, C.YEL, C.LGRN, C.CYN, C.PUR, C.MAG, C.PINK];

// 3x5 pixel font ('~' is an arrow)
const FONT = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
  '5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111',
  'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110','E':'111100110100111',
  'F':'111100110100100','G':'011100101101011','H':'101101111101101','I':'111010010010111','J':'001001001101010',
  'K':'101101110101101','L':'100100100100111','M':'101111111101101','N':'110101101101101','O':'010101101101010',
  'P':'110101110100100','Q':'010101101111011','R':'110101110101101','S':'011100010001110','T':'111010010010010',
  'U':'101101101101111','V':'101101101101010','W':'101101111111101','X':'101101010101101','Y':'101101010010010',
  'Z':'111001010100111',
  '[':'110100100100110',']':'011001001001011','.':'000000000000010',',':'000000000010100',':':'000010000010000',
  '-':'000000111000000','+':'000010111010000','=':'000111000111000','<':'001010100010001','>':'100010001010100',
  '?':'110001010000010','!':'010010010000010','/':'001001010100100','(':'010100100100010',')':'010001001001010',
  '|':'010010010010010','_':'000000000000111','*':'101010111010101',"'":'010010000000000','~':'010001111001010',
  ' ':'000000000000000'
};
const GL = new Array(128).fill(null);
for (const ch in FONT) {
  const s = FONT[ch], a = new Uint8Array(15);
  for (let i = 0; i < 15; i++) a[i] = s.charCodeAt(i) === 49 ? 1 : 0;
  GL[ch.charCodeAt(0)] = a;
}

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const p2 = n => n < 10 ? '0' + n : '' + n;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Seeded, reproducible dataset generator (8 values, clearly unsorted)
function genArray(seed) {
  const rnd = mulberry32(seed);
  let arr = [];
  for (let attempt = 0; attempt < 64; attempt++) {
    arr = [];
    for (let i = 0; i < 8; i++) arr.push(5 + Math.floor(rnd() * 45));
    let inv = 0;
    for (let a = 0; a < 8; a++) for (let b = a + 1; b < 8; b++) if (arr[a] > arr[b]) inv++;
    if (inv >= 10 && inv <= 22) return arr;
  }
  return arr;
}

/* =====================================================================
   1. ALGORITHM LAYER  (owns array, recursion, pointers, temp buffer,
      comparisons, writes; emits semantic events)
   ===================================================================== */
const EVT = ['SORT_START', 'RECURSION_ENTER', 'SPLIT_START', 'SPLIT_COMPLETE', 'BASE_CASE', 'RECURSION_RETURN',
  'MERGE_START', 'MERGE_COMPARE', 'TAKE_LEFT', 'TAKE_RIGHT', 'LEFT_EXHAUSTED', 'RIGHT_EXHAUSTED',
  'COPY_REMAINDER_LEFT', 'COPY_REMAINDER_RIGHT', 'MERGE_OUTPUT_COMPLETE', 'COPY_BACK_START', 'COPY_BACK_STEP',
  'MERGE_COMPLETE', 'SORT_COMPLETE', 'RESET'];
const EVI = {};
EVT.forEach((n, i) => { EVI[n] = i; });

function makeRun(values) {
  const n = values.length;
  const S = {
    n, arr: values.slice(), ids: values.map((_, i) => i),          // ids = original positions (stability tracking)
    tmp: new Array(n).fill(0), tmpIds: new Array(n).fill(0),       // reusable auxiliary buffer
    left: 0, mid: -1, right: n - 1, i: -1, j: -1, k: 0,
    leftValue: null, rightValue: null, chosen: null,
    depth: 0, cmp: 0, merges: 0, writes: 0, maxDepth: 0, calls: 0,
    seq: 0, hash: 0x811C9DC5
  };
  const mix = v => { S.hash = Math.imul(S.hash ^ ((v == null ? -1 : v) | 0), 16777619) >>> 0; };

  function ev(type, x) {
    const e = x || {};
    e.type = type; e.seq = S.seq++;
    e.left = S.left; e.mid = S.mid; e.right = S.right;
    e.leftPointer = S.i; e.rightPointer = S.j; e.outputIndex = S.k;
    e.leftValue = S.leftValue; e.rightValue = S.rightValue; e.chosenValue = S.chosen;
    e.comparisonCount = S.cmp; e.mergeCount = S.merges; e.recursionDepth = S.depth;
    e.writes = S.writes; e.maxDepth = S.maxDepth;
    mix(EVI[type]); mix(e.left); mix(e.mid); mix(e.right); mix(e.leftPointer); mix(e.rightPointer);
    mix(e.outputIndex); mix(e.leftValue); mix(e.rightValue); mix(e.chosenValue); mix(e.comparisonCount);
    mix(e.mergeCount); mix(e.recursionDepth); mix(e.writes);
    if (e.src != null) mix(e.src);
    if (e.dst != null) mix(e.dst);
    if (e.result != null) mix(e.result ? 1 : 0);
    return e;
  }
  function frame(l, m, r, d) {
    S.left = l; S.mid = m; S.right = r; S.depth = d;
    S.i = -1; S.j = -1; S.k = 0; S.leftValue = null; S.rightValue = null; S.chosen = null;
  }
  function snap(l, r, extra) {
    const o = extra || {};
    o.vals = S.arr.slice(l, r + 1); o.ids = S.ids.slice(l, r + 1);
    return o;
  }

  // ---- real top-down merge sort -------------------------------------
  function* mergeSort(l, r, d) {
    frame(l, -1, r, d);
    if (d > S.maxDepth) S.maxDepth = d;
    S.calls++;
    const isBase = l >= r;
    yield ev('RECURSION_ENTER', snap(l, r, { isBase }));
    if (isBase) {                                   // left >= right : one element, already sorted
      yield ev('BASE_CASE', snap(l, r));
      yield ev('RECURSION_RETURN', snap(l, r, { sorted: true, base: true }));
      return;
    }
    const mid = Math.floor((l + r) / 2);
    frame(l, mid, r, d);
    yield ev('SPLIT_START', snap(l, r));
    yield ev('SPLIT_COMPLETE', snap(l, r));
    yield* mergeSort(l, mid, d + 1);
    yield* mergeSort(mid + 1, r, d + 1);
    yield* merge(l, mid, r, d);
    frame(l, mid, r, d);
    yield ev('RECURSION_RETURN', snap(l, r, { sorted: true, base: false }));
  }

  // ---- real stable merge --------------------------------------------
  function* merge(l, mid, r, d) {
    frame(l, mid, r, d);
    S.merges++;
    const a = S.arr, ia = S.ids, t = S.tmp, it = S.tmpIds;
    let i = l, j = mid + 1, k = 0;
    S.i = i; S.j = j; S.k = 0;
    yield ev('MERGE_START', snap(l, r));

    while (i <= mid && j <= r) {
      S.leftValue = a[i]; S.rightValue = a[j]; S.cmp++;
      const takeLeft = a[i] <= a[j];                // <= keeps the merge stable
      yield ev('MERGE_COMPARE', { result: takeLeft, tie: a[i] === a[j] });
      if (takeLeft) {
        t[k] = a[i]; it[k] = ia[i]; S.chosen = a[i];
        const src = i; i++; k++; S.i = i; S.k = k;
        yield ev('TAKE_LEFT', { side: 'L', src, dst: k - 1, id: it[k - 1] });
      } else {
        t[k] = a[j]; it[k] = ia[j]; S.chosen = a[j];
        const src = j; j++; k++; S.j = j; S.k = k;
        yield ev('TAKE_RIGHT', { side: 'R', src, dst: k - 1, id: it[k - 1] });
      }
    }
    // exactly one side is exhausted here; the other still holds a sorted remainder
    if (i > mid) yield ev('LEFT_EXHAUSTED', { remaining: r - j + 1 });
    else yield ev('RIGHT_EXHAUSTED', { remaining: mid - i + 1 });

    while (i <= mid) {
      t[k] = a[i]; it[k] = ia[i]; S.chosen = a[i];
      const src = i; i++; k++; S.i = i; S.k = k;
      yield ev('COPY_REMAINDER_LEFT', { side: 'L', src, dst: k - 1, id: it[k - 1] });
    }
    while (j <= r) {
      t[k] = a[j]; it[k] = ia[j]; S.chosen = a[j];
      const src = j; j++; k++; S.j = j; S.k = k;
      yield ev('COPY_REMAINDER_RIGHT', { side: 'R', src, dst: k - 1, id: it[k - 1] });
    }
    yield ev('MERGE_OUTPUT_COMPLETE', { vals: t.slice(0, k), ids: it.slice(0, k) });
    yield ev('COPY_BACK_START', { total: k });
    for (let q = 0; q < k; q++) {                   // copy-back: the only writes to the main array
      a[l + q] = t[q]; ia[l + q] = it[q]; S.writes++; S.chosen = t[q];
      yield ev('COPY_BACK_STEP', { index: l + q, slot: q, value: t[q], id: it[q] });
    }
    yield ev('MERGE_COMPLETE', snap(l, r));
  }

  function* sort() {
    frame(0, -1, n - 1, 0);
    yield ev('SORT_START', snap(0, n - 1));
    yield* mergeSort(0, n - 1, 0);
    frame(0, -1, n - 1, 0);
    yield ev('SORT_COMPLETE', snap(0, n - 1));
  }
  return { S, gen: sort() };
}

// Independent replay used after completion to prove determinism + correctness
function verifyRun(initial) {
  const r = makeRun(initial);
  let count = 0;
  for (const e of r.gen) count++;                  // eslint-disable-line no-unused-vars
  const S = r.S, ref = initial.slice().sort((a, b) => a - b);
  let sorted = true, stable = true;
  for (let i = 0; i < S.n; i++) if (S.arr[i] !== ref[i]) sorted = false;
  for (let i = 1; i < S.n; i++) if (S.arr[i - 1] === S.arr[i] && S.ids[i - 1] > S.ids[i]) stable = false;
  return { events: count, hash: S.hash >>> 0, sorted, stable };
}

/* =====================================================================
   PLAYER STATE
   ===================================================================== */
const DUR = {
  SORT_START: 700, RECURSION_ENTER: 350, SPLIT_START: 450, SPLIT_COMPLETE: 550, BASE_CASE: 350,
  RECURSION_RETURN: 300, MERGE_START: 450, MERGE_COMPARE: 380, TAKE_LEFT: 500, TAKE_RIGHT: 500,
  LEFT_EXHAUSTED: 450, RIGHT_EXHAUSTED: 450, COPY_REMAINDER_LEFT: 280, COPY_REMAINDER_RIGHT: 280,
  MERGE_OUTPUT_COMPLETE: 400, COPY_BACK_START: 320, COPY_BACK_STEP: 320, MERGE_COMPLETE: 550,
  SORT_COMPLETE: 1500
};
const SPEEDS = [1, 2, 4];
const P = {
  data: DEFAULT_DATA.slice(), seed: DEFAULT_SEED,
  run: null, gen: null, state: 'intro',            // intro | running | done
  cur: null, ev: null, t: 0, dur: 1,
  playing: false, runOne: false, speedIdx: 0, verify: null
};
const progress = () => P.cur ? Math.min(1, P.t / P.dur) : 1;
let tick = 0;

/* =====================================================================
   2. ANIMATION / VIEW LAYER  (consumes events, never decides outcomes)
   ===================================================================== */
const NODE_CAP = 40;
const V = {
  nodes: [], splitAt: new Int8Array(16).fill(99),
  stack: [], stackLen: 0,
  zone: { mode: 'intro', l: 0, mid: -1, r: 0, n: 0, d: 0, isBase: false, vals: new Int16Array(16), ids: new Int8Array(16) },
  merge: {
    active: false, l: 0, mid: 0, r: 0, d: 0, lLen: 0, rLen: 0, total: 0, ox: 0,
    v: new Int16Array(16), id: new Int8Array(16), lPtr: 0, rPtr: 0, liftSide: 0, liftIdx: -1,
    tokV: 0, tokId: 0, tokDst: 0, outCount: 0, outV: new Int16Array(16), outI: new Int8Array(16), written: 0
  },
  hud: { depth: -1, l: -1, r: -1, mid: -1, lp: -1, rp: -1, out: 0, cmp: 0, status: 'READY' },
  phase: -1, done: false
};
for (let i = 0; i < NODE_CAP; i++) {
  V.nodes.push({ used: false, l: 0, r: 0, d: 0, mid: -1, state: 0, len: 0, vals: new Int16Array(16), ids: new Int8Array(16),
    spawning: false, collapsing: false, flash: 0, cf: new Uint8Array(16), inStack: false, top: false });
}
for (let i = 0; i < 8; i++) V.stack.push({ l: 0, r: 0, d: 0, dying: false, born: 0 });

// particles (pooled, deterministic PRNG reseeded per event)
const PN = 72;
const PT = { x: new Float32Array(PN), y: new Float32Array(PN), vx: new Float32Array(PN), vy: new Float32Array(PN),
  life: new Int16Array(PN), col: new Uint8Array(PN), big: new Uint8Array(PN) };
let prng = mulberry32(1);
function burst(x, y, n, cols, spd, big) {
  for (let s = 0, made = 0; s < PN && made < n; s++) {
    if (PT.life[s] > 0) continue;
    PT.x[s] = x; PT.y[s] = y;
    PT.vx[s] = (prng() - 0.5) * spd * 2; PT.vy[s] = -(0.3 + prng()) * spd;
    PT.life[s] = 16 + ((prng() * 14) | 0); PT.col[s] = cols[(prng() * cols.length) | 0]; PT.big[s] = big ? 1 : 0;
    made++;
  }
}
const COL_TAKE = [C.LGRN, C.YEL, C.WHITE, C.CYN];
const COL_DONE = [C.YEL, C.LGRN, C.WHITE, C.ORG, C.CYN, C.PINK];

function rowY(d) { return 10 + d * 10; }
// x of element i when displayed on tree depth d; each split boundary created above depth d opens a 2px gap
function cellX(i, d) {
  let c = 0;
  for (let b = 0; b < i; b++) if (V.splitAt[b] < d) c++;
  return 2 + i * 10 + c * 2;
}
const nodeX0 = nd => cellX(nd.l, nd.d);
const nodeX1 = nd => cellX(nd.r, nd.d) + 8;

function allocNode(l, r, d) {
  for (let i = 0; i < NODE_CAP; i++) {
    const n = V.nodes[i];
    if (!n.used) {
      n.used = true; n.l = l; n.r = r; n.d = d; n.mid = -1; n.state = 0; n.len = r - l + 1;
      n.spawning = false; n.collapsing = false; n.flash = 0; n.cf.fill(0); n.inStack = false; n.top = false;
      return n;
    }
  }
  return null;
}
function findNode(l, r, d) {
  for (let i = 0; i < NODE_CAP; i++) {
    const n = V.nodes[i];
    if (n.used && n.l === l && n.r === r && n.d === d) return n;
  }
  return null;
}
function setNodeVals(n, vals, ids, off) {
  const o = off || 0;
  for (let k = 0; k < n.len; k++) { n.vals[k] = vals[o + k]; n.ids[k] = ids[o + k]; }
}
function setZone(mode, ev) {
  const z = V.zone;
  z.mode = mode; z.l = ev.left; z.mid = ev.mid; z.r = ev.right; z.d = ev.recursionDepth;
  z.n = ev.right - ev.left + 1; z.isBase = !!ev.isBase;
  if (ev.vals) for (let k = 0; k < ev.vals.length; k++) { z.vals[k] = ev.vals[k]; z.ids[k] = ev.ids[k]; }
}

function resetView(values) {
  for (let i = 0; i < NODE_CAP; i++) V.nodes[i].used = false;
  V.splitAt.fill(99); V.stackLen = 0;
  const M = V.merge; M.active = false; M.liftSide = 0; M.liftIdx = -1; M.outCount = 0; M.written = 0; M.lPtr = 0; M.rPtr = 0;
  const h = V.hud; h.depth = -1; h.l = -1; h.r = -1; h.mid = -1; h.lp = -1; h.rp = -1; h.out = 0; h.cmp = 0; h.status = 'READY';
  V.phase = -1; V.done = false; V.zone.mode = 'intro'; PT.life.fill(0);
  const root = allocNode(0, values.length - 1, 0);
  root.state = 1;
  for (let k = 0; k < values.length; k++) { root.vals[k] = values[k]; root.ids[k] = k; }
}

function statusOf(e) {
  switch (e.type) {
    case 'SORT_START': return 'START';
    case 'RECURSION_ENTER': return 'CALL';
    case 'SPLIT_START': case 'SPLIT_COMPLETE': return 'SPLIT';
    case 'BASE_CASE': return 'BASE';
    case 'RECURSION_RETURN': return 'RETURN';
    case 'MERGE_START': return 'MERGING';
    case 'MERGE_COMPARE': return 'COMPARE';
    case 'TAKE_LEFT': return 'TAKE L';
    case 'TAKE_RIGHT': return 'TAKE R';
    case 'LEFT_EXHAUSTED': return 'L EMPTY';
    case 'RIGHT_EXHAUSTED': return 'R EMPTY';
    case 'COPY_REMAINDER_LEFT': return 'COPY L';
    case 'COPY_REMAINDER_RIGHT': return 'COPY R';
    case 'MERGE_OUTPUT_COMPLETE': return 'OUTPUT';
    case 'COPY_BACK_START': case 'COPY_BACK_STEP': return 'COPYBK';
    case 'MERGE_COMPLETE': return 'MERGED';
    case 'SORT_COMPLETE': return 'SORTED';
    default: return 'READY';
  }
}

function initMerge(ev) {
  const M = V.merge;
  M.l = ev.left; M.mid = ev.mid; M.r = ev.right; M.d = ev.recursionDepth;
  M.lLen = ev.mid - ev.left + 1; M.rLen = ev.right - ev.mid; M.total = M.lLen + M.rLen;
  M.ox = 2 + Math.floor((92 - (M.total * 10 + 4)) / 2);
  for (let k = 0; k < M.total; k++) { M.v[k] = ev.vals[k]; M.id[k] = ev.ids[k]; }
  M.lPtr = 0; M.rPtr = 0; M.liftSide = 0; M.liftIdx = -1; M.outCount = 0; M.written = 0; M.active = true;
}
const outX = k => V.merge.ox + k * 10;
const leftX = k => V.merge.ox + k * 10;
const rightX = k => V.merge.ox + V.merge.lLen * 10 + 4 + k * 10;
const Y_RUN = 62, Y_OUT = 72;

function beginEvent(ev) {
  const h = V.hud, M = V.merge;
  h.depth = ev.recursionDepth; h.l = ev.left; h.r = ev.right; h.mid = ev.mid;
  h.lp = ev.leftPointer; h.rp = ev.rightPointer; h.out = ev.outputIndex; h.cmp = ev.comparisonCount;
  h.status = statusOf(ev);
  prng = mulberry32((0x9E3779B1 ^ Math.imul(ev.seq + 1, 0x85EBCA6B)) >>> 0);
  let nd;
  switch (ev.type) {
    case 'SORT_START': V.phase = -1; break;
    case 'RECURSION_ENTER': {
      V.phase = 0;
      nd = findNode(ev.left, ev.right, ev.recursionDepth) || allocNode(ev.left, ev.right, ev.recursionDepth);
      if (nd) { setNodeVals(nd, ev.vals, ev.ids); nd.state = 1; }
      const e = V.stack[V.stackLen++]; e.l = ev.left; e.r = ev.right; e.d = ev.recursionDepth; e.dying = false;
      setZone('call', ev);
      break;
    }
    case 'SPLIT_START': V.phase = 0; setZone('split', ev); break;
    case 'SPLIT_COMPLETE': {
      V.phase = 0;
      V.splitAt[ev.mid] = ev.recursionDepth;
      const par = findNode(ev.left, ev.right, ev.recursionDepth);
      if (par) par.mid = ev.mid;
      const d = ev.recursionDepth + 1, ln = ev.mid - ev.left + 1;
      const a = allocNode(ev.left, ev.mid, d), b = allocNode(ev.mid + 1, ev.right, d);
      if (a) { setNodeVals(a, ev.vals, ev.ids, 0); a.spawning = true; }
      if (b) { setNodeVals(b, ev.vals, ev.ids, ln); b.spawning = true; }
      setZone('split', ev);
      break;
    }
    case 'BASE_CASE':
      V.phase = 1;
      nd = findNode(ev.left, ev.right, ev.recursionDepth);
      if (nd) {
        nd.state = 2; nd.flash = 26;
        burst((nodeX0(nd) + nodeX1(nd)) >> 1, rowY(nd.d) + 3, 8, COL_TAKE, 1.2, false);
      }
      setZone('base', ev);
      break;
    case 'RECURSION_RETURN':
      if (V.stackLen > 0) V.stack[V.stackLen - 1].dying = true;
      setZone('return', ev);
      break;
    case 'MERGE_START': V.phase = 2; initMerge(ev); setZone('merge', ev); break;
    case 'MERGE_COMPARE': V.phase = 2; break;
    case 'TAKE_LEFT': case 'COPY_REMAINDER_LEFT':
      V.phase = 2; M.liftSide = 1; M.liftIdx = ev.src - M.l; M.tokV = ev.chosenValue; M.tokId = ev.id; M.tokDst = ev.dst;
      break;
    case 'TAKE_RIGHT': case 'COPY_REMAINDER_RIGHT':
      V.phase = 2; M.liftSide = 2; M.liftIdx = ev.src - (M.mid + 1); M.tokV = ev.chosenValue; M.tokId = ev.id; M.tokDst = ev.dst;
      break;
    case 'LEFT_EXHAUSTED': case 'RIGHT_EXHAUSTED': case 'MERGE_OUTPUT_COMPLETE': case 'COPY_BACK_START':
    case 'COPY_BACK_STEP':
      V.phase = 2; break;
    case 'MERGE_COMPLETE': {
      V.phase = 2;

/* ---- player control ------------------------------------------------ */
function startNext(over) {
  if (P.state !== 'running' || !P.gen) { P.playing = false; P.runOne = false; return; }
  const r = P.gen.next();
  if (r.done) { P.state = 'done'; P.playing = false; P.runOne = false; return; }
  P.cur = r.value; P.ev = r.value; P.dur = DUR[r.value.type] || 300;
  P.t = over > 0 && over < P.dur ? over : 0;
  beginEvent(P.cur);
}
function finishEvent() { const e = P.cur; completeEvent(e); P.cur = null; P.runOne = false; }

function beginRun() { P.run = makeRun(P.data); P.gen = P.run.gen; P.state = 'running'; P.cur = null; P.ev = null; }
function resetAll() {
  P.state = 'intro'; P.run = null; P.gen = null; P.cur = null; P.ev = null; P.t = 0;
  P.playing = false; P.runOne = false; P.verify = null;
  resetView(P.data);
  auEvent({ type: 'RESET' });
}
function doStart() {
  if (P.state === 'done') resetAll();
  if (P.state === 'intro') beginRun();
  P.playing = true; P.runOne = false;
}
function doPause() { if (P.state === 'running') P.playing = false; }
function doStep() {
  if (P.state === 'done') resetAll();
  if (P.state === 'intro') beginRun();
  P.playing = false; P.runOne = true;
}
function doShuffle() {
  P.seed = (Math.imul(P.seed, 1664525) + 1013904223) >>> 0;
  P.data = genArray(P.seed);
  resetAll();
}
function doSpeed() { P.speedIdx = (P.speedIdx + 1) % SPEEDS.length; }

function update(dt) {
  tick++;
  if (P.cur) {
    if (P.playing || P.runOne) {
      P.t += dt * SPEEDS[P.speedIdx];
      if (P.t >= P.dur) {
        const over = P.t - P.dur;
        finishEvent();
        if (P.playing) startNext(over);
      }
    }
  } else if (P.playing || P.runOne) startNext(0);

  for (let i = 0; i < NODE_CAP; i++) {
    const n = V.nodes[i];
    if (!n.used) continue;
    if (n.flash > 0) n.flash--;
    for (let k = 0; k < n.len; k++) if (n.cf[k] > 0) n.cf[k]--;
  }
  for (let s = 0; s < PN; s++) {
    if (PT.life[s] <= 0) continue;
    PT.x[s] += PT.vx[s]; PT.y[s] += PT.vy[s]; PT.vy[s] += 0.07; PT.life[s]--;
  }
}

/* =====================================================================
   5. AUDIO LAYER (procedural 8-bit; reacts to events only)
   ===================================================================== */
const AU = { ctx: null, master: null, noise: null, on: true, vol: 0.6 };
function auInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    AU.ctx = new AC();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = AU.on ? AU.vol : 0;
    AU.master.connect(AU.ctx.destination);
    const len = Math.floor(AU.ctx.sampleRate * 0.1), buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = buf.getChannelData(0);
    let s = 12345;                                   // deterministic noise
    for (let i = 0; i < len; i++) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; d[i] = (s / 4294967296) * 2 - 1; }
    AU.noise = buf;

}
function auApply() { if (AU.master) AU.master.gain.value = AU.on ? AU.vol : 0; }
function tone(type, f, t, dur, vol, f2) {

  g.gain.linearRampToValueAtTime(vol, t + 0.004);

}
function noiseBurst(t, dur, vol) {

  s.buffer = AU.noise;

function arp(freqs, t, step, type, vol) { for (let i = 0; i < freqs.length; i++) tone(type, freqs[i], t + i * step, step * 1.1, vol); }
function auEvent(ev) {
  if (!AU.ctx || !AU.on) return;
  const t = AU.ctx.currentTime + 0.005;
  switch (ev.type) {
    case 'SORT_START': arp([262, 330, 392, 523], t, 0.08, 'square', 0.22); break;
    case 'RECURSION_ENTER': tone('triangle', 300 + ev.recursionDepth * 45, t, 0.05, 0.25); break;
    case 'SPLIT_START': tone('square', 659, t, 0.07, 0.18); tone('square', 494, t + 0.08, 0.1, 0.18); break;
    case 'SPLIT_COMPLETE': tone('triangle', 240, t, 0.12, 0.3, 170); break;
    case 'BASE_CASE': tone('square', 880, t, 0.05, 0.18); tone('square', 1175, t + 0.06, 0.09, 0.18); break;
    case 'RECURSION_RETURN': tone('triangle', ev.sorted && !ev.base ? 440 : 370, t, 0.07, 0.22); break;
    case 'MERGE_START': tone('triangle', 196, t, 0.1, 0.35); tone('triangle', 247, t + 0.11, 0.12, 0.35); break;
    case 'MERGE_COMPARE': {
      const a = (ev.comparisonCount & 1) ? 660 : 550, b = (ev.comparisonCount & 1) ? 550 : 660;
      tone('square', a, t, 0.04, 0.14); tone('square', b, t + 0.06, 0.04, 0.14); break;
    }
    case 'TAKE_LEFT': tone('square', 784, t, 0.09, 0.2, 880); break;
    case 'TAKE_RIGHT': tone('square', 587, t, 0.09, 0.2, 523); break;
    case 'LEFT_EXHAUSTED': case 'RIGHT_EXHAUSTED': tone('triangle', 523, t, 0.08, 0.3); tone('triangle', 784, t + 0.09, 0.14, 0.3); break;
    case 'COPY_REMAINDER_LEFT': case 'COPY_REMAINDER_RIGHT': noiseBurst(t, 0.02, 0.2); tone('square', 1568, t, 0.025, 0.1); break;
    case 'MERGE_OUTPUT_COMPLETE': tone('triangle', 440, t, 0.18, 0.3); break;
    case 'COPY_BACK_START': tone('square', 330, t, 0.05, 0.14); break;
    case 'COPY_BACK_STEP': tone('square', 700 + ev.slot * 70, t, 0.05, 0.14); break;
    case 'MERGE_COMPLETE': arp([523, 659, 784], t, 0.09, 'square', 0.22); break;
    case 'SORT_COMPLETE': {
      const mel = [[523, .1], [659, .1], [784, .1], [1047, .22], [784, .1], [1047, .34]];

      for (const m of mel) { tone('square', m[0], tt, m[1], 0.2); tone('triangle', m[0] / 2, tt, m[1], 0.25); tt += m[1]; }

    default: break;
  }
}

/* =====================================================================
   4. RENDERING LAYER  (draws state; modifies nothing in the algorithm)
   ===================================================================== */
const screen = document.getElementById('screen');
const sctx = screen.getContext('2d');
const lc = document.createElement('canvas');
lc.width = W; lc.height = H;
const L = lc.getContext('2d');
L.imageSmoothingEnabled = false;

function R(x, y, w, h, c) { if (w <= 0 || h <= 0) return; L.fillStyle = PAL[c]; L.fillRect(x | 0, y | 0, w | 0, h | 0); }

function panel(x, y, w, h, fill, bord) {

}
function T(s, x, y, c, sc) {

}
const TW = (s, sc) => s.length * 4 * (sc || 1) - (sc || 1);
function TC(s, cx, y, c, sc) { T(s, Math.round(cx - TW(s, sc) / 2), y, c, sc); }

function cell(x, y, v, id, bg, fg) {
  R(x, y, 9, 7, bg);
  T(p2(v), x + 1, y + 1, fg);

}
function ghost(x, y) { R(x, y, 9, 7, C.BG); outline(x, y, 9, 7, C.PANEL); }

/* ---------- tree ---------- */
function nodeCenter(nd) { return (nodeX0(nd) + nodeX1(nd)) >> 1; }

function drawTree() {
  const p = progress(), cur = P.cur;
  for (let i = 0; i < NODE_CAP; i++) { V.nodes[i].inStack = false; V.nodes[i].top = false; }
  for (let s = 0; s < V.stackLen; s++) {
    const e = V.stack[s], nd = findNode(e.l, e.r, e.d);
    if (nd) { nd.inStack = true; if (s === V.stackLen - 1) nd.top = true; }
  }
  // connectors
  for (let i = 0; i < NODE_CAP; i++) {
    const par = V.nodes[i];
    if (!par.used || par.mid < 0) continue;
    const a = findNode(par.l, par.mid, par.d + 1), b = findNode(par.mid + 1, par.r, par.d + 1);
    if (!a || !b || a.collapsing || b.collapsing) continue;
    if ((a.spawning || b.spawning) && !(cur && cur.type === 'SPLIT_COMPLETE' && p > 0.7)) continue;
    const em = par.inStack && (a.inStack || b.inStack || a.top || b.top);
    const col = em ? C.YEL : C.LINE, py = rowY(par.d) + 7, pc = nodeCenter(par), ac = nodeCenter(a), bc = nodeCenter(b);
    PX(pc, py, col); HL(ac, py + 1, bc - ac + 1, col); PX(ac, py + 2, col); PX(bc, py + 2, col);
  }
  for (let d = 3; d >= 0; d--) for (let i = 0; i < NODE_CAP; i++) { const nd = V.nodes[i]; if (nd.used && nd.d === d) drawNode(nd); }
  // glowing frames for the active recursion branch
  const M = V.merge;
  for (let i = 0; i < NODE_CAP; i++) {
    const nd = V.nodes[i];
    if (!nd.used || !nd.inStack || nd.spawning || nd.collapsing) continue;
    const merging = M.active && nd.l === M.l && nd.r === M.r && nd.d === M.d;
    let col;
    if (merging) col = ((tick >> 3) & 1) ? C.LGRN : C.GRN;
    else if (nd.top) col = ((tick >> 3) & 1) ? C.YEL : C.ORG;
    else col = C.DYEL;
    const x0 = nodeX0(nd), y0 = rowY(nd.d);

}

function drawNode(nd) {
  const p = progress(), cur = P.cur;
  const sp = nd.spawning ? ease(cur && cur.type === 'SPLIT_COMPLETE' ? p : 1) : 1;
  const cq = nd.collapsing ? ease(cur && cur.type === 'MERGE_COMPLETE' ? p : 1) : 0;
  const M = V.merge, Z = V.zone;
  const splitting = Z.mode === 'split' && nd.l === Z.l && nd.r === Z.r && nd.d === Z.d;
  const sweepX = cur && cur.type === 'SORT_COMPLETE' ? 2 + Math.round(p * 96) : -1;
  for (let k = 0; k < nd.len; k++) {
    const i = nd.l + k;
    let x = cellX(i, nd.d), y = rowY(nd.d);
    if (nd.d > 0 && sp < 1) { x = Math.round(lerp(cellX(i, nd.d - 1), x, sp)); y = Math.round(lerp(rowY(nd.d - 1), y, sp)); }
    if (cq > 0) { x = Math.round(lerp(x, cellX(i, nd.d - 1), cq)); y = Math.round(lerp(y, rowY(nd.d - 1), cq)); }
    let bg, fg = C.WHITE;
    if (nd.state === 0) { bg = C.PANEL; fg = C.GREY; }
    else if (nd.state === 1) bg = C.DBLU;

    if (splitting && nd.state === 1) bg = (i <= Z.mid) ? C.BLU : C.BRN;
    if (M.active && nd.l === M.l && nd.r === M.r && nd.d === M.d) bg = C.DBLU;

/* ---------- zone below the tree ---------- */

function drawZone() {

}
function drawIntro() {

}

  // label
  T('MERGE', 2, 49, C.WHITE);
  T('[' + M.l + '..' + M.mid + ']', 24, 49, C.CYN); T('+', 49, 49, C.GREY);
  T('[' + (M.mid + 1) + '..' + M.r + ']', 53, 49, C.ORG); T('~OUT', 79, 49, C.LGRN);

  const isCmp = cur && cur.type === 'MERGE_COMPARE';
  const blink = (tick >> 2) & 1;
  // left run
  for (let k = 0; k < lL; k++) {
    const x = leftX(k);
    if (k < M.lPtr || (M.liftSide === 1 && M.liftIdx === k)) { ghost(x, Y_RUN); continue; }
    let bg = C.DBLU, fg = C.WHITE;
    if (k === M.lPtr) bg = C.BLU;
    if (isCmp && k === M.lPtr) { bg = blink ? C.YEL : C.ORG; fg = C.INK; }
    cell(x, Y_RUN, M.v[k], M.id[k], bg, fg);
  }
  // right run
  for (let k = 0; k < rL; k++) {
    const x = rightX(k);
    if (k < M.rPtr || (M.liftSide === 2 && M.liftIdx === k)) { ghost(x, Y_RUN); continue; }
    let bg = C.BRN, fg = C.WHITE;
    if (k === M.rPtr) bg = C.ORG, fg = C.INK;
    if (isCmp && k === M.rPtr) { bg = blink ? C.YEL : C.ORG; fg = C.INK; }
    cell(x, Y_RUN, M.v[lL + k], M.id[lL + k], bg, fg);
  }
  // compare result marker (winner outlined once the decision is shown)
  if (isCmp && p >= 0.5) {
    if (cur.result) outline(leftX(M.lPtr) - 1, Y_RUN - 1, 11, 9, C.LGRN);
    else outline(rightX(M.rPtr) - 1, Y_RUN - 1, 11, 9, C.LGRN);
  }
  // pointers (glide while an element is being taken)
  let lpf = M.lPtr, rpf = M.rPtr;
  if (cur && (cur.type === 'TAKE_LEFT' || cur.type === 'COPY_REMAINDER_LEFT')) lpf = lerp(M.lPtr, cur.leftPointer - M.l, ease((p - 0.5) * 2));
  if (cur && (cur.type === 'TAKE_RIGHT' || cur.type === 'COPY_REMAINDER_RIGHT')) rpf = lerp(M.rPtr, cur.rightPointer - (M.mid + 1), ease((p - 0.5) * 2));
  if (lpf < lL - 0.001) pointerMark(leftX(0) + Math.round(lpf * 10), 'L', C.CYN);
  if (rpf < rL - 0.001) pointerMark(rightX(0) + Math.round(rpf * 10), 'R', C.ORG);
  // merge direction arrows
  downArrow(leftX(0) + ((lL * 10 - 1) >> 1), C.CYN);
  downArrow(rightX(0) + ((rL * 10 - 1) >> 1), C.ORG);

  // output buffer
  const flashOut = cur && cur.type === 'MERGE_OUTPUT_COMPLETE' && ((tick >> 2) & 1);
  for (let m = 0; m < M.total; m++) {
    const x = outX(m);
    if (m < M.outCount) {
      const sent = m < M.written;
      cell(x, Y_OUT, M.outV[m], M.outI[m], flashOut ? C.GRN : (sent ? C.PANEL : C.DGRN), sent ? C.GRN : C.WHITE);
    } else {
      R(x, Y_OUT, 9, 7, C.BG); outline(x, Y_OUT, 9, 7, m === M.outCount && M.active ? (blink ? C.LGRN : C.DGRN) : C.PANEL);
      T('--', x + 1, Y_OUT + 1, C.PANEL);
    }
  }
  // flying token: element being taken / copied into the output buffer
  if (cur && M.liftSide > 0 && (cur.type === 'TAKE_LEFT' || cur.type === 'TAKE_RIGHT' || cur.type === 'COPY_REMAINDER_LEFT' || cur.type === 'COPY_REMAINDER_RIGHT')) {
    const sx = M.liftSide === 1 ? leftX(M.liftIdx) : rightX(M.liftIdx), dx = outX(M.tokDst);
    const t = ease((p - 0.15) / 0.85), lift = p < 0.15 ? 1 : 0;
    const x = Math.round(lerp(sx, dx, t)), y = Math.round(lerp(Y_RUN, Y_OUT, t)) - lift - Math.round(Math.sin(Math.PI * t) * 2);
    cell(x, y, M.tokV, M.tokId, M.liftSide === 1 ? C.BLU : C.ORG, M.liftSide === 1 ? C.WHITE : C.INK);
    outline(x - 1, y - 1, 11, 9, C.YEL);
  }
}

function drawTokens() {
  const M = V.merge, cur = P.cur, p = progress();
  if (cur && cur.type === 'COPY_BACK_STEP') {
    const sx = outX(cur.slot), sy = Y_OUT, dx = cellX(cur.index, M.d), dy = rowY(M.d);
    const t = ease(p / 0.9);
    const x = Math.round(lerp(sx, dx, t)), y = Math.round(lerp(sy, dy, t));
    cell(x, y, cur.value, cur.id, C.GRN, C.WHITE);
    outline(x - 1, y - 1, 11, 9, C.LGRN);
  }
  for (let s = 0; s < PN; s++) {
    if (PT.life[s] <= 0) continue;
    const c = PT.life[s] < 6 && (PT.life[s] & 1) ? C.DIM : PT.col[s];
    if (PT.big[s]) R(PT.x[s], PT.y[s], 2, 2, c); else PX(PT.x[s], PT.y[s], c);
  }
}

/* ---------- HUD, title, message bar, buttons ---------- */
function kv(lbl, val, y, col) { T(lbl, 99, y, C.DIM); T(val, 99 + lbl.length * 4, y, col); }
function drawHud() {
  panel(97, 10, 31, 68, C.BG, C.LINE);
  const h = V.hud, p = progress();
  kv('DEPTH ', h.depth < 0 ? '-' : '' + h.depth, 11, C.WHITE);
  kv('RNG ', h.l < 0 ? '--' : h.l + '-' + h.r, 17, C.WHITE);
  kv('MID ', h.mid < 0 ? '-' : '' + h.mid, 23, C.CYN);
  T('L', 99, 29, C.CYN); T(h.lp < 0 ? '-' : '' + h.lp, 103, 29, C.WHITE);
  T('R', 111, 29, C.ORG); T(h.rp < 0 ? '-' : '' + h.rp, 115, 29, C.WHITE);
  kv('OUT ', '' + h.out, 35, C.LGRN);
  kv('CMP ', '' + h.cmp, 41, C.YEL);
  const sc = V.phase === 0 ? C.YEL : V.phase === 1 ? C.LGRN : V.phase === 2 ? C.CYN : V.phase === 3 ? C.LGRN : C.GREY;
  T(h.status, 99, 47, sc);
  for (let d = 0; d < 4; d++) {
    const y = 53 + d * 6;
    if (d < V.stackLen) {
      const e = V.stack[d], top = d === V.stackLen - 1;
      let col = C.WHITE;
      if (top) {
        col = ((tick >> 3) & 1) ? C.YEL : C.ORG;
        if (e.dying) col = C.RED;
        else if (P.cur && P.cur.type === 'RECURSION_ENTER' && p < 0.6) col = C.WHITE;
        R(98, y + 1, 1, 3, col);
      }
      T('D' + d + ' ' + e.l + '-' + e.r, 100, y, col);
    } else T('D' + d + ' --', 100, y, C.PANEL);
  }
}

function chip(label, x, idx, col) {
  const w = TW(label) + 2, active = V.phase === idx || (V.phase === 3);
  R(x, 1, w, 7, active ? (V.phase === 3 ? C.LGRN : col) : C.BG);
  T(label, x + 1, 2, active ? C.INK : C.DIM);
}
function drawTitle() {
  R(0, 0, W, 8, C.PANEL); HL(0, 8, W, C.LINE); HL(0, 0, W, C.PHI);
  T('MERGE SORT', 2, 2, C.YEL);
  chip('DIVIDE', 43, 0, C.YEL); chip('BASE', 69, 1, C.LGRN); chip('MERGE', 87, 2, C.CYN);
  // sound button
  R(110, 1, 8, 7, UI.hover === 'snd' ? C.PHI : C.BG);
  R(111, 3, 2, 3, C.WHITE); R(113, 2, 1, 5, C.WHITE);
  if (AU.on) { R(115, 3, 1, 3, C.LGRN); if (AU.vol > 0.65) R(117, 2, 1, 5, C.LGRN); }
  else { PX(115, 3, C.RED); PX(117, 3, C.RED); PX(116, 4, C.RED); PX(115, 5, C.RED); PX(117, 5, C.RED); }
  // info button
  R(119, 1, 7, 7, UI.info ? C.YEL : (UI.hover === 'info' ? C.PHI : C.BG));
  T('?', 121, 2, UI.info ? C.INK : C.WHITE);
}

let MC = C.WHITE;
function messageText(ev, p) {
  MC = C.WHITE;
  if (!ev) { MC = ((tick >> 4) & 1) ? C.YEL : C.WHITE; return 'PRESS START OR STEP'; }
  const l = ev.left, r = ev.right, m = ev.mid;
  switch (ev.type) {
    case 'SORT_START': MC = C.YEL; return 'MERGE SORT START N=' + (ev.vals ? ev.vals.length : 0);
    case 'RECURSION_ENTER': MC = C.WHITE; return 'CALL MERGESORT(' + l + ',' + r + ') DEPTH ' + ev.recursionDepth;
    case 'SPLIT_START': MC = C.YEL; return 'SPLIT [' + l + '..' + r + ']  MID = ' + m;
    case 'SPLIT_COMPLETE': MC = C.YEL; return '[' + l + '..' + r + '] ~ [' + l + '..' + m + '] + [' + (m + 1) + '..' + r + ']';
    case 'BASE_CASE': MC = C.LGRN; return 'BASE CASE: ONE ELEMENT SORTED';
    case 'RECURSION_RETURN': MC = C.LGRN; return 'RETURN [' + l + '..' + r + '] SORTED';
    case 'MERGE_START': MC = C.CYN; return 'MERGE [' + l + '..' + m + '] + [' + (m + 1) + '..' + r + ']';
    case 'MERGE_COMPARE': {
      const a = p2(ev.leftValue), b = p2(ev.rightValue);
      if (p < 0.5) { MC = C.YEL; return a + ' <= ' + b + ' ?'; }
      if (ev.tie) { MC = C.LGRN; return a + ' <= ' + b + ' YES: TIE, LEFT FIRST'; }
      MC = ev.result ? C.CYN : C.ORG;
      return a + ' <= ' + b + ' ? ' + (ev.result ? 'YES ~ TAKE LEFT' : 'NO ~ TAKE RIGHT');
    }
    case 'TAKE_LEFT': MC = C.CYN; return 'TAKE LEFT ' + p2(ev.chosenValue) + ' ~ OUT[' + ev.dst + ']';
    case 'TAKE_RIGHT': MC = C.ORG; return 'TAKE RIGHT ' + p2(ev.chosenValue) + ' ~ OUT[' + ev.dst + ']';
    case 'LEFT_EXHAUSTED': MC = C.CYN; return p < 0.5 ? 'LEFT EXHAUSTED' : 'COPY REMAINDER FROM RIGHT';
    case 'RIGHT_EXHAUSTED': MC = C.ORG; return p < 0.5 ? 'RIGHT EXHAUSTED' : 'COPY REMAINDER FROM LEFT';
    case 'COPY_REMAINDER_LEFT': MC = C.CYN; return 'COPY REMAINDER LEFT: ' + p2(ev.chosenValue);
    case 'COPY_REMAINDER_RIGHT': MC = C.ORG; return 'COPY REMAINDER RIGHT: ' + p2(ev.chosenValue);
    case 'MERGE_OUTPUT_COMPLETE': {
      MC = C.LGRN; let s = 'OUT:';
      for (let k = 0; k < ev.vals.length; k++) s += ' ' + p2(ev.vals[k]);
      return s;
    }
    case 'COPY_BACK_START': MC = C.LGRN; return 'COPY BACK [' + l + '..' + r + ']';
    case 'COPY_BACK_STEP': MC = C.LGRN; return 'A[' + ev.index + '] = ' + p2(ev.value) + '  FROM OUT[' + ev.slot + ']';
    case 'MERGE_COMPLETE': MC = C.LGRN; return 'MERGE DONE [' + l + '..' + r + '] SORTED';
    case 'SORT_COMPLETE': MC = ((tick >> 3) & 1) ? C.YEL : C.WHITE; return 'SORT COMPLETE!';
    default: return '';
  }
}

const BTN = [
  { id: 'start', label: 'START', x: 2 }, { id: 'pause', label: 'PAUSE', x: 24 }, { id: 'step', label: 'STEP', x: 46 },
  { id: 'reset', label: 'RESET', x: 64 }, { id: 'shuffle', label: 'SHUFFLE', x: 86 }, { id: 'speed', label: '1X', x: 117 }
];
BTN.forEach(b => { b.w = TW(b.label) + 2; });
const UI = { hover: null, info: 0, press: null, pressT: 0 };
function drawButtons() {
  for (const b of BTN) {
    let face = C.PANEL, fg = C.WHITE;
    if (b.id === 'start' && P.playing) face = C.DGRN;
    if (b.id === 'pause' && P.state === 'running' && !P.playing) { face = C.DYEL; }
    if (b.id === 'pause' && P.state !== 'running') fg = C.DIM;
    if (UI.hover === b.id) face = C.PHI;
    if (UI.press === b.id && UI.pressT > 0) face = C.DBLU;
    const label = b.id === 'speed' ? SPEEDS[P.speedIdx] + 'X' : b.label;
    R(b.x, 88, b.w, 7, face); HL(b.x, 88, b.w, C.LINE); HL(b.x, 94, b.w, C.INK);
    T(label, b.x + 1, 89, fg);
  }
}

/* ---------- info overlay ---------- */
function infoPages() {
  const S = P.run ? P.run.S : null;
  return [
    { t: 'TIME + SPACE', lines: [
      ['TIME', C.YEL], ['BEST:    O(N LOG N)', C.WHITE], ['AVERAGE: O(N LOG N)', C.WHITE], ['WORST:   O(N LOG N)', C.WHITE],
      ['SPACE', C.YEL], ['O(N) AUXILIARY BUFFER', C.WHITE],
      ['DIVIDE: O(LOG N) LEVELS', C.CYN], ['MERGE: O(N) PER LEVEL', C.ORG], ['TOTAL: O(N LOG N)', C.LGRN]] },
    { t: 'STABILITY', lines: [
      ['IN-PLACE: NO (STANDARD IMPL.)', C.WHITE], ['STABLE: YES', C.LGRN],
      ['IF LEFT <= RIGHT ~ TAKE LEFT', C.CYN], ['EQUAL VALUES KEEP ORDER', C.WHITE],
      ['MERGE SORT DOES NOT:', C.YEL], ['* PICK A GLOBAL MINIMUM', C.GREY], ['* ONLY COMPARE NEIGHBOURS', C.GREY],
      ['* SHIFT LIKE INSERTION', C.GREY], ['* SEARCH WITH A PIVOT', C.GREY]] },
    { t: 'NOT THE SAME AS...', lines: [
      ['BUBBLE', C.YEL], [' LOCAL ADJACENT SWAPS', C.WHITE],
      ['SELECTION', C.YEL], [' SCAN ~ MINIMUM ~ SWAP', C.WHITE],
      ['INSERTION', C.YEL], [' KEY ~ SHIFT ~ INSERT', C.WHITE],
      ['MERGE', C.LGRN], [' DIVIDE ~ MERGE SORTED HALVES', C.WHITE]] },
    { t: 'HUD + KEYS', lines: [
      ['L R = POINTER INDEXES', C.WHITE], ['OUT = FILLED  CMP = COMPARES', C.GREY],
      ['SPACE START/PAUSE  S STEP', C.CYN], ['R RESET   H SHUFFLE', C.CYN], ['M SOUND  +/- VOL  [ ] SPEED', C.CYN],
      ['I INFO PAGES   ESC CLOSE', C.CYN],
      ['SEED ' + (P.seed >>> 0).toString(16).toUpperCase(), C.YEL],
      ['EVENTS ' + (S ? S.seq : 0) + '  ' + (P.verify ? 'HASH ' + (P.verify.hash & 0xFFFF).toString(16).toUpperCase() : 'HASH --'), C.GREY]] }
  ];
}
function drawInfo() {
  const pages = infoPages(), pg = pages[UI.info - 1];
  panel(2, 11, 124, 75, C.BG, C.YEL);
  T(pg.t, 6, 14, C.YEL); T(UI.info + '/' + pages.length, 116 - 2, 14, C.DIM);
  HL(5, 21, 118, C.PANEL);
  for (let i = 0; i < pg.lines.length; i++) T(pg.lines[i][0], 6, 24 + i * (pg.lines.length > 8 ? 6 : 7), pg.lines[i][1]);
}

function render() {
  R(0, 0, W, H, C.BG);
  drawTitle();
  drawTree();
  drawZone();
  drawTokens();
  drawHud();
  // message bar
  panel(1, 80, 126, 7, C.BG, C.LINE);
  const msg = messageText(P.ev, progress());
  T(msg, 3, 81, MC);
  drawButtons();
  if (UI.info) drawInfo();
}

/* =====================================================================
   DISPLAY: integer-scaled blit, centered, no smoothing
   ===================================================================== */
let SC = 1, OX = 0, OY = 0;
function layout() {
  SC = Math.max(1, Math.floor(Math.min(screen.width / W, screen.height / H)));
  OX = Math.floor((screen.width - W * SC) / 2); OY = Math.floor((screen.height - H * SC) / 2);
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  screen.width = Math.max(1, Math.floor(window.innerWidth * dpr));
  screen.height = Math.max(1, Math.floor(window.innerHeight * dpr));
  layout();
}
function blit() {
  sctx.imageSmoothingEnabled = false;
  sctx.fillStyle = PAL[C.INK];
  sctx.fillRect(0, 0, screen.width, screen.height);
  sctx.drawImage(lc, 0, 0, W, H, OX, OY, W * SC, H * SC);
}

/* =====================================================================
   INPUT
   ===================================================================== */
function toLogical(e) {
  const r = screen.getBoundingClientRect();
  const dx = (e.clientX - r.left) * screen.width / (r.width || 1), dy = (e.clientY - r.top) * screen.height / (r.height || 1);
  return [Math.floor((dx - OX) / SC), Math.floor((dy - OY) / SC)];
}
function hitTest(x, y) {
  if (y >= 88 && y <= 94) for (const b of BTN) if (x >= b.x && x < b.x + b.w) return b.id;
  if (x >= 110 && x <= 117 && y >= 1 && y <= 7) return 'snd';
  if (x >= 119 && x <= 125 && y >= 1 && y <= 7) return 'info';
  if (UI.info && y >= 9 && y <= 87) return 'overlay';
  return null;
}
function act(id, shift) {
  auInit();
  switch (id) {
    case 'start': doStart(); break;
    case 'pause': doPause(); break;
    case 'step': doStep(); break;
    case 'reset': resetAll(); break;
    case 'shuffle': doShuffle(); break;
    case 'speed': doSpeed(); break;
    case 'snd':
      if (shift) AU.vol = AU.vol > 0.85 ? 0.3 : AU.vol + 0.3; else AU.on = !AU.on;
      auApply(); break;
    case 'info': case 'overlay': UI.info = UI.info >= 4 ? 0 : UI.info + 1; break;
    default: break;
  }
  if (id !== 'snd' && id !== 'info' && id !== 'overlay') { UI.press = id; UI.pressT = 8; }
}
screen.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = toLogical(e), id = hitTest(x, y);
  if (id) act(id, e.shiftKey);
});
screen.addEventListener('pointermove', e => { const [x, y] = toLogical(e); const id = hitTest(x, y); UI.hover = id === 'overlay' ? null : id; });
screen.addEventListener('pointerleave', () => { UI.hover = null; });
screen.addEventListener('contextmenu', e => { e.preventDefault(); act('snd', true); });
screen.addEventListener('wheel', e => {
  e.preventDefault(); auInit();
  AU.vol = clamp(AU.vol + (e.deltaY < 0 ? 0.1 : -0.1), 0.1, 1); auApply();
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  auInit();
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (P.playing) doPause(); else doStart(); }
  else if (k === 's' || k === 'S' || k === 'ArrowRight') { e.preventDefault(); doStep(); }
  else if (k === 'r' || k === 'R') resetAll();
  else if (k === 'h' || k === 'H') doShuffle();
  else if (k === 'm' || k === 'M') { AU.on = !AU.on; auApply(); }
  else if (k === '+' || k === '=') { AU.vol = clamp(AU.vol + 0.1, 0.1, 1); auApply(); }
  else if (k === '-' || k === '_') { AU.vol = clamp(AU.vol - 0.1, 0.1, 1); auApply(); }
  else if (k === ']') P.speedIdx = Math.min(SPEEDS.length - 1, P.speedIdx + 1);
  else if (k === '[') P.speedIdx = Math.max(0, P.speedIdx - 1);
  else if (k === 'i' || k === 'I' || k === '?') UI.info = UI.info >= 4 ? 0 : UI.info + 1;
  else if (k === 'Escape') UI.info = 0;
});
window.addEventListener('resize', resize);

/* =====================================================================
   MAIN LOOP: fixed 60 Hz simulation, rAF rendering
   ===================================================================== */
let last = 0, acc = 0;
function loop(ts) {
  window.requestAnimationFrame(loop);
  if (!last) last = ts;
  let dt = ts - last; last = ts;
  if (dt > 100) dt = 100;
  acc += dt;
  while (acc >= STEP_MS) { update(STEP_MS); if (UI.pressT > 0) UI.pressT--; acc -= STEP_MS; }
  render();
  blit();
}
resize();
resetView(P.data);
window.requestAnimationFrame(loop);

// tiny hook for automated tests (harmless in the browser)
window.__mergeSortDebug = { P, V, makeRun, verifyRun, genArray, act, update, render, resetAll };
})();
</script>
