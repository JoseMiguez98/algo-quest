<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFS Pixel Visualizer</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;
         image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
"use strict";

/* =====================================================================
 * 1. CONSTANTS / PALETTE
 * Fixed 24-colour palette. Every pixel on screen comes from this table.
 * ===================================================================== */
const W = 128, H = 96, STEP = 1000 / 60;           // logical resolution, 60 Hz sim step
const PAL = [
  '#0b0f1e','#151b34','#232c55','#3b4a8c','#5a4a8a','#8a72c8','#f8e44a','#f08a24',
  '#1fb8d4','#0e6f8a','#3fe06a','#ffffff','#e0303c','#7a1a2c','#2a3050','#4a5580',
  '#9aa4c8','#d8def5','#ffb84a','#7de8f5','#1c7a3a','#c8b8ff','#000000','#ff7ac6'
];
const C_BG=0, C_PANEL=1, C_UNV=2, C_UNVB=3, C_QUE=4, C_QUEB=5, C_YEL=6, C_ORG=7,
      C_CYAN=8, C_CYAND=9, C_GRN=10, C_WHT=11, C_RED=12, C_REDD=13, C_EDGE=14,
      C_EDGE2=15, C_TXTD=16, C_TXT=17, C_ORGL=18, C_CYANL=19, C_GRND=20, C_PURL=21,
      C_BLK=22, C_PINK=23;

const disp = document.getElementById('c');
const dctx = disp.getContext('2d', { alpha: false });
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d', { alpha: false });
octx.imageSmoothingEnabled = false;

let curCol = -1;
function setCol(c) { if (c !== curCol) { octx.fillStyle = PAL[c]; curCol = c; } }
function px(x, y, c) { setCol(c); octx.fillRect(x | 0, y | 0, 1, 1); }
function rect(x, y, w, h, c) { setCol(c); octx.fillRect(x | 0, y | 0, w | 0, h | 0); }
function frame(x, y, w, h, c) {
  rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c);
  rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c);
}

/* 3x5 pixel font. Each glyph = 15 bits, row-major, MSB first. */
const FONT = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111',
  '4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001001001',
  '8':'111101111101111','9':'111101111001111',
  'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110',
  'E':'111100110100111','F':'111100110100100','G':'011100101101011','H':'101101111101101',
  'I':'111010010010111','J':'001001001101010','K':'101101110101101','L':'100100100100111',
  'M':'101111111101101','N':'111101101101101','O':'010101101101010','P':'110101110100100',
  'Q':'010101101110011','R':'110101110101101','S':'011100010001110','T':'111010010010010',
  'U':'101101101101111','V':'101101101101010','W':'101101111111101','X':'101101010101101',
  'Y':'101101010010010','Z':'111001010100111',
  ':':'000010000010000','-':'000000111000000','>':'100010001010100','/':'001001010100100',
  '.':'000000000000010','+':'000010111010000','?':'111001010000010','!':'010010010000010',
  '=':'000111000111000'
};
const GLYPH = new Uint16Array(128);
for (const k in FONT) GLYPH[k.charCodeAt(0)] = parseInt(FONT[k], 2);

function glyph(code, x, y, c) {
  const g = GLYPH[code];
  if (!g) return;
  setCol(c);
  for (let r = 0; r < 5; r++)
    for (let q = 0; q < 3; q++)
      if ((g >> (14 - (r * 3 + q))) & 1) octx.fillRect(x + q, y + r, 1, 1);
}
/* Draws a literal string; returns x after the last glyph (no allocation). */
function text(s, x, y, c) {
  for (let i = 0; i < s.length; i++) {
    let code = s.charCodeAt(i);
    if (code >= 97 && code <= 122) code -= 32;
    glyph(code, x, y, c);
    x += 4;
  }
  return x;
}
/* Draws a 2-digit zero-padded number without building a string. */
function num2(n, x, y, c) {
  if (n > 99) n = 99; if (n < 0) n = 0;
  glyph(48 + ((n / 10) | 0), x, y, c);
  glyph(48 + (n % 10), x + 4, y, c);
  return x + 8;
}

/* =====================================================================
 * 2. GRAPH DEFINITION  (fixed layout, deterministic, integer pixels)
 * 16 nodes; 21 undirected edges incl. cycles and one diagonal.
 * ===================================================================== */
const N = 16, START = 0;
const NX = new Uint8Array([10,28,46,82,  10,46,64,82,  10,28,46,82,  28,46,64,82]);
const NY = new Uint8Array([18,18,18,18,  33,33,33,33,  48,48,48,48,  63,63,63,63]);
const EDGE_LIST = [
  [0,1],[1,2],[0,4],[2,5],[5,6],[6,7],[3,7],[4,8],[8,9],[9,10],[5,10],
  [9,12],[10,13],[12,13],[13,14],[14,15],[11,15],[7,11],[1,9],[6,14],[2,6]
];
const NE = EDGE_LIST.length;
const EA = new Uint8Array(NE), EB = new Uint8Array(NE);
const edgeId = new Int8Array(N * N).fill(-1);          // (a,b) -> edge index or -1
const adjStart = new Uint8Array(N + 1);                // flat adjacency (CSR)
const adjList = new Uint8Array(NE * 2);
const edgeState = new Uint8Array(NE);                  // 1 = traversed tree edge (replay state)

/* DETERMINISTIC NEIGHBOUR ORDERING:
 * priority UP(0) < RIGHT(1) < DOWN(2) < LEFT(3), direction chosen by the dominant
 * axis of the edge (ties -> horizontal); equal ranks are broken by node id.
 * The DFS below INSPECTS neighbours in reverse priority so that the highest priority
 * neighbour is pushed LAST and therefore popped FIRST (stack is LIFO). */
function dirRank(a, b) {
  const dx = NX[b] - NX[a], dy = NY[b] - NY[a];
  if (Math.abs(dy) > Math.abs(dx)) return dy < 0 ? 0 : 2;
  return dx > 0 ? 1 : 3;
}
(function buildGraph() {
  const tmp = [];
  for (let i = 0; i < N; i++) tmp.push([]);
  for (let e = 0; e < NE; e++) {
    const a = EDGE_LIST[e][0], b = EDGE_LIST[e][1];
    EA[e] = a; EB[e] = b;
    edgeId[a * N + b] = e; edgeId[b * N + a] = e;
    tmp[a].push(b); tmp[b].push(a);
  }
  let k = 0;
  for (let i = 0; i < N; i++) {
    tmp[i].sort((p, q) => (dirRank(i, p) - dirRank(i, q)) || (p - q));
    adjStart[i] = k;
    for (let j = 0; j < tmp[i].length; j++) adjList[k++] = tmp[i][j];
  }
  adjStart[N] = k;
})();

/* =====================================================================
 * 3. DFS ALGORITHM (explicit stack)  +  4. EVENT GENERATION
 * The whole DFS runs to completion BEFORE playback and records an event stream.
 * Each event stores enough to reconstruct state: type, node ids, stack depth after
 * the event, and a full snapshot of the stack contents.
 * ===================================================================== */
const E_START=0, E_PUSH_START=1, E_POP=2, E_ALREADY=3, E_TRAVERSE=4, E_VISIT=5,
      E_INSPECT=6, E_PUSHN=7, E_SKIP=8, E_FINISH=9, E_BACKTRACK=10, E_COMPLETE=11;
/* Playback duration of each event in 60 Hz ticks (~8-12 visual states/sec). */
const DUR = new Uint8Array([30, 12, 8, 10, 8, 12, 5, 7, 7, 8, 8, 70]);

const MAXEV = 1024, MAXSTK = 64;
const evT = new Uint8Array(MAXEV), evA = new Int8Array(MAXEV), evB = new Int8Array(MAXEV),
      evD = new Int8Array(MAXEV), evS = new Uint8Array(MAXEV);
const evStk = new Int8Array(MAXEV * MAXSTK);
let evCount = 0;

let fatal = null;
function assert(c, m) { if (!c) { fatal = m; throw new Error('DFS ASSERT: ' + m); } }

/* Algorithm-owned state (authoritative). */
const aStack = new Int8Array(MAXSTK);   // node ids on the DFS stack
const aPar = new Int8Array(MAXSTK);     // which node pushed each entry (-1 = start)
let asp = 0;
const aVisited = new Uint8Array(N);
const aOrder = new Uint8Array(N);
const aTree = new Int8Array(N);         // DFS-tree parent (node that pushed the entry that got visited)
let aOrderLen = 0, aPushes = 0, aPops = 0, aMax = 0;

function aPush(n, par) {
  assert(n >= 0 && n < N, 'INVALID NODE ID');
  assert(asp < MAXSTK, 'STACK OVERFLOW');
  aStack[asp] = n; aPar[asp] = par; asp++; aPushes++;
  if (asp > aMax) aMax = asp;
}
function emit(t, a, b, d) {
  assert(evCount < MAXEV, 'EVENT OVERFLOW');
  evT[evCount] = t; evA[evCount] = a; evB[evCount] = b; evD[evCount] = d; evS[evCount] = asp;
  const base = evCount * MAXSTK;
  for (let i = 0; i < asp; i++) evStk[base + i] = aStack[i];   // stack snapshot
  evCount++;
}

function runDFS() {
  evCount = 0; asp = 0; aOrderLen = 0; aPushes = 0; aPops = 0; aMax = 0;
  aVisited.fill(0); aTree.fill(-1);
  let cursor = -1;   // node DFS is currently "standing at" (last visited / returned-to)

  emit(E_START, START, -1, 0);
  aPush(START, -1);
  emit(E_PUSH_START, START, -1, 0);

  while (asp > 0) {
    // RETURN BEHAVIOUR: the entry on top of the stack was pushed by node `topPar`.
    // If DFS is standing deeper than that node, the branch below is exhausted, so DFS
    // returns up the DFS tree (one BACKTRACK per tree edge) until it reaches the pusher.
    // Nothing is ever un-visited: visited[] only ever gains members.
    const topPar = aPar[asp - 1];
    let guard = 0;
    while (cursor !== topPar) {
      const to = aTree[cursor];
      assert(to >= 0 && edgeId[cursor * N + to] >= 0, 'BAD RETURN EDGE');
      emit(E_BACKTRACK, cursor, to, 0);
      cursor = to;
      assert(++guard <= N, 'RETURN LOOP');
    }

    // POP
    asp--; aPops++;
    const node = aStack[asp], par = aPar[asp];
    emit(E_POP, node, par, 0);

    // VISITED-STATE HANDLING: entries can be stale duplicates; skip if already visited.
    if (aVisited[node]) { emit(E_ALREADY, node, par, 0); continue; }

    if (par >= 0) {
      assert(edgeId[par * N + node] >= 0, 'BAD TRAVERSE EDGE');
      emit(E_TRAVERSE, par, node, 0);
    }
    aVisited[node] = 1;
    aOrder[aOrderLen] = node;
    aTree[node] = par;
    cursor = node;
    emit(E_VISIT, node, par, aOrderLen);
    aOrderLen++;

    // Inspect neighbours in reverse priority; push the unvisited ones.
    let pushed = 0;
    for (let k = adjStart[node + 1] - 1; k >= adjStart[node]; k--) {
      const nb = adjList[k];
      emit(E_INSPECT, node, nb, 0);
      if (!aVisited[nb]) { aPush(nb, node); pushed++; emit(E_PUSHN, node, nb, 0); }
      else emit(E_SKIP, node, nb, 0);
    }
    // pushed === 0 means a dead end: this branch cannot go deeper.
    emit(E_FINISH, node, -1, pushed);
  }

  // Stack empty: unwind back to the start (the "recursion" returning).
  while (cursor !== START) {
    const to = aTree[cursor];
    assert(to >= 0, 'BAD FINAL RETURN');
    emit(E_BACKTRACK, cursor, to, 0);
    cursor = to;
  }
  emit(E_COMPLETE, -1, -1, 0);
}

/* =====================================================================
 * 5. ANIMATION STATE  (replay of the event stream; never decides anything)
 * ===================================================================== */
const P_INTRO = 0, P_RUN = 1, P_RESULT = 2, P_RESET = 3;
let phase = P_INTRO, pt = 0, tick = 0;
let evIdx = 0, evTick = 0;
let curType = -1, curA = -1, curB = -1, curD = 0;
let cur = -1, active = -1, nb = -1, hiEdge = -1, hiMode = 0, retFrom = -1, retTo = -1;
const EM_INSPECT = 1, EM_PUSH = 2, EM_SKIP = 3, EM_TRAV = 4, EM_BACK = 5;
const HI_COL = [0, C_YEL, C_PURL, C_RED, C_ORG, C_WHT];

/* =====================================================================
 * 6. STACK STATE (replay copy — verified against the algorithm's snapshots)
 * ===================================================================== */
const rStk = new Int8Array(MAXSTK);
let rsp = 0;
const rVis = new Uint8Array(N), rFin = new Uint8Array(N), rIn = new Uint8Array(N), rIdx = new Int8Array(N);
const rOrder = new Uint8Array(N);
let orderLen = 0, visCount = 0, pushes = 0, pops = 0, maxD = 0;
let pushT = 0, popT = 0, popVal = 0;

function rPush(n) {
  assert(n >= 0 && n < N && rsp < MAXSTK, 'BAD PUSH');
  rStk[rsp++] = n; rIn[n]++; pushes++;
  if (rsp > maxD) maxD = rsp;
  pushT = 8;
}
function setEdge(a, b, mode) {
  const e = edgeId[a * N + b];
  assert(e >= 0, 'EDGE NOT IN GRAPH');
  hiEdge = e; hiMode = mode;
}
function resetReplay() {
  rsp = 0; rVis.fill(0); rFin.fill(0); rIn.fill(0); rIdx.fill(-1); edgeState.fill(0);
  orderLen = 0; visCount = 0; pushes = 0; pops = 0; maxD = 0;
  cur = -1; active = -1; nb = -1; hiEdge = -1; hiMode = 0; curType = -1;
  pushT = 0; popT = 0; evIdx = 0; evTick = 0;
  pLife.fill(0); rs32 = 0x2545F491; sqh = sqt = 0;
}
function resetAll() {            // restores algorithm AND replay state; DFS is re-executed
  resetReplay();
  runDFS();
}

/* Applies event i to the replay state, then cross-checks against the algorithm's data. */
function applyEvent(i) {
  const t = evT[i], a = evA[i], b = evB[i];
  curType = t; curA = a; curB = b; curD = evD[i];
  hiEdge = -1; hiMode = 0; nb = -1;
  active = (t === E_POP || t === E_ALREADY) ? a : (t === E_TRAVERSE ? b : -1);
  switch (t) {
    case E_START: cur = -1; queueSound(SX_START); break;
    case E_PUSH_START: rPush(a); flowToStack(a); queueSound(SX_PUSH); break;
    case E_POP:
      assert(rsp > 0 && rStk[rsp - 1] === a, 'POP MISMATCH');
      rsp--; rIn[a]--; pops++; popVal = a; popT = 8;
      flowFromStack(a); queueSound(SX_POP); break;
    case E_ALREADY:
      assert(rVis[a] === 1, 'STALE NOT VISITED');
      burst(NX[a], NY[a], 6, C_RED, C_REDD); queueSound(SX_SKIP); break;
    case E_TRAVERSE:
      assert(cur === a, 'BAD TRAVERSE SRC');
      setEdge(a, b, EM_TRAV); queueSound(SX_TRAV); break;
    case E_VISIT:
      assert(rVis[a] === 0, 'DOUBLE VISIT');
      assert(orderLen === curD, 'ORDER INDEX MISMATCH');
      rVis[a] = 1; rOrder[orderLen] = a; rIdx[a] = orderLen; orderLen++; visCount++;
      cur = a;
      if (b >= 0) { const e = edgeId[a * N + b]; assert(e >= 0, 'BAD TREE EDGE'); edgeState[e] = 1; }
      burst(NX[a], NY[a], 12, C_GRN, C_WHT); queueSound(SX_VISIT); break;
    case E_INSPECT:
      assert(cur === a, 'CURRENT MISMATCH');
      nb = b; setEdge(a, b, EM_INSPECT); queueSound(SX_TICK); break;
    case E_PUSHN:
      assert(rVis[b] === 0, 'PUSHED VISITED');
      nb = b; setEdge(a, b, EM_PUSH); rPush(b); flowToStack(b); queueSound(SX_PUSHN); break;
    case E_SKIP:
      assert(rVis[b] === 1, 'SKIPPED UNVISITED');
      nb = b; setEdge(a, b, EM_SKIP);
      burst(NX[b], NY[b], 5, C_RED, C_PURL); queueSound(SX_SKIP); break;
    case E_FINISH:
      burst(NX[a], NY[a], 4, C_CYANL, C_CYAN); queueSound(SX_FINISH); break;
    case E_BACKTRACK:
      assert(cur === a, 'RETURN MISMATCH');
      rFin[a] = 1;                       // its branch is complete — it stays VISITED
      retFrom = a; retTo = b; cur = b;
      setEdge(a, b, EM_BACK);
      burst(NX[a], NY[a], 4, C_CYAND, C_CYAN); queueSound(SX_BACK); break;
    case E_COMPLETE:
      cur = -1;
      for (let k = 0; k < N; k++) { rFin[k] = 1; burst(NX[k], NY[k], 3, (k & 1) ? C_GRN : C_YEL, C_WHT); }
      queueSound(SX_DONE); break;
  }
  // Replay must agree with the algorithm's recorded state at every step.
  assert(rsp === evS[i], 'STACK DEPTH MISMATCH');
  const base = i * MAXSTK;
  for (let k = 0; k < rsp; k++) {
    assert(rStk[k] >= 0 && rStk[k] < N, 'INVALID STACK ID');
    assert(rStk[k] === evStk[base + k], 'STACK CONTENT MISMATCH');
  }
}
function finalVerify() {
  assert(orderLen === aOrderLen && aOrderLen === N, 'NOT ALL VISITED');
  for (let k = 0; k < orderLen; k++) assert(rOrder[k] === aOrder[k], 'ORDER MISMATCH');
  assert(pushes === aPushes && pops === aPops && maxD === aMax && rsp === 0, 'COUNTER MISMATCH');
}

/* =====================================================================
 * 7. AUDIO ENGINE  (Web Audio, oscillators + noise only)
 * ===================================================================== */
let AC = null, master = null, muted = false, noiseBuf = null;
const SX_START=1, SX_PUSH=2, SX_POP=3, SX_VISIT=4, SX_TICK=5, SX_PUSHN=6, SX_SKIP=7,
      SX_FINISH=8, SX_DONE=9, SX_RESET=10, SX_TRAV=11, SX_BACK=12;
const ARP = [523.25, 659.25, 783.99, 1046.5];
const MEL = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
const MELT = [0, 0.09, 0.18, 0.27, 0.38, 0.47, 0.58];
const MELD = [0.09, 0.09, 0.09, 0.1, 0.09, 0.09, 0.32];

function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.3; master.connect(AC.destination);
    const len = (AC.sampleRate * 0.25) | 0;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f0, f1, type, t, dur, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);                 // quick attack, exponential decay
  g.gain.linearRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(t, dur, vol) {
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = noiseBuf;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.02);
}
function playSfx(id) {
  if (!AC || muted || AC.state !== 'running') return;
  const t = AC.currentTime + 0.01;
  switch (id) {
    case SX_START:
      for (let i = 0; i < 4; i++) tone(ARP[i], ARP[i], 'square', t + i * 0.07, 0.09, 0.14);
      tone(130.8, 130.8, 'triangle', t, 0.3, 0.2); break;
    case SX_PUSH:   tone(1320, 1320, 'square', t, 0.04, 0.11); break;
    case SX_POP:    tone(880, 520, 'square', t, 0.06, 0.11); break;
    case SX_VISIT:  tone(988, 988, 'square', t, 0.05, 0.13); tone(1319, 1319, 'square', t + 0.05, 0.08, 0.13); break;
    case SX_TICK:   tone(2400, 2400, 'square', t, 0.015, 0.035); break;
    case SX_PUSHN:  tone(1568, 1568, 'square', t, 0.035, 0.11); tone(2093, 2093, 'square', t + 0.035, 0.05, 0.11); break;
    case SX_SKIP:   tone(196, 165, 'square', t, 0.07, 0.08); noise(t, 0.03, 0.04); break;
    case SX_FINISH: tone(784, 784, 'square', t, 0.06, 0.11); tone(523, 523, 'square', t + 0.06, 0.09, 0.11); break;
    case SX_DONE:
      for (let i = 0; i < 7; i++) tone(MEL[i], MEL[i], 'square', t + MELT[i], MELD[i], 0.13);
      tone(261.6, 261.6, 'triangle', t, 0.26, 0.2);
      tone(392, 392, 'triangle', t + 0.27, 0.26, 0.2);
      tone(523.25, 523.25, 'triangle', t + 0.58, 0.32, 0.2); break;
    case SX_RESET:  tone(220, 880, 'square', t, 0.18, 0.11); noise(t, 0.08, 0.07); break;
    case SX_TRAV:   tone(330, 494, 'triangle', t, 0.06, 0.2); break;
    case SX_BACK:   tone(392, 262, 'triangle', t, 0.07, 0.22); break;
  }
}

/* =====================================================================
 * 8. PARTICLE POOL  (preallocated, allocation-free)
 * ===================================================================== */
const PMAX = 200;
const pX = new Float32Array(PMAX), pY = new Float32Array(PMAX),
      pVX = new Float32Array(PMAX), pVY = new Float32Array(PMAX);
const pLife = new Uint8Array(PMAX), pCol = new Uint8Array(PMAX);
let pHead = 0;
let rs32 = 0x2545F491;                                   // visual-only PRNG, reseeded each loop
function rnd() { rs32 ^= rs32 << 13; rs32 ^= rs32 >>> 17; rs32 ^= rs32 << 5; return rs32 >>> 0; }
const DIRX = new Float32Array(16), DIRY = new Float32Array(16);
for (let i = 0; i < 16; i++) { DIRX[i] = Math.cos(i * Math.PI / 8); DIRY[i] = Math.sin(i * Math.PI / 8); }

function spawn(x, y, vx, vy, life, c) {
  for (let n = 0; n < PMAX; n++) {
    const i = (pHead + n) % PMAX;
    if (pLife[i] === 0) {
      pX[i] = x; pY[i] = y; pVX[i] = vx; pVY[i] = vy; pLife[i] = life; pCol[i] = c;
      pHead = (i + 1) % PMAX; return;
    }
  }
}
function burst(x, y, n, c1, c2) {
  for (let k = 0; k < n; k++) {
    const r = rnd(), d = r & 15, sp = 0.5 + ((r >>> 4) & 3) * 0.25;
    spawn(x, y, DIRX[d] * sp, DIRY[d] * sp, 10 + ((r >>> 8) & 7), ((r >>> 12) & 1) ? c1 : c2);
  }
}
function spawnFlow(x0, y0, x1, y1, life, c) {
  const r = rnd(), jx = (r & 3) - 1, jy = ((r >>> 2) & 3) - 1;
  spawn(x0 + jx, y0 + jy, (x1 - x0 - jx) / life, (y1 - y0 - jy) / life, life, c);
}
function slotY(i) { return 65 - (i > 8 ? 8 : i) * 6; }
function flowToStack(n) {           // PUSH: pixels travel from the node into the stack panel
  const ty = slotY(rsp - 1) + 2;
  for (let k = 0; k < 6; k++) spawnFlow(NX[n], NY[n], 109, ty, 8 + k, C_PURL);
}
function flowFromStack(n) {         // POP: pixels travel from the stack panel to the node
  const sy = slotY(rsp) + 2;
  for (let k = 0; k < 6; k++) spawnFlow(109, sy, NX[n], NY[n], 8 + k, C_ORGL);
}
function updateParticles() {
  for (let i = 0; i < PMAX; i++) {
    if (pLife[i] > 0) { pX[i] += pVX[i]; pY[i] += pVY[i]; pLife[i]--; }
  }
}
function drawParticles() {
  for (let i = 0; i < PMAX; i++) {
    const l = pLife[i];
    if (l === 0 || (l < 4 && (l & 1))) continue;
    px(Math.round(pX[i]), Math.round(pY[i]), pCol[i]);
  }
}

/* =====================================================================
 * 12. AUDIO EVENT DISPATCH
 * Sounds are queued when an algorithm event is APPLIED by the animation layer
 * (never per frame) and drained once per simulation tick.
 * ===================================================================== */
const sq = new Uint8Array(32);
let sqh = 0, sqt = 0;
function queueSound(id) { sq[sqh] = id; sqh = (sqh + 1) & 31; }
function flushAudio() { while (sqt !== sqh) { playSfx(sq[sqt]); sqt = (sqt + 1) & 31; } }

/* =====================================================================
 * 9. UPDATE LOOP  (fixed 60 Hz; consumes the generated event stream)
 * INTRO -> RUN (events in order) -> RESULT -> RESET (re-runs DFS) -> INTRO
 * ===================================================================== */
function update() {
  tick++;
  if (pushT > 0) pushT--;
  if (popT > 0) popT--;
  updateParticles();
  switch (phase) {
    case P_INTRO:
      if (++pt >= 150) { phase = P_RUN; evIdx = 0; evTick = 0; applyEvent(0); }
      break;
    case P_RUN:
      // Next state comes strictly from the event stream.
      if (++evTick >= DUR[evT[evIdx]]) {
        evIdx++;
        if (evIdx >= evCount) { finalVerify(); phase = P_RESULT; pt = 0; }
        else { applyEvent(evIdx); evTick = 0; }
      }
      break;
    case P_RESULT:
      if (++pt >= 330) { phase = P_RESET; pt = 0; queueSound(SX_RESET); }
      break;
    case P_RESET:
      pt++;
      if (pt === 20) resetAll();            // full algorithm + replay reset, DFS re-executed
      if (pt >= 40) { phase = P_INTRO; pt = 0; }
      break;
  }
}

/* =====================================================================
 * 10. PIXEL ART RENDERING
 * ===================================================================== */
function line(x0, y0, x1, y1, c, alt) {       // Bresenham -> crisp stair-steps
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, k = 0;
  const ph = tick >> 1;
  for (;;) {
    setCol((alt >= 0 && ((k + ph) & 3) < 2) ? alt : c);
    octx.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
    k++;
  }
}

function drawNode(n) {
  const x = NX[n] - 4, y = NY[n] - 4;
  let fill = C_UNV, border = C_UNVB, tc = C_TXTD;
  if (rVis[n]) {
    fill = C_CYAN; border = C_CYANL; tc = C_BLK;
    if (rFin[n]) { fill = C_CYAND; border = C_CYAN; tc = C_CYANL; }   // branch complete: dimmed, still visited
  } else if (rIn[n] > 0) { fill = C_QUE; border = C_QUEB; tc = C_PURL; } // discovered / queued
  if (n === active) {
    if (curType === E_ALREADY) { fill = C_RED; border = C_ORGL; tc = C_WHT; }
    else { fill = C_ORG; border = C_ORGL; tc = C_BLK; }
  }
  if (n === nb) {
    if (curType === E_INSPECT) { fill = C_YEL; border = C_WHT; tc = C_BLK; }
    else if (curType === E_PUSHN) { fill = C_QUEB; border = C_PURL; tc = C_BLK; }
    else if (curType === E_SKIP) { fill = C_RED; border = C_ORGL; tc = C_WHT; }
  }
  if (n === cur) {
    fill = (curType === E_FINISH || rFin[n]) ? C_CYANL : C_WHT; border = C_WHT; tc = C_BLK;
    if (curType === E_VISIT) { fill = C_GRN; border = C_WHT; }        // first-visit flash
  }
  rect(x, y, 9, 9, border);
  rect(x + 1, y + 1, 7, 7, fill);
  px(x, y, C_BG); px(x + 8, y, C_BG); px(x, y + 8, C_BG); px(x + 8, y + 8, C_BG);  // rounded corners
  num2(n, x + 1, y + 2, tc);
}

function drawGraph() {
  for (let y = 13; y < 70; y += 6) for (let x = 3; x < 90; x += 6) px(x, y, C_PANEL);   // dot grid
  for (let e = 0; e < NE; e++)
    line(NX[EA[e]], NY[EA[e]], NX[EB[e]], NY[EB[e]], edgeState[e] ? C_CYAND : C_EDGE, -1);
  if (hiEdge >= 0)
    line(NX[EA[hiEdge]], NY[EA[hiEdge]], NX[EB[hiEdge]], NY[EB[hiEdge]],
         HI_COL[hiMode], hiMode === EM_BACK ? C_CYANL : C_WHT);
  for (let n = 0; n < N; n++) drawNode(n);
  text("S", 1, 16, C_PINK);                                  // START marker beside node 0

  // Moving marker while DFS follows an edge deeper / returns along the tree.
  if (phase === P_RUN && (curType === E_TRAVERSE || curType === E_BACKTRACK)) {
    const a = curType === E_TRAVERSE ? curA : retFrom;
    const b = curType === E_TRAVERSE ? curB : retTo;
    const d = DUR[curType], f = (evTick + 1) / d;
    const mx = Math.round(NX[a] + (NX[b] - NX[a]) * f), my = Math.round(NY[a] + (NY[b] - NY[a]) * f);
    const mc = curType === E_TRAVERSE ? C_ORG : C_WHT;
    rect(mx - 1, my - 1, 3, 3, mc); px(mx, my, C_BLK);
  }
  // Blinking selector brackets around the current node.
  if (cur >= 0 && ((tick >> 3) & 1) === 0) {
    const x0 = NX[cur] - 6, y0 = NY[cur] - 6, x1 = NX[cur] + 6, y1 = NY[cur] + 6;
    rect(x0, y0, 3, 1, C_YEL); rect(x0, y0, 1, 3, C_YEL);
    rect(x1 - 2, y0, 3, 1, C_YEL); rect(x1, y0, 1, 3, C_YEL);
    rect(x0, y1, 3, 1, C_YEL); rect(x0, y1 - 2, 1, 3, C_YEL);
    rect(x1 - 2, y1, 3, 1, C_YEL); rect(x1, y1 - 2, 1, 3, C_YEL);
  }
}

function drawStack() {
  rect(91, 10, 37, 61, C_PANEL);
  frame(91, 10, 37, 61, C_UNVB);
  text("STACK", 93, 12, C_TXT);
  if (rsp === 0) text("EMPTY", 100, 40, C_TXTD);
  const shown = rsp > 9 ? 9 : rsp;
  for (let i = 0; i < shown; i++) {
    const top = (i === rsp - 1);
    let y = 65 - i * 6;
    if (top && pushT > 0) y -= pushT;                        // drop-in animation
    rect(96, y, 26, 5, top ? C_QUEB : C_QUE);
    num2(rStk[i], 105, y, top ? C_BLK : C_PURL);
  }
  if (rsp > 9) { text("+", 112, 12, C_YEL); num2(rsp - 9, 116, 12, C_YEL); }   // hidden entries
  if (rsp > 0) {                                             // TOP pointer
    const y = 65 - (shown - 1) * 6;
    text(">", 93, y, C_YEL);
  }
  if (popT > 0 && rsp <= 8) {                                // popped entry rising away
    const y = 65 - rsp * 6 - (8 - popT);
    if (y > 16) { rect(96, y, 26, 5, C_ORG); num2(popVal, 105, y, C_BLK); }
  }
}

/* =====================================================================
 * 11. HUD RENDERING (all values read from replay state)
 * ===================================================================== */
function drawTopBar() {
  rect(0, 0, W, 9, C_PANEL); rect(0, 9, W, 1, C_UNVB);
  text("DFS TRAVERSAL", 2, 2, C_TXT);
  if (phase === P_RUN) {
    if (curType === E_TRAVERSE || curType === E_VISIT) text("GO DEEPER", 56, 2, C_ORGL);
    else if (curType === E_BACKTRACK || curType === E_ALREADY) text("STAYS VISITED", 56, 2, C_GRN);
    else if (curType === E_FINISH && curD === 0) text("BRANCH DONE", 56, 2, C_CYANL);
  }
  if (!AC) { if ((tick >> 5) & 1) text("SND?", 108, 2, C_TXTD); }
  else if (muted) text("MUTE", 108, 2, C_RED);
  else text("SND", 108, 2, C_GRN);
}

function drawOp() {
  const y = 84;
  let x = 2;
  if (phase === P_INTRO || phase === P_RESET) {
    if (!AC && ((tick >> 4) & 1)) text("CLICK FOR SOUND", x, y, C_YEL);
    else if (AC) text("READY", x, y, C_TXT);
    return;
  }
  if (phase === P_RESULT) { text("TRAVERSAL DONE", x, y, C_GRN); return; }
  switch (curType) {
    case E_START:      text("DFS START", x, y, C_TXT); break;
    case E_PUSH_START: x = text("PUSH START ", x, y, C_PURL); num2(curA, x, y, C_WHT); break;
    case E_POP:        x = text("POP NODE ", x, y, C_ORGL); num2(curA, x, y, C_WHT); break;
    case E_TRAVERSE:   x = text("GO DEEPER ", x, y, C_ORGL); num2(curB, x, y, C_WHT); break;
    case E_ALREADY:    x = text("VISITED>DISCARD ", x, y, C_RED); num2(curA, x, y, C_WHT); break;
    case E_VISIT:      x = text("VISIT NODE ", x, y, C_GRN); num2(curA, x, y, C_WHT); break;
    case E_INSPECT:    x = text("CHECK NEIGHBOR ", x, y, C_YEL); num2(curB, x, y, C_WHT); break;
    case E_PUSHN:      x = text("UNVISITED>PUSH ", x, y, C_PURL); num2(curB, x, y, C_WHT); break;
    case E_SKIP:       x = text("VISITED>SKIP ", x, y, C_RED); num2(curB, x, y, C_WHT); break;
    case E_FINISH:
      if (curD === 0) x = text("DEAD END ", x, y, C_CYANL);
      else x = text("NEIGHBORS DONE ", x, y, C_CYANL);
      num2(curA, x, y, C_WHT); break;
    case E_BACKTRACK:  x = text("RETURN TO ", x, y, C_TXT); num2(curB, x, y, C_WHT); break;
    case E_COMPLETE:   text("DFS COMPLETE", x, y, C_GRN); break;
  }
}

function drawHUD() {
  rect(0, 71, W, 1, C_UNVB);
  // Line 1: current, visited count, stack size
  let x = text("CUR:", 2, 72, C_TXTD);
  if (cur >= 0) x = num2(cur, x, 72, C_WHT); else x = text("--", x, 72, C_TXT);
  x += 6;
  x = text("VIS:", x, 72, C_TXTD); x = num2(visCount, x, 72, C_CYAN);
  x = text("/", x, 72, C_TXTD); x = num2(N, x, 72, C_TXTD); x += 6;
  x = text("STK:", x, 72, C_TXTD); num2(rsp, x, 72, C_PURL);
  // Line 2: counters
  x = text("PSH:", 2, 78, C_TXTD); x = num2(pushes, x, 78, C_TXT); x += 5;
  x = text("POP:", x, 78, C_TXTD); x = num2(pops, x, 78, C_TXT); x += 5;
  x = text("MAX:", x, 78, C_TXTD); x = num2(maxD, x, 78, C_TXT); x += 5;
  x = text("IDX:", x, 78, C_TXTD);
  if (cur >= 0 && rVis[cur]) num2(rIdx[cur], x, 78, C_GRN); else text("--", x, 78, C_TXT);
  // Line 3: operation + neighbours of the current node (in inspection order)
  drawOp();
  if (phase === P_RUN && cur >= 0 && curType !== E_ALREADY) {
    text("NB:", 76, 84, C_TXTD);
    let nx = 88;
    for (let k = adjStart[cur + 1] - 1; k >= adjStart[cur]; k--) {
      const q = adjList[k];
      num2(q, nx, 84, q === nb ? C_YEL : (rVis[q] ? C_CYAN : C_TXT));
      nx += 8;
    }
  }
  // Line 4: traversal order produced by DFS
  text("ORD:", 2, 90, C_TXTD);
  const start = orderLen > 13 ? orderLen - 13 : 0;
  if (start > 0) text(".", 18, 90, C_TXTD);
  let ox = 20;
  for (let k = start; k < orderLen; k++) {
    num2(rOrder[k], ox, 90, (k === orderLen - 1 && phase === P_RUN) ? C_WHT : C_GRN);
    ox += 8;
  }
}

function drawIntro() {
  rect(14, 14, 64, 53, C_BG); frame(14, 14, 64, 53, C_UNVB);
  text("DEPTH FIRST", 24, 18, C_WHT);
  text("SEARCH", 34, 24, C_WHT);
  text("START AT ", 24, 32, C_TXTD); num2(START, 60, 32, C_PINK);
  rect(20, 40, 5, 5, C_UNV); text("UNSEEN", 28, 40, C_TXT);
  rect(20, 46, 5, 5, C_QUE); text("IN STACK", 28, 46, C_TXT);
  rect(20, 52, 5, 5, C_WHT); text("CURRENT", 28, 52, C_TXT);
  rect(20, 58, 5, 5, C_CYAN); text("VISITED", 28, 58, C_TXT);
}
function drawResult() {
  rect(8, 16, 76, 52, C_BG); frame(8, 16, 76, 52, C_GRN);
  text("DFS ORDER", 28, 20, C_WHT);
  for (let k = 0; k < orderLen; k++) {
    const row = (k / 6) | 0, col = k % 6, x = 14 + col * 11, y = 30 + row * 9;
    num2(rOrder[k], x, y, C_GRN);
    if (col < 5 && k < orderLen - 1) text(">", x + 8, y, C_TXTD);
  }
  text("NODES STAY VISITED", 10, 58, C_CYANL);
}

function render() {
  curCol = -1;
  rect(0, 0, W, H, C_BG);
  drawGraph();
  drawStack();
  drawTopBar();
  drawHUD();
  drawParticles();
  if (phase === P_INTRO) drawIntro();
  else if (phase === P_RESULT) drawResult();
  else if (phase === P_RESET) {                         // pixel wipe (covers, then reveals)
    const c = pt <= 20 ? pt : 40 - pt;
    const rows = ((c * H / 20) | 0) & ~3;
    rect(0, 0, W, rows, C_BG);
    if (rows > 0) rect(0, rows, W, 1, C_PINK);
  }
  if (fatal) {                                          // fail visibly
    rect(6, 34, 116, 24, C_REDD); frame(6, 34, 116, 24, C_RED);
    text("ASSERT FAILED", 38, 39, C_WHT);
    text(fatal, ((W - fatal.length * 4) / 2) | 0, 48, C_YEL);
  }
  // Blit to the display canvas with an integer scale.
  dctx.fillStyle = '#000';
  dctx.fillRect(0, 0, disp.width, disp.height);
  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(off, 0, 0, W, H, ox, oy, W * scale, H * scale);
}

/* =====================================================================
 * 13. RESIZE / DISPLAY SCALING
 * ===================================================================== */
let scale = 1, ox = 0, oy = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, Math.floor(window.innerWidth * dpr));
  const ch = Math.max(1, Math.floor(window.innerHeight * dpr));
  disp.width = cw; disp.height = ch;
  scale = Math.max(1, Math.min((cw / W) | 0, (ch / H) | 0));
  ox = ((cw - W * scale) / 2) | 0;
  oy = ((ch - H * scale) / 2) | 0;
  dctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

/* =====================================================================
 * 14. INPUT / SOUND TOGGLE
 * First interaction creates the AudioContext (autoplay policy); afterwards
 * click or M toggles mute. The visualization runs fine without audio.
 * ===================================================================== */
function toggleSound() {
  if (!AC) { initAudio(); if (AC) playSfx(SX_PUSH); }
  else { muted = !muted; if (AC.state === 'suspended') AC.resume(); if (!muted) playSfx(SX_PUSH); }
}
window.addEventListener('pointerdown', toggleSound);
window.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (!AC) toggleSound();
});

/* =====================================================================
 * 15. MAIN LOOP  (rAF render at display rate, fixed 60 Hz simulation)
 * ===================================================================== */
let last = 0, acc = 0;
function frameLoop(now) {
  if (!last) last = now;
  let dt = now - last; last = now;
  if (dt > 100) dt = 100;
  acc += dt;
  while (acc >= STEP) {
    acc -= STEP;
    if (!fatal) {
      try { update(); } catch (e) { if (!fatal) fatal = 'RUNTIME ERROR'; console.error(e); }
    }
    flushAudio();
  }
  render();
  requestAnimationFrame(frameLoop);
}

try { resetAll(); } catch (e) { if (!fatal) fatal = 'INIT ERROR'; console.error(e); }
phase = P_INTRO; pt = 0;
resize();
requestAnimationFrame(frameLoop);

})();
</script>
</body>
</html>
