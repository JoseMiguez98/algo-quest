<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bidirectional BFS - Pixel Visualization</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0b0d1a;overflow:hidden}
#screen{position:absolute;display:block;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
'use strict';
/* =====================================================================
   BIDIRECTIONAL BFS - pixel-art visualization (128x96 logical pixels)

   Architecture (three strictly separated layers):
     1. ALGORITHM  - runBidirectional() executes a genuine bidirectional BFS
                     and records every step into a deterministic event stream.
     2. ANIMATION  - startEvent()/stepPlayback() replay that stream at a
                     human-readable pace and rebuild a *view* of the state
                     purely from events (never from the renderer).
     3. RENDERING  - render() only draws the view state.
   At the end of playback the view state is compared to the algorithm's own
   arrays; the algorithm is authoritative and the view is corrected on mismatch.

   Keys: any key/click = enable sound, M = mute, SPACE/P = pause,
         +/- = speed, E = toggle NODE/EDGE meeting mode (next loop), R = restart
   ===================================================================== */

/* ===== 1. CONSTANTS / PALETTE ===== */
const W=128,H=96,PX=96;                       // logical size, right-panel x
const PAL=['#0b0d1a','#151a33','#232b52','#3a4373','#6b7399','#b9c0dc','#ffffff',
           '#0f3a8a','#1f6fe0','#35c2ff','#a6f0ff','#4a1a7a','#9b3fd6','#e94bd0',
           '#f7a6ec','#fff27a','#ffd21f','#ff8a1f','#1fbf5b','#7dff9a','#d83a3a',
           '#12305f','#35124f','#0a2a2a'];    // 24 fixed colors
const CBG=0,CPANEL=1,CDARK=2,CEDGE=3,CGRAY=4,CLIGHT=5,CWHITE=6,CFDEEP=7,CFBLUE=8,
      CFCYAN=9,CFLIGHT=10,CBDEEP=11,CBPURP=12,CBMAG=13,CBLIGHT=14,CYEL=15,CGOLD=16,
      CORANGE=17,CGREEN=18,CLGREEN=19,CRED=20,CFFILL=21,CBFILL=22,CTEAL=23;

/* ===== 2. GRAPH DEFINITION / 3. NODE COORDINATES ===== */
// 18 nodes: 0=S(TART), 1..16 = A..P, 17 = T(ARGET). Unweighted graph.
const NN=18,START=0,TARGET=17;
const NX=new Int8Array([9,21,21,21,34,34,34,34,47,47,47,60,60,60,60,72,72,84]);
const NY=new Int8Array([39,24,39,54,16,31,46,61,24,39,54,16,31,46,61,24,54,39]);
const LBL=new Uint8Array(NN);                  // ASCII code of each node label
(function(){LBL[0]=83;for(let i=1;i<=16;i++)LBL[i]=64+i;LBL[17]=84;})();

/* ===== 4. EDGES / ADJACENCY ===== */
// 27 undirected edges, every edge costs exactly 1 (BFS, no weights).
const EDGES=[0,1, 0,2, 0,3, 1,4, 1,5, 2,5, 2,6, 3,6, 3,7, 4,8, 5,8, 5,9, 6,9, 6,10,
             7,10, 8,11, 8,12, 9,12, 9,13, 10,13, 10,14, 11,15, 12,15, 13,16, 14,16,
             15,17, 16,17];
const NE=EDGES.length/2;
const ADJM=new Uint8Array(NN*NN);              // adjacency matrix (for assertions)
const ADJS=new Uint8Array(NN+1);               // CSR offsets
const ADJL=new Uint8Array(NE*2);               // CSR neighbor list
(function(){
  const deg=new Uint8Array(NN),cur=new Uint8Array(NN);
  for(let e=0;e<NE;e++){deg[EDGES[e*2]]++;deg[EDGES[e*2+1]]++;}
  for(let i=0;i<NN;i++)ADJS[i+1]=ADJS[i]+deg[i];
  // neighbor order = order of appearance in EDGES -> fully deterministic
  for(let e=0;e<NE;e++){
    const a=EDGES[e*2],b=EDGES[e*2+1];
    ADJL[ADJS[a]+cur[a]++]=b; ADJL[ADJS[b]+cur[b]++]=a;
    ADJM[a*NN+b]=1; ADJM[b*NN+a]=1;
  }
})();

/* ===== 5-11. TWO INDEPENDENT BFS STATES =====
   Index 0 = FORWARD (from START), index 1 = BACKWARD (from TARGET).
   Each direction owns its own FIFO queue, visited flags, parent tree and
   distance table. Neither search ever writes into the other's arrays.
   Why two searches? Each BFS only has to reach about half the depth, so the
   two wavefronts meet in the middle instead of one wave sweeping everything. */
const QQ=[new Int8Array(NN),new Int8Array(NN)];        // FIFO queues (array + head/tail)
const HEAD=new Int8Array(2),TAIL=new Int8Array(2);
const VIS=[new Uint8Array(NN),new Uint8Array(NN)];     // forwardVisited / backwardVisited
const PAR=[new Int8Array(NN),new Int8Array(NN)];       // forwardParent / backwardParent
const DST=[new Int8Array(NN),new Int8Array(NN)];       // forwardDistance / backwardDistance

/* ===== 14. EVENT GENERATION (storage) ===== */
const E_START=0,E_F_LAYER=1,E_B_LAYER=2,E_F_DEQ=3,E_B_DEQ=4,E_F_EXPAND=5,E_B_EXPAND=6,
      E_F_DISC=7,E_B_DISC=8,E_F_ENQ=9,E_B_ENQ=10,E_CHECK=11,E_CAND=12,E_MEET=13,
      E_STOP=14,E_RECON_F=15,E_RECON_B=16,E_PATH_STEP=17,E_PATH_DONE=18,E_COMPLETE=19;
const EV_MAX=768;
const evT=new Uint8Array(EV_MAX),evA=new Int8Array(EV_MAX),evB=new Int8Array(EV_MAX),
      evC=new Int16Array(EV_MAX),evD=new Int8Array(EV_MAX);
let evN=0,evHash=0,lastHash=-1,lastHashMode=-1;
function pushEv(t,a,b,c,d){
  if(evN>=EV_MAX)throw new Error('EVENT BUFFER FULL');
  evT[evN]=t;evA[evN]=a;evB[evN]=b;evC[evN]=c;evD[evN]=d;evN++;
}

/* ===== 12. MEETING DETECTION / 13. PATH RECONSTRUCTION (results) ===== */
let edgeMode=false,pendingEdge=false;    // false: meet at a NODE, true: connect through an EDGE
let found=false,bestF=-1,bestB=-1,bestTotal=127,bestType=0;
const PATH=new Int8Array(NN),CH1=new Int8Array(NN),CH2=new Int8Array(NN);
let pathLen=0;
let failMsg='';
function assert(c,m){if(!c)throw new Error(m);}

// A connection candidate. Because BFS layers are expanded completely before the
// search stops, we keep the connection with the smallest total length; ties keep
// the first one found. fn = node on forward tree, bn = node on backward tree.
// fn===bn -> the searches met AT A NODE; fn!==bn -> FRONTIERS CONNECT THROUGH EDGE fn-bn.
function consider(fn,bn,total,type){
  found=true;
  if(total<bestTotal){bestTotal=total;bestF=fn;bestB=bn;bestType=type;pushEv(E_CAND,fn,bn,total,type);}
}

// Expand exactly one complete BFS layer (all nodes currently in the queue at
// the start of the layer) for direction s.  s=0 forward, s=1 backward.
function expandLayer(s){
  const o=1-s,Q=QQ[s],V=VIS[s],Vo=VIS[o],P=PAR[s],D=DST[s],Do=DST[o];
  const size=TAIL[s]-HEAD[s];
  const depth=D[Q[HEAD[s]]];
  pushEv(E_F_LAYER+s,depth,size,0,0);
  for(let i=0;i<size;i++){
    const u=Q[HEAD[s]++];                       // FIFO dequeue
    pushEv(E_F_DEQ+s,u,D[u],0,0);
    for(let k=ADJS[u];k<ADJS[u+1];k++){
      const v=ADJL[k];
      if(V[v])continue;                         // already seen by THIS direction
      pushEv(E_F_EXPAND+s,u,v,0,0);
      if(edgeMode&&Vo[v]){
        // MEETING-EDGE case: u (own side) touches v (other side's region) before
        // v is discovered by this side: forwardVisited[u] && backwardVisited[v].
        pushEv(E_CHECK,v,u,1,s);
        consider(s===0?u:v,s===0?v:u,D[u]+1+Do[v],1);
        continue;
      }
      V[v]=1;P[v]=u;D[v]=D[u]+1;Q[TAIL[s]++]=v; // discover + enqueue (own arrays only)
      pushEv(E_F_DISC+s,u,v,D[v],0);
      pushEv(E_F_ENQ+s,v,0,0,0);
      const hit=Vo[v]?1:0;                      // MEETING-NODE case: both visited sets contain v
      pushEv(E_CHECK,v,u,hit,s);
      if(hit)consider(v,v,DST[0][v]+DST[1][v],0);
    }
  }
}

function refBfs(){ // independent reference BFS, used ONLY by the development assertion
  const d=new Int8Array(NN).fill(-1),q=new Int8Array(NN);let h=0,t=0;
  q[t++]=START;d[START]=0;
  while(h<t){const u=q[h++];for(let k=ADJS[u];k<ADJS[u+1];k++){const v=ADJL[k];if(d[v]<0){d[v]=d[u]+1;q[t++]=v;}}}
  return d[TARGET];
}

function runBidirectional(mode){
  edgeMode=mode;evN=0;found=false;bestF=-1;bestB=-1;bestTotal=127;bestType=0;pathLen=0;
  for(let s=0;s<2;s++){VIS[s].fill(0);PAR[s].fill(-1);DST[s].fill(-1);QQ[s].fill(-1);HEAD[s]=0;TAIL[s]=0;}
  pushEv(E_START,START,TARGET,mode?1:0,0);
  QQ[0][TAIL[0]++]=START;VIS[0][START]=1;DST[0][START]=0;   // forwardQueue=[START]
  QQ[1][TAIL[1]++]=TARGET;VIS[1][TARGET]=1;DST[1][TARGET]=0;// backwardQueue=[TARGET]
  // Alternate whole layers: FORWARD layer -> BACKWARD layer -> FORWARD layer ...
  // Stop after the layer in which the two regions first connect.
  let s=0,guard=0;
  while(!found){
    if(HEAD[0]>=TAIL[0]&&HEAD[1]>=TAIL[1])break;
    if(HEAD[s]<TAIL[s])expandLayer(s);
    s^=1;if(++guard>64)break;
  }
  assert(found,'NO PATH FOUND');
  pushEv(E_MEET,bestF,bestB,bestTotal,bestType);
  pushEv(E_STOP,bestF,bestB,bestTotal,bestType);
  // Path = START ..(forwardParent chain).. fn   +   bn ..(backwardParent chain).. TARGET
  let x=bestF,n1=0;while(x!==-1){CH1[n1++]=x;x=PAR[0][x];}     // fn -> ... -> START
  for(let i=n1-1;i>=0;i--){pushEv(E_RECON_F,CH1[i],n1-1-i,0,0);PATH[pathLen++]=CH1[i];} // reversed
  x=bestB;let n2=0;while(x!==-1){CH2[n2++]=x;x=PAR[1][x];}     // bn -> ... -> TARGET (already in path order)
  for(let i=n2-1;i>=0;i--)pushEv(E_RECON_B,CH2[i],n2-1-i,0,0); // animate TARGET -> meeting
  for(let i=0;i<n2;i++){if(i===0&&bestF===bestB)continue;PATH[pathLen++]=CH2[i];}
  for(let k=0;k<pathLen;k++)pushEv(E_PATH_STEP,PATH[k],k,pathLen,0);
  pushEv(E_PATH_DONE,pathLen,0,pathLen-1,0);
  pushEv(E_COMPLETE,0,0,0,0);
  verify();
  let h=7;for(let i=0;i<evN;i++)h=(Math.imul(h,31)+evT[i]*7+evA[i]*13+evB[i]*17+evC[i]*19+evD[i])>>>0;
  evHash=h;
}

// Development-time assertions: any failure is shown on screen instead of a wrong path.
function verify(){
  assert(QQ[0][0]===START,'START NOT FIRST FWD NODE');
  assert(QQ[1][0]===TARGET,'TARGET NOT FIRST BWD NODE');
  for(let s=0;s<2;s++){
    const root=s===0?START:TARGET;
    for(let v=0;v<NN;v++){
      if(!VIS[s][v])continue;
      if(v===root){assert(DST[s][v]===0,'ROOT DIST NOT 0');continue;}
      const p=PAR[s][v];
      assert(p>=0&&VIS[s][p]&&ADJM[p*NN+v]===1,s?'BAD BWD PARENT EDGE':'BAD FWD PARENT EDGE');
      assert(DST[s][v]===DST[s][p]+1,s?'BWD DIST STEP':'FWD DIST STEP');
    }
  }
  assert(VIS[0][bestF]&&VIS[1][bestB],'MEETING NODE NOT VISITED');
  if(bestF!==bestB)assert(ADJM[bestF*NN+bestB]===1,'MEETING EDGE MISSING');
  assert(bestType===(bestF===bestB?0:1),'MEETING TYPE MISMATCH');
  assert(DST[0][bestF]+DST[1][bestB]+(bestF===bestB?0:1)===bestTotal,'DIST SUM MISMATCH');
  assert(PATH[0]===START&&PATH[pathLen-1]===TARGET,'PATH ENDS WRONG');
  for(let k=0;k<pathLen-1;k++)assert(ADJM[PATH[k]*NN+PATH[k+1]]===1,'PATH STEP NOT AN EDGE');
  assert(pathLen-1===bestTotal,'PATH LENGTH MISMATCH');
  assert(refBfs()===bestTotal,'PATH NOT SHORTEST');
}

/* ===== 15. ANIMATION STATE (view rebuilt from events only) ===== */
const vVis=[new Uint8Array(NN),new Uint8Array(NN)],vPar=[new Int8Array(NN),new Int8Array(NN)],
      vDst=[new Int8Array(NN),new Int8Array(NN)],vQ=[new Int8Array(NN+2),new Int8Array(NN+2)],
      vInQ=[new Uint8Array(NN),new Uint8Array(NN)],vHead=new Int8Array(2),vTail=new Int8Array(2),
      vCur=new Int8Array(2),vDepth=new Int8Array(2),vExp=new Int16Array(2),vVisN=new Int16Array(2),
      layerSize=new Int8Array(2),reconMark=new Uint8Array(NN),onPath=new Uint8Array(NN),vPath=new Int8Array(NN);
let met=false,metF=-1,metB=-1,metType=0,metTotal=0,candF=-1,candB=-1,pShown=0,pathDone=false;
let cT=0,cA=0,cB=0,cC=0,cD=0,evIdx=0,evTimer=0,evDurCur=1,gt=0,flashT=0,ringT=0,ringX=0,ringY=0;
let MODE_INTRO=0,MODE_RUN=1,mode=0,introT=0,paused=false,spdIdx=1,startDelay=0,syncFixes=0;
const INTRO_LEN=210,SPEEDS=[0.5,1,2,4],SPD_STR=['X.5','X1','X2','X4'];
// event durations in 60Hz ticks (important events get more time)
const DUR=new Uint16Array([70,50,50,14,14,9,9,10,10,6,6,5,45,130,40,16,16,18,90,260]);

function resetView(){
  for(let s=0;s<2;s++){vVis[s].fill(0);vPar[s].fill(-1);vDst[s].fill(-1);vQ[s].fill(-1);vInQ[s].fill(0);
    vHead[s]=0;vTail[s]=0;vCur[s]=-1;vDepth[s]=0;vExp[s]=0;vVisN[s]=0;layerSize[s]=0;}
  reconMark.fill(0);onPath.fill(0);vPath.fill(-1);
  met=false;metF=-1;metB=-1;candF=-1;candB=-1;pShown=0;pathDone=false;flashT=0;ringT=0;
  cT=E_START;cA=0;cB=0;cC=0;cD=0;
}
function enqV(s,n){vQ[s][vTail[s]++]=n;vInQ[s][n]=1;}
function deqV(s,n){
  if(vQ[s][vHead[s]]!==n){syncFixes++;}      // algorithm is authoritative
  vInQ[s][n]=0;vHead[s]++;
}
// Compare replayed view against the algorithm's real arrays; correct the view if needed.
function syncCheck(){
  for(let s=0;s<2;s++)for(let v=0;v<NN;v++){
    if(vVis[s][v]!==VIS[s][v]||vPar[s][v]!==PAR[s][v]||vDst[s][v]!==DST[s][v]){
      vVis[s][v]=VIS[s][v];vPar[s][v]=PAR[s][v];vDst[s][v]=DST[s][v];syncFixes++;
    }
  }
}

/* ===== 17. PARTICLE POOL (preallocated, allocation-free) ===== */
const PC=192;
const PXA=new Float32Array(PC),PYA=new Float32Array(PC),PVX=new Float32Array(PC),PVY=new Float32Array(PC);
const PL=new Uint8Array(PC),PCL=new Uint8Array(PC);
let pCur=0,rngS=12345;
const DIRX=new Float32Array(16),DIRY=new Float32Array(16);
for(let i=0;i<16;i++){DIRX[i]=Math.cos(i*Math.PI/8);DIRY[i]=Math.sin(i*Math.PI/8);}
function rnd(){rngS=(Math.imul(rngS,1664525)+1013904223)>>>0;return rngS/4294967296;}
function spawn(x,y,vx,vy,life,col){
  for(let k=0;k<PC;k++){pCur=(pCur+1)%PC;
    if(PL[pCur]===0){PXA[pCur]=x;PYA[pCur]=y;PVX[pCur]=vx;PVY[pCur]=vy;PL[pCur]=life;PCL[pCur]=col;return;}}
}
function burst(n,cnt,col,sp,life){
  const x=NX[n],y=NY[n];
  for(let k=0;k<cnt;k++){const d=((k*16/cnt)|0)+(rnd()<0.5?0:1)&15;const v=sp*(0.6+rnd()*0.6);
    spawn(x,y,DIRX[d]*v,DIRY[d]*v,life,col);}
}
function converge(x,y){                      // blue from the left + purple from the right, into the meeting point
  for(let k=0;k<12;k++){const off=(k-6)*3;
    spawn(x-22,y+off,1.1,-off*0.05,20,k&1?CFCYAN:CFLIGHT);
    spawn(x+22,y+off,-1.1,-off*0.05,20,k&1?CBMAG:CBLIGHT);}
}
function updateParticles(){
  for(let i=0;i<PC;i++){if(PL[i]===0)continue;PXA[i]+=PVX[i];PYA[i]+=PVY[i];PL[i]--;}
}
// discovery / expansion pulses: one traveling wave per direction
const PU=new Float32Array(14); // per slot: act,x0,y0,x1,y1,t,col
function launchPulse(s,u,v){const b=s*7;PU[b]=1;PU[b+1]=NX[u];PU[b+2]=NY[u];PU[b+3]=NX[v];PU[b+4]=NY[v];PU[b+5]=0;PU[b+6]=s?CBLIGHT:CFLIGHT;}
function updatePulses(){for(let s=0;s<2;s++){const b=s*7;if(PU[b]){PU[b+5]+=0.09;if(PU[b+5]>1.25)PU[b]=0;}}}

/* ===== 16. AUDIO ENGINE (procedural NES-style, Web Audio only) ===== */
let actx=null,master=null,noiseBuf=null,soundOn=false,lastTick=0;
function unlockAudio(){
  if(!actx){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();
      master=actx.createGain();master.gain.value=0.2;master.connect(actx.destination);
      noiseBuf=actx.createBuffer(1,(actx.sampleRate*0.3)|0,actx.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      soundOn=true;
    }catch(e){actx=null;soundOn=false;}
  }else if(actx.state==='suspended')actx.resume();
}
function beep(f0,f1,dur,type,vol,delay){
  if(!actx||!soundOn)return;
  const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noiseBurst(dur,vol,delay){
  if(!actx||!soundOn||!noiseBuf)return;
  const t=actx.currentTime+(delay||0),s=actx.createBufferSource(),g=actx.createGain();
  s.buffer=noiseBuf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}
const PENTA=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880];
function sndStart(d){const n=[523.25,659.25,783.99,1046.5];for(let k=0;k<4;k++)beep(n[k],n[k],0.08,'square',0.08,d+k*0.07);}
function sndReset(){beep(880,220,0.22,'square',0.08,0);noiseBurst(0.08,0.04,0);}
function sndLayer(s){if(s===0)beep(262,392,0.1,'square',0.06);else beep(196,147,0.1,'triangle',0.12);}
function sndExpand(s){if(s===0)beep(330,330,0.035,'square',0.035);else beep(220,220,0.04,'triangle',0.09);}
function sndDisc(s){if(s===0)beep(660,1240,0.07,'square',0.045);else beep(495,930,0.07,'triangle',0.11);}
function sndCheck(hit){
  if(!actx)return;
  if(hit){beep(1500,1500,0.05,'square',0.05,0);beep(2000,2000,0.05,'square',0.05,0.05);}
  else if(actx.currentTime-lastTick>0.12){lastTick=actx.currentTime;beep(1800,1800,0.012,'square',0.02,0);}
}
function sndCand(){beep(523,523,0.09,'square',0.06,0);beep(784,784,0.09,'square',0.06,0.09);}
function sndMeet(){
  beep(300,900,0.4,'square',0.06,0);beep(1500,900,0.4,'triangle',0.16,0);
  noiseBurst(0.12,0.07,0.4);beep(900,900,0.5,'square',0.06,0.4);beep(1350,1350,0.5,'triangle',0.14,0.4);
}
function sndNote(k){beep(PENTA[k%10]*(k>=10?2:1),PENTA[k%10]*(k>=10?2:1),0.1,'square',0.06,0);}
function sndWin(){const n=[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5];
  for(let k=0;k<n.length;k++)beep(n[k],n[k],0.12,'square',0.07,k*0.1);beep(1046.5,1046.5,0.4,'triangle',0.14,0.7);}

/* ===== 21. AUDIO EVENT DISPATCH + view update: one event = one state change =====
   Sounds are triggered here, i.e. only when a real algorithm event is replayed. */
function startEvent(i){
  const t=evT[i],a=evA[i],b=evB[i],c=evC[i],d=evD[i];
  cT=t;cA=a;cB=b;cC=c;cD=d;evTimer=0;evDurCur=(t===E_CHECK&&c)?30:DUR[t];
  switch(t){
    case E_START:
      resetView();cT=t;cA=a;cB=b;cC=c;cD=d;
      vVis[0][START]=1;vDst[0][START]=0;vVisN[0]=1;vVis[1][TARGET]=1;vDst[1][TARGET]=0;vVisN[1]=1;
      enqV(0,START);enqV(1,TARGET);
      burst(START,12,CFCYAN,0.8,22);burst(TARGET,12,CBMAG,0.8,22);
      sndStart(startDelay);startDelay=0;break;
    case E_F_LAYER:case E_B_LAYER:{const s=t-E_F_LAYER;vDepth[s]=a;layerSize[s]=b;sndLayer(s);break;}
    case E_F_DEQ:case E_B_DEQ:{const s=t-E_F_DEQ;deqV(s,a);vCur[s]=a;vExp[s]++;break;}
    case E_F_EXPAND:case E_B_EXPAND:{const s=t-E_F_EXPAND;launchPulse(s,a,b);sndExpand(s);break;}
    case E_F_DISC:case E_B_DISC:{const s=t-E_F_DISC;
      vVis[s][b]=1;vPar[s][b]=a;vDst[s][b]=c;vVisN[s]++;
      burst(b,8,s?CBMAG:CFCYAN,0.7,16);sndDisc(s);break;}
    case E_F_ENQ:case E_B_ENQ:{const s=t-E_F_ENQ;enqV(s,a);break;}
    case E_CHECK:if(c)burst(a,6,CYEL,0.8,14);sndCheck(c);break;
    case E_CAND:candF=a;candB=b;burst(a,6,CORANGE,0.7,16);burst(b,6,CORANGE,0.7,16);sndCand();break;
    case E_MEET:{
      met=true;metF=a;metB=b;metTotal=c;metType=d;
      const mx=(NX[a]+NX[b])>>1,my=(NY[a]+NY[b])>>1;
      converge(mx,my);ringT=1;ringX=mx;ringY=my;flashT=44;
      burst(a,10,CYEL,1,24);burst(b,10,CWHITE,1,24);sndMeet();break;}
    case E_STOP:vCur[0]=-1;vCur[1]=-1;break;
    case E_RECON_F:case E_RECON_B:reconMark[a]=1;burst(a,5,CLGREEN,0.7,14);sndNote(b);break;
    case E_PATH_STEP:onPath[a]=1;vPath[b]=a;pShown=b+1;burst(a,6,CGREEN,0.9,18);sndNote(b);break;
    case E_PATH_DONE:
      syncCheck();pathDone=true;
      for(let k=0;k<pShown;k++)burst(vPath[k],5,CLGREEN,1,22);
      sndWin();break;
    case E_COMPLETE:break;
  }
}

/* ===== 18. UPDATE LOOP (fixed 60Hz simulation step) ===== */
function generate(){
  runBidirectional(pendingEdge);
  // determinism check: same graph + same mode must produce an identical event stream
  if(lastHashMode===(pendingEdge?1:0))assert(evHash===lastHash,'NON DETERMINISTIC RUN');
  lastHash=evHash;lastHashMode=pendingEdge?1:0;
}
function beginRun(){mode=MODE_RUN;evIdx=0;startEvent(0);}
function resetRun(){
  // Restore ALL algorithm + view state by re-executing the algorithm from scratch.
  sndReset();startDelay=0.22;
  PL.fill(0);PU.fill(0);
  try{generate();}catch(e){fail(e.message);return;}
  resetView();evIdx=0;startEvent(0);
}
function stepPlayback(){
  evTimer+=SPEEDS[spdIdx];
  if(evTimer>=evDurCur){
    evIdx++;
    if(evIdx>=evN)resetRun();else startEvent(evIdx);
  }
}
function simStep(){
  gt++;
  if(failMsg)return;
  if(!paused){
    if(mode===MODE_INTRO){introT++;if(introT>=INTRO_LEN)beginRun();}
    else stepPlayback();
    updateParticles();updatePulses();
    if(ringT>0){ringT++;if(ringT>70)ringT=0;}
    if(flashT>0)flashT--;
  }
}

/* ===== 19. PIXEL ART RENDERING (offscreen 128x96, integer coordinates only) ===== */
const off=document.createElement('canvas');off.width=W;off.height=H;
const g=off.getContext('2d');g.imageSmoothingEnabled=false;
let curC=-1;
function setC(c){if(c!==curC){curC=c;g.fillStyle=PAL[c];}}
function rect(x,y,w,h,c){setC(c);g.fillRect(x,y,w,h);}
function px(x,y,c){setC(c);g.fillRect(x,y,1,1);}
function line(x0,y0,x1,y1,c,dash){
  setC(c);
  let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx+dy,n=0;
  for(;;){
    if(!dash||(n&3)<2)g.fillRect(x0,y0,1,1);
    if(x0===x1&&y0===y1)break;
    const e2=2*err;
    if(e2>=dy){err+=dy;x0+=sx;}
    if(e2<=dx){err+=dx;y0+=sy;}
    n++;
  }
}
function frameRect(x,y,w,h,c){rect(x,y,w,1,c);rect(x,y+h-1,w,1,c);rect(x,y,1,h,c);rect(x+w-1,y,1,h,c);}

const GL=new Uint8Array(128*15);
(function(){for(const k in FONT){const code=k.charCodeAt(0),rows=FONT[k].split('/');
  for(let r=0;r<5;r++)for(let c=0;c<3;c++)GL[code*15+r*3+c]=rows[r][c]==='1'?1:0;}})();
function glyph(code,x,y,c,s){
  setC(c);const b=code*15;
  for(let r=0;r<5;r++)for(let cc=0;cc<3;cc++)if(GL[b+r*3+cc])g.fillRect(x+cc*s,y+r*s,s,s);
}
function drawT(str,x,y,c,s){s=s||1;for(let i=0;i<str.length;i++){const code=str.charCodeAt(i);if(code<128&&code!==32)glyph(code,x,y,c,s);x+=4*s;}return x;}
function drawNum(n,x,y,c){
  if(n<0)n=0;
  if(n>=100){glyph(48+((n/100)|0)%10,x,y,c,1);x+=4;}
  if(n>=10){glyph(48+((n/10)|0)%10,x,y,c,1);x+=4;}
  glyph(48+n%10,x,y,c,1);return x+4;
}
function drawL(n,x,y,c){if(n<0)glyph(45,x,y,c,1);else glyph(LBL[n],x,y,c,1);return x+4;}

function drawNode(i){
  const x=NX[i],y=NY[i],fv=vVis[0][i],bv=vVis[1][i];
  let bd=CEDGE,fa=CDARK,fb=-1,lt=CGRAY,split=false;
  if(onPath[i]){bd=CLGREEN;fa=CGREEN;lt=CBG;}
  else if(met&&(i===metF||i===metB)){bd=CWHITE;fa=((gt>>3)&1)?CYEL:CGOLD;lt=CBG;}
  else if(fv&&bv){split=true;bd=CGOLD;lt=CWHITE;}
  else if(fv){                                   // FORWARD: solid fills, blue / cyan
    if(i===vCur[0]){bd=CFCYAN;fa=CWHITE;lt=CFBLUE;}
    else if(vInQ[0][i]){bd=CFLIGHT;fa=CFCYAN;lt=CBG;}
    else{bd=CFBLUE;fa=CFFILL;lt=CFLIGHT;}
  }else if(bv){                                  // BACKWARD: checkered fills, purple / magenta
    if(i===vCur[1]){bd=CBMAG;fa=CWHITE;fb=CBLIGHT;lt=CBDEEP;}
    else if(vInQ[1][i]){bd=CBLIGHT;fa=CBMAG;fb=CBPURP;lt=CWHITE;}
    else{bd=CBPURP;fa=CBFILL;fb=CBDEEP;lt=CBLIGHT;}
  }
  rect(x-2,y-3,5,7,bd);rect(x-3,y-2,7,5,bd);     // 7x7 with cut corners
  if(split){rect(x-2,y-2,2,5,CFBLUE);rect(x-0,y-2,1,5,CYEL);rect(x+1,y-2,2,5,CBMAG);}
  else{
    rect(x-2,y-2,5,5,fa);
    if(fb>=0){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(((dx+dy)&1)!==0)px(x+dx,y+dy,fb);}
  }
  glyph(LBL[i],x-1,y-2,lt,1);
  if(i===START)frameRect(x-4,y-4,9,9,CFLIGHT);
  if(i===TARGET)frameRect(x-4,y-4,9,9,CBLIGHT);
  if(!met&&candF>=0&&(i===candF||i===candB)&&((gt>>2)&1))frameRect(x-4,y-4,9,9,CORANGE);
  if(i===vCur[0]||i===vCur[1])if((gt>>2)&1)frameRect(x-4,y-4,9,9,CWHITE);
}

function drawEdges(){
  for(let e=0;e<NE;e++){
    const a=EDGES[e*2],b=EDGES[e*2+1];
    let c=CEDGE,dash=false;
    const tf=vVis[0][a]&&vVis[0][b]&&(vPar[0][b]===a||vPar[0][a]===b);
    const tb=vVis[1][a]&&vVis[1][b]&&(vPar[1][b]===a||vPar[1][a]===b);
    if(tf&&tb){c=CYEL;}
    else if(tf){c=CFBLUE;}
    else if(tb){c=CBPURP;dash=true;}            // backward tree edges are dashed
    if((tf||tb)&&reconMark[a]&&reconMark[b]){c=CLGREEN;dash=false;}
    const linkE=(a===metF&&b===metB)||(a===metB&&b===metF);
    if(metF>=0&&metF!==metB&&linkE)c=CYEL;
    else if(candF>=0&&candF!==candB&&((a===candF&&b===candB)||(a===candB&&b===candF)))c=CORANGE;
    line(NX[a],NY[a],NX[b],NY[b],c,dash);
  }
  for(let k=0;k<pShown-1;k++){                  // final path drawn thick
    const a=vPath[k],b=vPath[k+1];
    line(NX[a],NY[a],NX[b],NY[b],CGREEN,false);
    line(NX[a]+1,NY[a],NX[b]+1,NY[b],CGREEN,false);
    line(NX[a],NY[a]+1,NX[b],NY[b]+1,CLGREEN,false);
  }
}
function drawPulses(){
  for(let s=0;s<2;s++){const b=s*7;if(!PU[b])continue;
    let t=PU[b+5];if(t>1)t=1;
    const x=(PU[b+1]+(PU[b+3]-PU[b+1])*t)|0,y=(PU[b+2]+(PU[b+4]-PU[b+2])*t)|0,c=PU[b+6];
    const t2=t>0.2?t-0.2:0,x2=(PU[b+1]+(PU[b+3]-PU[b+1])*t2)|0,y2=(PU[b+2]+(PU[b+4]-PU[b+2])*t2)|0;
    px(x2,y2,s?CBMAG:CFCYAN);
    rect(x-1,y,3,1,c);rect(x,y-1,1,3,c);px(x,y,CWHITE);
  }
}
function drawParticles(){
  for(let i=0;i<PC;i++){if(PL[i]===0)continue;px(PXA[i]|0,PYA[i]|0,PCL[i]);}
  if(ringT>0){
    const r=ringT>>1,c=(ringT&4)?CYEL:CWHITE;
    frameRect(ringX-r,ringY-r,2*r+1,2*r+1,c);
    if(r>3)frameRect(ringX-r+3,ringY-r+3,2*r-5,2*r-5,(ringT&4)?CFCYAN:CBMAG);
  }
}

}
let failLines=null;
function fail(m){
  failMsg=m;failLines=['ASSERTION FAILED:'];
  let s=m,i=0;while(i<s.length){failLines.push(s.substring(i,i+28));i+=28;}
}
function drawFail(){
  rect(0,0,W,H,CBG);frameRect(2,2,W-4,H-4,CRED);
  for(let i=0;i<failLines.length;i++)drawT(failLines[i],8,12+i*8,i===0?CRED:CWHITE);
}
function render(){
  curC=-1;
  if(failMsg){drawFail();return;}
  rect(0,0,W,H,CBG);
  drawGrid();drawEdges();drawPulses();
  for(let i=0;i<NN;i++)drawNode(i);
  drawParticles();drawLegend();drawPanel();drawTop();drawBottom();
  if(flashT>0&&((flashT>>1)&1))frameRect(0,0,W,H,CYEL);
  if(mode===MODE_INTRO)drawIntro();
}

/* ===== 22. RESIZE / DISPLAY SCALING ===== */
const screenEl=document.getElementById('screen');
const sctx=screenEl.getContext('2d');
function resize(){
  const dpr=window.devicePixelRatio||1;
  const s=Math.max(1,Math.floor(Math.min(window.innerWidth*dpr/W,window.innerHeight*dpr/H)));
  screenEl.width=W*s;screenEl.height=H*s;
  const cw=W*s/dpr,ch=H*s/dpr;
  screenEl.style.width=cw+'px';screenEl.style.height=ch+'px';
  screenEl.style.left=Math.floor((window.innerWidth-cw)/2)+'px';
  screenEl.style.top=Math.floor((window.innerHeight-ch)/2)+'px';
  sctx.imageSmoothingEnabled=false;             // resizing a canvas resets its state
}
window.addEventListener('resize',resize);

/* ===== 23. INPUT / SOUND TOGGLE ===== */
// AudioContext is created only after a user gesture; the visualization works without audio.
window.addEventListener('pointerdown',function(){unlockAudio();});
window.addEventListener('keydown',function(e){
  const k=e.key;
  const wasReady=!!actx;unlockAudio();
  if(k==='m'||k==='M'){if(wasReady){soundOn=!soundOn;}}
  else if(k===' '||k==='p'||k==='P'){paused=!paused;e.preventDefault();}
  else if(k==='+'||k==='='){if(spdIdx<3)spdIdx++;}
  else if(k==='-'||k==='_'){if(spdIdx>0)spdIdx--;}
  else if(k==='e'||k==='E'){pendingEdge=!pendingEdge;}
  else if(k==='r'||k==='R'){if(mode===MODE_RUN&&!failMsg)resetRun();}
});

/* ===== 24. MAIN LOOP (fixed 60Hz timestep, rAF rendering) ===== */
try{generate();}catch(e){fail(e.message);}
resetView();resize();
let lastTs=0,acc=0;const STEP=1000/60;
function frame(ts){
  if(!lastTs)lastTs=ts;
  let dt=ts-lastTs;lastTs=ts;if(dt>250)dt=250;acc+=dt;
  let n=0;while(acc>=STEP&&n<6){simStep();acc-=STEP;n++;}
  if(n===6)acc=0;
  render();
  sctx.drawImage(off,0,0,W,H,0,0,screenEl.width,screenEl.height);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
