<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A* Search - Pixel Visualizer</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#0d0d1a;overflow:hidden}
#screen{position:fixed;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
(function () {
'use strict';

/* =====================================================================
   1. CONSTANTS / PALETTE
   Fixed 24-colour palette. Every pixel drawn comes from this table.
   ===================================================================== */
const LW = 128, LH = 96, STEP_MS = 1000 / 60;
const PAL = [
  '#0d0d1a', '#141a30', '#1d3557', '#3b5b8c', '#5c7fb5', '#8a6fb0', '#b39ddb', '#ffe14d',
  '#ff9f1c', '#2ec4d6', '#0e7c8a', '#39ff7a', '#1f9d4a', '#ffffff', '#c8d0e0', '#6b7488',
  '#ff4d5e', '#8f2a3a', '#4d9bff', '#1f5fbf', '#7a3fc0', '#ffd9a0', '#2a2f45', '#000000'
];
const BG = 0, PANEL = 1, UND = 2, UNDB = 3, DIMTXT = 4, OPENC = 5, HLT = 6, YEL = 7, ORG = 8,
      CYAN = 9, DCYAN = 10, GRN = 11, DGRN = 12, WHITE = 13, LGRAY = 14, GRAY = 15, RED = 16,
      DRED = 17, GBL = 18, GDK = 19, HMID = 20, PALE = 21, EDGEDIM = 22, BLACK = 23;
// The three A* quantities each get their own colour (and their own letter label):
const COL_G = GBL;   // G = cost already paid      (blue)
const COL_H = HLT;   // H = estimated cost to go   (purple)
const COL_F = YEL;   // F = G + H, the priority    (yellow)

// Event types produced by the algorithm layer and replayed by the animation layer.
const ET_START = 0, ET_INIT = 1, ET_INSERT = 2, ET_EXTRACT = 3, ET_EXPAND = 4, ET_INSPECT = 5,
      ET_CALCG = 6, ET_COMPARE = 7, ET_RELAX = 8, ET_CALCH = 9, ET_CALCF = 10, ET_UPDATE = 11,
      ET_FAIL = 12, ET_SKIP = 13, ET_CLOSE = 14, ET_TARGET = 15, ET_RECON = 16, ET_PATH = 17,
      ET_DONE = 18;

/*ALGO-BEGIN*/
/* =====================================================================
   2-4. GRAPH DEFINITION / NODE COORDINATES / EDGE WEIGHTS
   15 nodes, 25 undirected edges with positive integer weights.
   Every node has fixed integer grid coordinates (GX,GY); pixel position
   is derived from them. The graph never changes between loops.
   ===================================================================== */
const N = 15, INF = 999, START = 0, TARGET = 14;
const NAMES = 'SABCDEFGHIJKLMT';
const GX = Int8Array.of(0, 2, 2, 2, 4, 4, 4, 6, 6, 6, 8, 8, 0, 0, 9);
const GY = Int8Array.of(3, 1, 3, 5, 0, 2, 4, 1, 3, 5, 0, 4, 5, 1, 2);
const NODE_X = new Int16Array(N), NODE_Y = new Int16Array(N);
for (let i = 0; i < N; i++) { NODE_X[i] = 6 + GX[i] * 9; NODE_Y[i] = 12 + GY[i] * 9; }

// [from, to, weight]. Each weight >= Manhattan distance between its endpoints
// (in grid units) - this is what makes the heuristic below consistent.
const EDGE_SRC = [
  ['S','A',5], ['S','B',3], ['S','C',6], ['S','L',4], ['L','C',3], ['S','M',3], ['M','A',3],
  ['A','D',4], ['A','E',4], ['B','E',4], ['B','F',6], ['C','F',4], ['D','G',4], ['E','G',4],
  ['E','H',4], ['F','H',4], ['F','I',3], ['G','J',4], ['G','H',3], ['H','K',4], ['I','K',4],
  ['J','T',4], ['K','T',4], ['H','T',5], ['D','J',5]
];
const E = EDGE_SRC.length;
const EU = new Uint8Array(E), EV = new Uint8Array(E), EW = new Uint8Array(E);
const EDGE_IDX = new Int8Array(N * N).fill(-1);          // (u,v) -> edge index
const ADJ_START = new Uint8Array(N + 1);                  // CSR adjacency list
const ADJ_TO = new Uint8Array(2 * E), ADJ_W = new Uint8Array(2 * E);
(function buildGraph() {
  const deg = new Uint8Array(N), fill = new Uint8Array(N);
  for (let k = 0; k < E; k++) {
    const u = NAMES.indexOf(EDGE_SRC[k][0]), v = NAMES.indexOf(EDGE_SRC[k][1]);
    EU[k] = u; EV[k] = v; EW[k] = EDGE_SRC[k][2];
    deg[u]++; deg[v]++;
    EDGE_IDX[u * N + v] = k; EDGE_IDX[v * N + u] = k;
  }
  for (let i = 0; i < N; i++) ADJ_START[i + 1] = ADJ_START[i] + deg[i];
  for (let k = 0; k < E; k++) {
    const u = EU[k], v = EV[k], w = EW[k];
    ADJ_TO[ADJ_START[u] + fill[u]] = v; ADJ_W[ADJ_START[u] + fill[u]] = w; fill[u]++;
    ADJ_TO[ADJ_START[v] + fill[v]] = u; ADJ_W[ADJ_START[v] + fill[v]] = w; fill[v]++;
  }
})();
function edgeWeight(u, v) {
  for (let k = ADJ_START[u]; k < ADJ_START[u + 1]; k++) if (ADJ_TO[k] === v) return ADJ_W[k];
  return INF;
}

/* =====================================================================
   5. HEURISTIC FUNCTION
   h(n) = Manhattan distance (grid units) from n to TARGET.
   ADMISSIBLE: every edge weight is >= the Manhattan distance between its
   endpoints, so any path from n to TARGET costs at least the Manhattan
   distance (triangle inequality of the L1 metric). h never overestimates.
   CONSISTENT: for every edge n->m,  h(n) <= w(n,m) + h(m)  because
   |n-T| <= |n-m| + |m-T| <= w(n,m) + |m-T|.  h(TARGET) = 0.
   (devVerify() below checks both properties numerically at load time.)
   ===================================================================== */
function heuristic(n) {
  return Math.abs(GX[n] - GX[TARGET]) + Math.abs(GY[n] - GY[TARGET]);
}

/* =====================================================================
   9-10. G / H / F STATE  and  OPEN / CLOSED STATE
   g(n) = actual cost from START (cost already paid)
   h(n) = estimated cost from n to TARGET (a guess, never exact)
   f(n) = g(n) + h(n): the priority used by the open set
   ===================================================================== */
const gA = new Int16Array(N), hA = new Int16Array(N), fA = new Int16Array(N);
const parent = new Int8Array(N);
const closed = new Uint8Array(N);      // CLOSED: expanded, final
const inOpen = new Uint8Array(N);      // OPEN: discovered, waiting in the priority queue
const flags = new Uint8Array(N);       // bit0 = traced back from TARGET, bit1 = lit on final path
const qG = new Int16Array(N);          // g of the node's *current* queue entry (-1 = none)
let cExp = 0, cGen = 0, cRel = 0, cRej = 0, cMax = 0, cOpen = 0, cClosed = 0;
let pathLen = 0, pathCost = 0, pathOK = 0;
const pathRev = new Uint8Array(N), pathFwd = new Uint8Array(N);

/* =====================================================================
   7. PRIORITY QUEUE / MIN HEAP  (lazy deletion)
   Ordered by f, then h (prefer nodes closer to the goal), then node id, so
   the search order is fully deterministic. When a node's g improves a NEW
   entry is pushed; the older entry becomes stale (its g no longer matches
   qG[node]) and is discarded when it reaches the top.
   ===================================================================== */
const HCAP = 128;
const hF = new Int16Array(HCAP), hH = new Int16Array(HCAP), hG = new Int16Array(HCAP);
const hN = new Uint8Array(HCAP);
let hSize = 0, popN = 0, popF = 0, popH = 0, popG = 0;
function hLess(i, j) {
  if (hF[i] !== hF[j]) return hF[i] < hF[j];
  if (hH[i] !== hH[j]) return hH[i] < hH[j];
  return hN[i] < hN[j];
}
function hSwap(i, j) {
  let t = hF[i]; hF[i] = hF[j]; hF[j] = t;
  t = hH[i]; hH[i] = hH[j]; hH[j] = t;
  t = hG[i]; hG[i] = hG[j]; hG[j] = t;
  t = hN[i]; hN[i] = hN[j]; hN[j] = t;
}
function heapPush(f, h, n, g) {                      // push
  let i = hSize++;
  hF[i] = f; hH[i] = h; hN[i] = n; hG[i] = g;
  while (i > 0) {
    const p = (i - 1) >> 1;
    if (!hLess(i, p)) break;
    hSwap(i, p); i = p;
  }
}
function heapSize() { return hSize; }                // size
function heapPeek() { return hSize > 0 ? hN[0] : -1; }   // peek
function heapExtractMin() {                          // extractMin (raw, may be stale)
  popN = hN[0]; popF = hF[0]; popH = hH[0]; popG = hG[0];
  hSize--;
  if (hSize > 0) {
    hF[0] = hF[hSize]; hH[0] = hH[hSize]; hG[0] = hG[hSize]; hN[0] = hN[hSize];
    let i = 0;
    for (;;) {
      const l = 2 * i + 1, r = l + 1;
      let m = i;
      if (l < hSize && hLess(l, m)) m = l;
      if (r < hSize && hLess(r, m)) m = r;
      if (m === i) break;
      hSwap(i, m); i = m;
    }
  }
}
// Extract the smallest VALID entry, silently discarding stale duplicates.
function popValid() {
  while (hSize > 0) {
    heapExtractMin();
    if (!closed[popN] && qG[popN] === popG) return true;
  }
  return false;
}

/* =====================================================================
   8. EVENT GENERATION
   The real A* below runs to completion and records an event after every
   state change, together with a full snapshot of the algorithm state at
   that moment. The animation layer only replays these snapshots.
   ===================================================================== */
const MAXEV = 1024;
const evT = new Uint8Array(MAXEV), evCur = new Int8Array(MAXEV), evNb = new Int8Array(MAXEV);
const evW = new Int16Array(MAXEV), evTent = new Int16Array(MAXEV), evOld = new Int16Array(MAXEV);
const evRes = new Int16Array(MAXEV);
const sG = new Int16Array(MAXEV * N), sH = new Int16Array(MAXEV * N), sF = new Int16Array(MAXEV * N);
const sP = new Int8Array(MAXEV * N), sSt = new Uint8Array(MAXEV * N), sFl = new Uint8Array(MAXEV * N);
const sQ = new Uint8Array(MAXEV * N), sQf = new Int16Array(MAXEV * N), sQh = new Int16Array(MAXEV * N);
const sQn = new Uint8Array(MAXEV);
const sC = new Int16Array(MAXEV * 8);  // counters: expanded, generated, relaxed, rejected, maxOpen, open, closed
const tmpQ = new Uint8Array(HCAP);
let evCount = 0;

function emit(t, cur, nb, w, tent, old, res) {
  const e = evCount++;
  evT[e] = t; evCur[e] = cur; evNb[e] = nb; evW[e] = w; evTent[e] = tent; evOld[e] = old; evRes[e] = res;
  const b = e * N;
  for (let i = 0; i < N; i++) {
    sG[b + i] = gA[i]; sH[b + i] = hA[i]; sF[b + i] = fA[i]; sP[b + i] = parent[i];
    sSt[b + i] = closed[i] ? 2 : (inOpen[i] ? 1 : 0); sFl[b + i] = flags[i];
  }
  // Snapshot of the priority queue: all currently valid entries, sorted by priority.
  let q = 0;
  for (let k = 0; k < hSize; k++) if (!closed[hN[k]] && qG[hN[k]] === hG[k]) tmpQ[q++] = k;
  for (let a = 1; a < q; a++) {
    const key = tmpQ[a]; let c = a - 1;
    while (c >= 0 && hLess(key, tmpQ[c])) { tmpQ[c + 1] = tmpQ[c]; c--; }
    tmpQ[c + 1] = key;
  }
  for (let a = 0; a < q; a++) {
    const k = tmpQ[a];
    sQ[b + a] = hN[k]; sQf[b + a] = hF[k]; sQh[b + a] = hH[k];
  }
  sQn[e] = q;
  const c = e * 8;
  sC[c] = cExp; sC[c + 1] = cGen; sC[c + 2] = cRel; sC[c + 3] = cRej;
  sC[c + 4] = cMax; sC[c + 5] = cOpen; sC[c + 6] = cClosed;
}

/* =====================================================================
   6. A* ALGORITHM  (+ 12. PATH RECONSTRUCTION)
   ===================================================================== */
function runAStar() {
  evCount = 0; hSize = 0;
  cExp = cGen = cRel = cRej = cMax = cOpen = cClosed = 0;
  pathLen = 0; pathCost = 0; pathOK = 0;
  for (let i = 0; i < N; i++) {
    gA[i] = INF; hA[i] = -1; fA[i] = INF; parent[i] = -1;
    closed[i] = 0; inOpen[i] = 0; flags[i] = 0; qG[i] = -1;
  }
  emit(ET_START, START, -1, 0, 0, 0, 0);

  // g(START)=0, h(START)=heuristic, f = g + h, START goes into OPEN.
  gA[START] = 0; hA[START] = heuristic(START); fA[START] = gA[START] + hA[START];
  emit(ET_INIT, START, -1, 0, 0, 0, 0);
  heapPush(fA[START], hA[START], START, gA[START]); qG[START] = gA[START];
  inOpen[START] = 1; cGen = 1; cOpen = 1; cMax = 1;
  emit(ET_INSERT, START, START, 0, 0, 0, 0);

  let found = false;
  for (;;) {
    // EXTRACT-MIN: the OPEN node with the smallest valid f(n) = g(n) + h(n).
    if (!popValid()) break;
    const cur = popN;
    inOpen[cur] = 0; qG[cur] = -1; cOpen--;
    emit(ET_EXTRACT, cur, -1, 0, popF, 0, 0);

    if (cur === TARGET) {                 // TARGET extracted => path is optimal (admissible h)
      found = true;
      emit(ET_TARGET, cur, -1, 0, popF, 0, 0);
      break;
    }
    cExp++;
    emit(ET_EXPAND, cur, -1, 0, 0, 0, 0);

    for (let k = ADJ_START[cur]; k < ADJ_START[cur + 1]; k++) {
      const nb = ADJ_TO[k], w = ADJ_W[k];
      emit(ET_INSPECT, cur, nb, w, 0, gA[nb], 0);
      if (closed[nb]) {                   // CLOSED nodes are already final
        emit(ET_SKIP, cur, nb, w, 0, gA[nb], 0);
        continue;
      }
      // RELAXATION: is going through `cur` cheaper than the best known way to nb?
      const tent = gA[cur] + w, old = gA[nb];
      emit(ET_CALCG, cur, nb, w, tent, old, 0);
      const better = tent < old;
      emit(ET_COMPARE, cur, nb, w, tent, old, better ? 1 : 0);
      if (better) {
        parent[nb] = cur; gA[nb] = tent; fA[nb] = INF;   // f is stale until recomputed
        cRel++;
        emit(ET_RELAX, cur, nb, w, tent, old, 1);
        hA[nb] = heuristic(nb);
        emit(ET_CALCH, cur, nb, w, tent, old, 1);
        fA[nb] = gA[nb] + hA[nb];
        emit(ET_CALCF, cur, nb, w, tent, old, 1);
        const wasOpen = inOpen[nb];
        heapPush(fA[nb], hA[nb], nb, gA[nb]); qG[nb] = gA[nb];   // new entry; old one turns stale
        inOpen[nb] = 1;
        if (!wasOpen) { cGen++; cOpen++; if (cOpen > cMax) cMax = cOpen; }
        emit(wasOpen ? ET_UPDATE : ET_INSERT, cur, nb, w, tent, old, 1);
      } else {
        cRej++;
        emit(ET_FAIL, cur, nb, w, tent, old, 0);
      }
    }
    closed[cur] = 1; cClosed++;
    emit(ET_CLOSE, cur, -1, 0, 0, 0, 0);
  }

  if (found) {
    // PATH RECONSTRUCTION: follow parent[] from TARGET back to START.
    for (let n = TARGET; n >= 0; n = parent[n]) pathRev[pathLen++] = n;
    for (let i = 0; i < pathLen; i++) pathFwd[i] = pathRev[pathLen - 1 - i];
    for (let i = 0; i < pathLen; i++) {
      const n = pathRev[i]; flags[n] |= 1;
      emit(ET_RECON, n, parent[n], 0, 0, 0, i);
    }
    for (let i = 0; i + 1 < pathLen; i++) pathCost += edgeWeight(pathFwd[i], pathFwd[i + 1]);
    pathOK = (pathCost === gA[TARGET]) ? 1 : 0;     // verification: sum of edges === g[target]
    for (let i = 0; i < pathLen; i++) {
      const n = pathFwd[i]; flags[n] |= 2;
      emit(ET_PATH, n, i > 0 ? pathFwd[i - 1] : -1, 0, 0, 0, i);
    }
    emit(ET_DONE, TARGET, -1, pathLen - 1, pathCost, cExp, pathOK);
  } else {
    emit(ET_DONE, TARGET, -1, 0, 0, cExp, 0);
  }
}

// Development-only check (never drives the animation): confirms the heuristic is
// admissible and consistent, and that A* returned the true shortest cost.
function devVerify() {
  const d = new Int16Array(N).fill(INF); d[TARGET] = 0;
  for (let it = 0; it < N; it++)
    for (let k = 0; k < E; k++) {
      if (d[EV[k]] + EW[k] < d[EU[k]]) d[EU[k]] = d[EV[k]] + EW[k];
      if (d[EU[k]] + EW[k] < d[EV[k]]) d[EV[k]] = d[EU[k]] + EW[k];
    }
  let ok = heuristic(TARGET) === 0;
  for (let i = 0; i < N; i++) if (heuristic(i) > d[i]) ok = false;                  // admissible
  for (let k = 0; k < E; k++) {                                                      // consistent
    if (heuristic(EU[k]) > EW[k] + heuristic(EV[k])) ok = false;
    if (heuristic(EV[k]) > EW[k] + heuristic(EU[k])) ok = false;
  }
  return { heuristicOK: ok, trueDist: d[START] };
}

/* Static layout: place each edge-weight label on its edge where it overlaps
   the least (nodes, f-labels, other labels, other edges). Runs once. */
const LBL_X = new Int16Array(E), LBL_Y = new Int16Array(E);
function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && bx < ax + aw && ay < by + bh && by < ay + ah;
}
function edgePixelsInBox(k, bx, by) {
  let x0 = NODE_X[EU[k]], y0 = NODE_Y[EU[k]];
  const x1 = NODE_X[EV[k]], y1 = NODE_Y[EV[k]];
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, cnt = 0;
  for (;;) {
    if (x0 >= bx && x0 < bx + 5 && y0 >= by && y0 < by + 7) cnt++;
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
  return cnt;
}
const LBL_T = [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74, 0.5];
function layoutLabels() {
  for (let k = 0; k < E; k++) {
    const x0 = NODE_X[EU[k]], y0 = NODE_Y[EU[k]], x1 = NODE_X[EV[k]], y1 = NODE_Y[EV[k]];
    let best = 1e9, bx0 = 0, by0 = 0;
    for (let ti = 0; ti < LBL_T.length; ti++) {
      const t = LBL_T[ti];
      const bx = Math.round(x0 + (x1 - x0) * t) - 2, by = Math.round(y0 + (y1 - y0) * t) - 3;
      let s = ti;                                  // slight preference for the middle
      for (let i = 0; i < N; i++) {
        if (rectHit(bx, by, 5, 7, NODE_X[i] - 4, NODE_Y[i] - 4, 9, 9)) s += 100;
        if (rectHit(bx, by, 5, 7, NODE_X[i] - 4, NODE_Y[i] + 4, 9, 7)) s += 100;
      }
      for (let j = 0; j < k; j++) if (rectHit(bx, by, 5, 7, LBL_X[j], LBL_Y[j], 5, 7)) s += 100;
      for (let j = 0; j < E; j++) if (j !== k) s += edgePixelsInBox(j, bx, by) * 3;
      if (s < best) { best = s; bx0 = bx; by0 = by; }
    }
    LBL_X[k] = bx0; LBL_Y[k] = by0;
  }
}
layoutLabels();
/*ALGO-END*/

/* =====================================================================
   BITMAP FONT (3x5)  - rows are 3-bit values, one digit per row
   ===================================================================== */
const FONT_SRC = {
  '0':'75557','1':'26227','2':'71747','3':'71717','4':'55711','5':'74717','6':'74757','7':'71111','8':'75757','9':'75717',
  'A':'25755','B':'65656','C':'34443','D':'65556','E':'74647','F':'74644','G':'34553','H':'55755','I':'72227','J':'11152',
  'K':'55655','L':'44447','M':'57755','N':'65555','O':'25552','P':'65644','Q':'25563','R':'65655','S':'34216','T':'72222',
  'U':'55557','V':'55552','W':'55775','X':'55255','Y':'55222','Z':'71247',
  '+':'02720','-':'00700','=':'07070','<':'12421','>':'42124',':':'02020','.':'00002','/':'11244','*':'05250',
  '?':'71202','!':'22202','^':'25000','|':'22222','(':'12221',')':'42224','~':'03600'
};
const GLY = new Uint8Array(128 * 5);
(function initFont() {
  for (const ch in FONT_SRC) {
    const code = ch.charCodeAt(0), s = FONT_SRC[ch];
    for (let r = 0; r < 5; r++) GLY[code * 5 + r] = s.charCodeAt(r) - 48;
  }
})();
const NAME_CODE = new Uint8Array(N);
for (let i = 0; i < N; i++) NAME_CODE[i] = NAMES.charCodeAt(i);
const POW10 = [1, 10, 100];

/* =====================================================================
   11. ANIMATION STATE
   The animation layer replays recorded events; it never decides anything.
   ===================================================================== */
// frames (at 60 Hz) each event stays on screen: important events get more time
const DUR = new Uint8Array(20);
DUR[ET_START] = 60; DUR[ET_INIT] = 60; DUR[ET_INSERT] = 26; DUR[ET_EXTRACT] = 44;
DUR[ET_EXPAND] = 30; DUR[ET_INSPECT] = 16; DUR[ET_CALCG] = 30; DUR[ET_COMPARE] = 30;
DUR[ET_RELAX] = 24; DUR[ET_CALCH] = 26; DUR[ET_CALCF] = 26; DUR[ET_UPDATE] = 24;
DUR[ET_FAIL] = 28; DUR[ET_SKIP] = 14; DUR[ET_CLOSE] = 18; DUR[ET_TARGET] = 110;
DUR[ET_RECON] = 24; DUR[ET_PATH] = 24; DUR[ET_DONE] = 250;
const INTRO_FIRST = 200, INTRO_AGAIN = 100, RESET_FRAMES = 44;
const SPEEDS = [0.5, 1, 2, 4];
let phase = 0;          // 0 intro, 1 playing events, 3 reset wipe
let ci = 0;             // index of the event currently shown (the snapshot the renderer draws)
let timer = INTRO_FIRST;
let speedIdx = 1, paused = false, subAcc = 0, tick = 0, loops = 0;

/* =====================================================================
   13. AUDIO ENGINE (Web Audio, procedural 8-bit)
   Created only after a user gesture. Sounds are triggered from event
   entry (see sfx) and never influence the algorithm or timing.
   ===================================================================== */
let AC = null, master = null, noiseBuf = null, sndOn = false;
function initAudio() {
  if (AC) return;
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.16; master.connect(AC.destination);

const PMAX = 256;

      pX[pIdx] = x; pY[pIdx] = y; pVX[pIdx] = vx; pVY[pIdx] = vy;

function burst(x, y, n, c) {

const cvs = document.getElementById('screen');

function drawGraph(e, b, t, cur, nb) {

      line(NODE_X[v], NODE_Y[v] + 1, NODE_X[p], NODE_Y[p] + 1, COL_G, 0);

    case ET_INSPECT: S('NEIGHBOR ', LGRAY); nm(nb, WHITE); S('  OLD G=', LGRAY); Dg(evOld[e], COL_G); break;
    case ET_CALCG: S('TENT G=', COL_G); D(sG[b + cur], 2, COL_G); S('+', WHITE); D(evW[e], 1, WHITE);
      S('=', WHITE); D(evTent[e], 2, COL_G); S(' PAID', COL_G); break;
    case ET_COMPARE: D(evTent[e], 2, COL_G); S(' < OLD G ', WHITE); Dg(evOld[e], COL_G); S(' ? ', WHITE);
      if (evRes[e]) S('YES', GRN); else S('NO', RED); break;
    case ET_RELAX: S('G(', COL_G); nm(nb, WHITE); S(')=', COL_G); D(g, 2, COL_G);
      S(' PARENT=', WHITE); nm(cur, WHITE); break;
    case ET_CALCH: S('H(', COL_H); nm(nb, WHITE); S(')=', COL_H);
      D(Math.abs(GX[nb] - GX[TARGET]), 1, COL_H); S('+', WHITE); D(Math.abs(GY[nb] - GY[TARGET]), 1, COL_H);
      S('=', WHITE); D(h, 2, COL_H); S(' ESTIMATE', COL_H); break;
    case ET_CALCF: S('F(', COL_F); nm(nb, WHITE); S(')=', COL_F); S('G', COL_G); D(g, 2, COL_G);
      S('+', WHITE); S('H', COL_H); D(h, 2, COL_H); S('=', WHITE); D(ff, 2, COL_F); break;
    case ET_FAIL: D(evTent[e], 2, COL_G); S(' >= ', WHITE); Dg(evOld[e], COL_G); S('  KEEP OLD PATH', RED); break;
    case ET_SKIP: nm(nb, WHITE); S(' ALREADY CLOSED', GRAY); break;
    case ET_CLOSE: nm(cur, WHITE); S(' EXPANDED  CLOSED=', CYAN); D(sC[c8 + 6], 2, CYAN); break;
    case ET_TARGET: S('T HAS MIN F  G=', WHITE); D(g, 2, COL_G); S(' OPTIMAL', GRN); break;
    case ET_RECON: S('PARENT(', GRN); nm(cur, WHITE); S(')=', GRN);
      if (nb >= 0) nm(nb, WHITE); else S('NONE', WHITE); break;
    case ET_PATH: S('ROUTE ', GRN);
      for (let j = 0; j <= evRes[e]; j++) { nm(pathFwd[j], WHITE); if (j < evRes[e]) S('>', GRN); }
      S(' G=', COL_G); D(g, 2, COL_G); break;
    case ET_DONE:
      for (let j = 0; j < pathLen; j++) { nm(pathFwd[j], WHITE); if (j + 1 < pathLen) S('>', GRN); }
      S(evRes[e] ? '  VERIFIED' : '  MISMATCH', evRes[e] ? GRN : RED); break;
    default: break;
  }

  // ---- line 4: live counters ----
  at(2, 88);
  S('OP', GRAY); D(sC[c8 + 5], 2, WHITE); S(' CL', GRAY); D(sC[c8 + 6], 2, WHITE);
  S(' EX', GRAY); D(sC[c8], 2, WHITE); S(' GN', GRAY); D(sC[c8 + 1], 2, WHITE);
  S(' RL', GRAY); D(sC[c8 + 2], 2, WHITE); S(' RJ', GRAY); D(sC[c8 + 3], 2, WHITE);
}

function drawTitle() {
  rect(0, 0, LW, 8, PANEL); rect(0, 7, LW, 1, UNDB);
  at(2, 1); S('A* SEARCH', WHITE);
  at(42, 1); S('F', COL_F); S('=', WHITE); S('G', COL_G); S('+', WHITE); S('H', COL_H);
  at(68, 1); S('DIJK F=G', GRAY);
  at(102, 1);
  if (paused) S('II', ORG);
  else { const s = speedIdx; if (s === 0) S('X.5', LGRAY); else if (s === 1) S('X1', LGRAY); else if (s === 2) S('X2', LGRAY); else S('X4', LGRAY); }
  at(116, 1); S('SND', sndOn ? GRN : RED);
}

function drawIntro() {
  rect(10, 16, 108, 64, BLACK);
  rect(10, 16, 108, 1, HLT); rect(10, 79, 108, 1, HLT); rect(10, 16, 1, 64, HLT); rect(117, 16, 1, 64, HLT);
  bigText('A* SEARCH', 28, 21, YEL, 2);
  bigText('F=G+H', 44, 33, WHITE, 2);
  at(16, 47); S('G', COL_G); S('=COST ALREADY PAID', COL_G);
  at(16, 53); S('H', COL_H); S('=ESTIMATE TO TARGET', COL_H);
  at(16, 59); S('F', COL_F); S('=G+H  PICK LOWEST F', COL_F);
  at(16, 65); S('S=START  T=TARGET', LGRAY);
  at(16, 72);
  if (!sndOn && ((tick >> 4) & 1)) S('CLICK OR M FOR SOUND', PALE);
}

function render() {
  const e = ci, b = e * N, t = evT[e], cur = evCur[e], nb = evNb[e];
  rect(0, 0, LW, LH, BG);
  drawGraph(e, b, t, cur, nb);
  drawQueue(e, b, t, nb);
  drawBottom(e, b, t, cur, nb);
  drawTitle();
  // particles (positions snapped to the logical pixel grid)
  for (let i = 0; i < PMAX; i++) {
    if (pLife[i] <= 0 || pDelay[i] > 0) continue;
    const x = Math.floor(pX[i]), y = Math.floor(pY[i]);
    if (x < 0 || y < 0 || x >= LW || y >= LH) continue;
    rect(x, y, 1, 1, pCol[i]);
  }
  if (phase === 0) drawIntro();
  if (phase === 3) {                                  // reset wipe: scanlines sweep down
    const h = Math.floor(LH * (RESET_FRAMES - timer) / RESET_FRAMES);
    for (let y = 0; y < h; y += 2) rect(0, y, LW, 1, y & 2 ? PANEL : UNDB);
    at(44, 44); S('RESET', WHITE);
  }
  // blit at the largest integer scale, centred, no smoothing
  dctx.fillStyle = PAL[BG]; dctx.fillRect(0, 0, cvs.width, cvs.height);
  dctx.drawImage(off, 0, 0, LW, LH, offX, offY, LW * scale, LH * scale);
}

/* =====================================================================
   19. RESIZE / DISPLAY SCALING
   ===================================================================== */
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cvs.width = Math.max(LW, Math.floor(window.innerWidth * dpr));
  cvs.height = Math.max(LH, Math.floor(window.innerHeight * dpr));
  scale = Math.max(1, Math.floor(Math.min(cvs.width / LW, cvs.height / LH)));
  offX = (cvs.width - LW * scale) >> 1;
  offY = (cvs.height - LH * scale) >> 1;
  dctx.imageSmoothingEnabled = false;
}

/* =====================================================================
   20. INPUT / SOUND TOGGLE
   click or M: enable / mute sound   SPACE: pause   1-4: speed   R: restart
   ===================================================================== */
function toggleSound() {
  if (!AC) { initAudio(); sndOn = !!AC; }
  else sndOn = !sndOn;
  if (AC && AC.state === 'suspended') AC.resume();
  if (sndOn) tone(mtof(84), 0.06, 'square', 0.4, 0);
}
function restart() {
  rng = 12345; clearParticles(); runAStar(); ci = 0; phase = 0; timer = INTRO_AGAIN;
  tone(mtof(60), 0.1, 'square', 0.4, 0, mtof(84));
}
window.addEventListener('click', toggleSound);
window.addEventListener('keydown', function (ev) {
  const k = ev.key;
  if (k === ' ') { paused = !paused; ev.preventDefault(); }
  else if (k === 'm' || k === 'M') toggleSound();
  else if (k === '1') speedIdx = 0;
  else if (k === '2') speedIdx = 1;
  else if (k === '3') speedIdx = 2;
  else if (k === '4') speedIdx = 3;
  else if (k === 'r' || k === 'R') restart();
});
window.addEventListener('resize', resize);

/* =====================================================================
   21. MAIN LOOP
   Fixed 60 Hz simulation step; rendering at display rate. Speed keys only
   change how many simulation ticks are consumed, never the algorithm.
   ===================================================================== */
let lastTs = 0, acc = 0;
function frame(ts) {
  if (!lastTs) lastTs = ts;
  let dt = ts - lastTs; lastTs = ts;
  if (dt > 100) dt = 100;
  acc += dt;
  while (acc >= STEP_MS) {
    acc -= STEP_MS;
    if (!paused) {
      subAcc += SPEEDS[speedIdx];
      while (subAcc >= 1) { subAcc -= 1; update(); }
    }
  }
  render();
  window.requestAnimationFrame(frame);
}

window.__ASTAR = {                    // read-only introspection (used for testing)
  verify: devVerify,
  events: function () { return evCount; },
  path: function () { return Array.prototype.slice.call(pathFwd, 0, pathLen).map(function (n) { return NAMES[n]; }).join(''); },
  cost: function () { return pathCost; },
  gTarget: function () { return gA[TARGET]; },
  expanded: function () { return cExp; },
  loops: function () { return loops; },
  phase: function () { return phase; }
};

runAStar();
resize();
window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
