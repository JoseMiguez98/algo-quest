<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BFS - Pixel Visualizer</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas#screen{position:fixed;left:0;top:0;width:100vw;height:100vh;
    image-rendering:pixelated;image-rendering:crisp-edges;display:block}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
'use strict';
/* =====================================================================
   BFS PIXEL VISUALIZER
   Three layers:
     1. ALGORITHM  - runBFS() executes a genuine BFS and writes an event stream.
     2. ANIMATION  - applyEvent() replays that stream into a "view state".
     3. RENDERING  - draw*() only reads the view state.
   The view state is rebuilt ONLY from events, and at BFS_COMPLETE it is
   compared against the algorithm's own final state (assertions).
   ===================================================================== */

/* ---------- 1. CONSTANTS / PALETTE ---------- */
const DEV = true;                 // development-time assertions: fail visibly
const W = 128, H = 96;            // logical resolution
// Fixed 24-color palette. Every pixel on screen comes from here.
const PAL = [
  '#0a0a1c', /*0  BG            */ '#12122e', /*1  PANEL         */
  '#1e2a5e', /*2  UNVISITED     */ '#34449a', /*3  UNVISITED EDGE*/
  '#5b3f96', /*4  QUEUED        */ '#9a78e0', /*5  QUEUED BORDER */
  '#ffe14a', /*6  CURRENT       */ '#ff9a2e', /*7  INSPECTING    */
  '#2ad8e0', /*8  CYAN          */ '#1a7f8c', /*9  PROCESSED     */
  '#4ce06e', /*10 GREEN         */ '#1a6e38', /*11 DARK GREEN    */
  '#ffffff', /*12 WHITE         */ '#c0c0d4', /*13 LIGHT GRAY    */
  '#6a6a88', /*14 GRAY          */ '#ff4a6a', /*15 RED/PINK      */
  '#7a1f4a', /*16 DARK RED      */ '#2a3268', /*17 EDGE DIM      */
  '#6a7ae0', /*18 EDGE LIT      */ '#f79aff', /*19 PINK          */
  '#ffd0a0', /*20 TAN           */ '#b85a1a', /*21 DARK ORANGE   */
  '#7ac8ff', /*22 SKY           */ '#05050c'  /*23 NEAR BLACK    */
];
const C_BG=0,C_PANEL=1,C_UNV=2,C_UNVB=3,C_QUE=4,C_QUEB=5,C_CUR=6,C_INSP=7,C_PROC=8,C_PROCD=9,
      C_GRN=10,C_GRND=11,C_WHITE=12,C_LGRAY=13,C_GRAY=14,C_RED=15,C_DRED=16,C_EDGE=17,C_EDGEL=18,
      C_PINK=19,C_TAN=20,C_DORANGE=21,C_SKY=22,C_BLK=23;
// One color per BFS distance (level). Index = distance from START.
const LEVEL_COL = new Uint8Array([C_WHITE,C_GRN,C_PROC,C_SKY,C_PINK,C_TAN,C_INSP,C_CUR]);
function LC(d){ return d < 0 ? C_GRAY : LEVEL_COL[d > 7 ? 7 : d]; }

/* ---------- 2. GRAPH DEFINITION (fixed, deterministic) ---------- */
// 18 nodes A..R. Positions are integer logical-pixel centres. Fixed layout.
const N = 18, START = 0;
const NX = new Int16Array([ 8, 24,24,24, 40,40,40,40, 56,56,56,56, 72,72,72,72, 88,88]);
const NY = new Int16Array([37, 19,37,55, 14,28,42,58, 14,28,42,58, 14,28,42,58, 21,50]);
const EDGES = [
  [0,1],[0,2],[0,3],[1,2],[2,3],
  [1,4],[1,5],[2,5],[2,6],[3,6],[3,7],
  [4,8],[5,9],[5,8],[6,10],[6,9],[7,11],[7,10],
  [8,9],[10,11],
  [8,12],[9,13],[10,14],[11,15],[10,13],
  [12,13],[13,14],[14,15],
  [12,16],[13,16],[14,17],[15,17],[16,17]
];
const NE = EDGES.length;
const EA = new Int8Array(NE), EB = new Int8Array(NE);
const adjMat = new Uint8Array(N * N);       // for edge-existence assertions
const adjStart = new Uint8Array(N + 1);
const adjList = new Int8Array(NE * 2);
(function buildGraph(){
  const tmp = [];
  for (let i = 0; i < N; i++) tmp.push([]);
  for (let k = 0; k < NE; k++) {
    const a = EDGES[k][0], b = EDGES[k][1];
    EA[k] = a; EB[k] = b;
    adjMat[a*N+b] = 1; adjMat[b*N+a] = 1;
    tmp[a].push(b); tmp[b].push(a);
  }
  // DETERMINISTIC NEIGHBOR ORDER: clockwise starting at UP -> RIGHT -> DOWN -> LEFT,
  // measured from the node's on-screen position. Ties broken by node id.
  for (let i = 0; i < N; i++) {
    const ang = (j) => { let a = Math.atan2(NX[j]-NX[i], -(NY[j]-NY[i])); if (a < 0) a += Math.PI*2; return a; };
    tmp[i].sort((p, q) => (ang(p) - ang(q)) || (p - q));
  }
  let p = 0;
  for (let i = 0; i < N; i++) { adjStart[i] = p; for (const j of tmp[i]) adjList[p++] = j; }
  adjStart[N] = p;
})();

/* ---------- 3. BFS ALGORITHM + 4. EVENT GENERATION ---------- */
const E_BFS_START=0, E_ENQ_START=1, E_DEQUEUE=2, E_VISIT=3, E_INSPECT=4, E_DISCOVER=5,
      E_ENQUEUE=6, E_SKIP=7, E_FINISH=8, E_LV_DONE=9, E_LV_START=10, E_COMPLETE=11;
const EV_STRIDE = 6, MAXEV = 1024;
// event layout: [type, node, aux, dist, queueSize, extra]
const EV = new Int16Array(MAXEV * EV_STRIDE);
let evCount = 0;
let fatal = null;                                  // assertion failure message
function ASSERT(c, m){ if (DEV && !c && !fatal) fatal = m; }
function emit(t, n, a, d, q, x){
  if (evCount >= MAXEV) { ASSERT(false, 'EVENT BUFFER FULL'); return; }
  const o = evCount * EV_STRIDE;
  EV[o]=t; EV[o+1]=n; EV[o+2]=a; EV[o+3]=d; EV[o+4]=q; EV[o+5]=x;
  evCount++;
}

/* ---------- 5. QUEUE STATE + 6. DISTANCE / LEVEL STATE (algorithm side) ---------- */
const visited = new Uint8Array(N);
const dist    = new Int8Array(N);
const parent  = new Int8Array(N);
const queue   = new Int8Array(N + 1);   // linear FIFO: each node is enqueued at most once
const order   = new Int8Array(N);
const enqLog  = new Int8Array(N);
const enqd    = new Uint8Array(N);
const seen    = new Uint8Array(N);
let qHead = 0, qTail = 0, orderLen = 0, cntEnq = 0, cntDeq = 0, maxQ = 0;

function runBFS(){
  visited.fill(0); dist.fill(-1); parent.fill(-1); enqd.fill(0); seen.fill(0);
  qHead = 0; qTail = 0; orderLen = 0; cntEnq = 0; cntDeq = 0; maxQ = 0; evCount = 0;

  emit(E_BFS_START, START, -1, 0, 0, 0);
  // mark START visited AT ENQUEUE TIME, then enqueue it
  visited[START] = 1; dist[START] = 0;
  queue[qTail++] = START; enqLog[cntEnq++] = START; enqd[START] = 1;
  maxQ = 1;
  emit(E_ENQ_START, START, -1, 0, qTail - qHead, cntEnq);

  let level = -1;                                   // level currently being processed
  while (qHead < qTail) {                           // while queue is not empty
    // LEVEL TRANSITIONS come from the algorithm: the FRONT of the FIFO queue
    // has a larger distance than the level we were processing -> level exhausted.
    const front = queue[qHead];
    if (dist[front] !== level) {
      if (level >= 0) emit(E_LV_DONE, -1, -1, level, qTail - qHead, 0);
      level = dist[front];
      // BFS invariant: right now every queued node is at distance == level
      for (let k = qHead; k < qTail; k++) ASSERT(dist[queue[k]] === level, 'MIXED LEVELS IN QUEUE');
      emit(E_LV_START, -1, -1, level, qTail - qHead, qTail - qHead);  // extra = nodes in this level
    }

    const cur = queue[qHead++];                     // DEQUEUE from FRONT (FIFO)
    ASSERT(cur === enqLog[cntDeq], 'FIFO ORDER VIOLATED');
    cntDeq++;
    emit(E_DEQUEUE, cur, -1, dist[cur], qTail - qHead, cntDeq);

    ASSERT(!seen[cur], 'DUPLICATE IN TRAVERSAL'); seen[cur] = 1;
    order[orderLen++] = cur;                        // process current
    emit(E_VISIT, cur, orderLen - 1, dist[cur], qTail - qHead, 0);

    for (let k = adjStart[cur]; k < adjStart[cur+1]; k++) {   // deterministic neighbor order
      const nb = adjList[k];
      ASSERT(adjMat[cur*N+nb] === 1, 'EDGE NOT IN GRAPH');
      emit(E_INSPECT, cur, nb, dist[cur], qTail - qHead, 0);
      if (!visited[nb]) {
        // Mark VISITED WHEN ENQUEUED (not when dequeued): this guarantees a node
        // can never be inserted twice, even if two queued nodes share a neighbor.
        visited[nb] = 1;
        dist[nb] = dist[cur] + 1;                   // distance = parent distance + 1
        parent[nb] = cur;
        emit(E_DISCOVER, nb, cur, dist[nb], qTail - qHead, 0);
        ASSERT(!enqd[nb], 'NODE ENQUEUED TWICE'); enqd[nb] = 1;
        queue[qTail++] = nb; enqLog[cntEnq++] = nb;  // ENQUEUE at BACK
        if (qTail - qHead > maxQ) maxQ = qTail - qHead;
        emit(E_ENQUEUE, nb, cur, dist[nb], qTail - qHead, cntEnq);
      } else {
        emit(E_SKIP, nb, cur, dist[nb], qTail - qHead, 0);
      }
    }
    emit(E_FINISH, cur, -1, dist[cur], qTail - qHead, 0);
  }
  emit(E_LV_DONE, -1, -1, level, 0, 0);
  emit(E_COMPLETE, -1, -1, level, 0, orderLen);

  // post-run invariants
  ASSERT(orderLen === N, 'GRAPH NOT FULLY REACHED');
  for (let i = 0; i < N; i++) {
    ASSERT(visited[i] === 1, 'NODE NOT VISITED');
    if (i !== START) ASSERT(dist[i] === dist[parent[i]] + 1, 'DIST != PARENT+1');
  }
  ASSERT(dist[START] === 0, 'START DIST != 0');
  ASSERT(cntEnq === cntDeq && cntEnq === N, 'ENQ/DEQ COUNT');
}

/* ---------- 7. ANIMATION STATE (view state, rebuilt only from events) ---------- */
const EV_DELAY = new Uint8Array([30,14,10,8,6,7,8,6,4,20,14,60]);   // frames @60Hz per event
const EV_NAME  = ['START','ENQ SRC','DEQUEUE','VISIT','CHECK','FOUND','ENQUEUE','SKIP','DONE','LV DONE','NEW LV','FINISH'];
const EV_COL   = new Uint8Array([C_WHITE,C_GRN,C_CUR,C_CUR,C_INSP,C_PINK,C_GRN,C_RED,C_PROC,C_SKY,C_SKY,C_WHITE]);

const vState = new Uint8Array(N);   // 0 unvisited, 1 discovered/queued, 2 current, 3 processed
const vDist  = new Int8Array(N);
const vPar   = new Int8Array(N);
const vQ     = new Int8Array(N + 1);
const vOrder = new Int8Array(N);
let vqLen=0, vCur=-1, vNb=-1, vNbKind=0, vEdgeA=-1, vEdgeB=-1, vVisited=0, vOrderLen=0,
    vEnq=0, vDeq=0, vMaxQ=0, vLevel=-1, vLevelNodes=0, vDone=0, evName=-1;
let qShift=0, qFlash=0, skipT=0, pulseT=0, pulseLevel=0;
let evIdx=0, evWait=0;
let phase=0, phT=0, paused=false, frameNo=0, speedMul=1, resMaxD=0, resCursor=0, resPrev=-1;
// caption
const CAP_NONE=0,CAP_START=1,CAP_DEQ=2,CAP_VISIT=3,CAP_INS_U=4,CAP_INS_V=5,CAP_DISC=6,CAP_ENQ=7,
      CAP_SKIP=8,CAP_FIN=9,CAP_LVS=10,CAP_LVD=11,CAP_DONE=12;
let capKind=0, capA=0, capB=0;

const QX0 = 4, QPITCH = 10, QY = 75;      // queue slot geometry
function slotCX(i){ return QX0 + i*QPITCH + 4; }

function resetView(){
  vState.fill(0); vDist.fill(-1); vPar.fill(-1);
  vqLen=0; vCur=-1; vNb=-1; vNbKind=0; vEdgeA=-1; vEdgeB=-1; vVisited=0; vOrderLen=0;
  vEnq=0; vDeq=0; vMaxQ=0; vLevel=-1; vLevelNodes=0; vDone=0; evName=-1;
  qShift=0; qFlash=0; skipT=0; pulseT=0; capKind=CAP_NONE;
  evIdx=0; evWait=0; resCursor=0; resPrev=-1;
  for (let i = 0; i < NP; i++) pLife[i] = 0;
}
function resetAll(){ runBFS(); resetView(); rs = 0x1234567; }

// Replays ONE algorithm event into the view state and fires its effects.
// Sounds/particles are triggered HERE, exactly when the event is played, so audio
// and visuals are synchronized with the algorithm, never with frame counts.
function applyEvent(i){
  const o = i*EV_STRIDE;
  const t=EV[o], n=EV[o+1], a=EV[o+2], d=EV[o+3], qs=EV[o+4], x=EV[o+5];
  evName = t; evWait = EV_DELAY[t];
  switch (t) {
    case E_BFS_START:
      capKind = CAP_NONE; sfx(0); break;
    case E_ENQ_START:
      vState[n]=1; vDist[n]=d; vVisited++; vQ[vqLen++]=n; vEnq++;
      if (vqLen > vMaxQ) vMaxQ = vqLen;
      ASSERT(vqLen === qs && vEnq === x, 'REPLAY QUEUE DESYNC');
      capKind=CAP_START; capA=n;
      burst(NX[n],NY[n],C_WHITE,8); stream(NX[n],NY[n],slotCX(vqLen-1),QY+4,C_GRN,5); qFlash=10; sfx(1);
      break;
    case E_LV_START:
      vLevel=d; vLevelNodes=x; capKind=CAP_LVS; capA=d; capB=x; pulseLevel=d; sfx(8); break;
    case E_DEQUEUE:
      ASSERT(vqLen > 0 && vQ[0] === n, 'DEQUEUED NODE != FRONT');
      for (let k = 1; k < vqLen; k++) vQ[k-1] = vQ[k];
      vqLen--; vDeq++; vCur = n; vNb = -1; vEdgeA = -1; vEdgeB = -1; vState[n] = 2;
      ASSERT(vqLen === qs && vDeq === x, 'REPLAY QUEUE DESYNC');
      qShift = QPITCH; capKind=CAP_DEQ; capA=n; capB=vDist[n];
      stream(slotCX(0),QY+4,NX[n],NY[n],C_CUR,5); sfx(2);
      break;
    case E_VISIT:
      vOrder[a]=n; vOrderLen=a+1; capKind=CAP_VISIT; capA=n; capB=a;
      burst(NX[n],NY[n],C_CUR,8); break;
    case E_INSPECT:
      vNb=a; vEdgeA=n; vEdgeB=a; vNbKind = vState[a] === 0 ? 0 : 1;
      capKind = vNbKind === 0 ? CAP_INS_U : CAP_INS_V; capA=a; sfx(4);
      break;
    case E_DISCOVER:
      ASSERT(vState[n] === 0, 'DISCOVERED A VISITED NODE');
      vState[n]=1; vDist[n]=d; vPar[n]=a; vVisited++; vNbKind=2;
      capKind=CAP_DISC; capA=n; capB=d;
      burst(NX[n],NY[n],C_PINK,8); sfx(3);
      break;
    case E_ENQUEUE:
      vQ[vqLen++]=n; vEnq++; if (vqLen > vMaxQ) vMaxQ = vqLen;
      ASSERT(vqLen === qs && vEnq === x, 'REPLAY QUEUE DESYNC');
      capKind=CAP_ENQ; capA=n; qFlash=10;
      stream(NX[n],NY[n],slotCX(vqLen-1),QY+4,C_GRN,5); sfx(1);
      break;
    case E_SKIP:
      capKind=CAP_SKIP; capA=n; skipT=12; burst(NX[n],NY[n],C_RED,3); sfx(5); break;
    case E_FINISH:
      vState[n]=3; vNb=-1; vEdgeA=-1; vEdgeB=-1; capKind=CAP_FIN; capA=n; break;
    case E_LV_DONE:
      capKind=CAP_LVD; capA=d; pulseLevel=d; pulseT=18;
      for (let k = 0; k < N; k++) if (vDist[k] === d) burst(NX[k],NY[k],LC(d),4);
      sfx(6);
      break;
    case E_COMPLETE:
      vDone=1; vCur=-1; capKind=CAP_DONE;
      // cross-check: the replayed view must equal the algorithm's own final state
      ASSERT(vOrderLen === orderLen, 'ORDER LEN MISMATCH');
      for (let k = 0; k < orderLen; k++) ASSERT(vOrder[k] === order[k], 'ORDER MISMATCH');
      for (let k = 0; k < N; k++) ASSERT(vDist[k] === dist[k], 'DIST MISMATCH');
      ASSERT(vEnq === cntEnq && vDeq === cntDeq && vMaxQ === maxQ, 'COUNTER MISMATCH');
      for (let k = 0; k < N; k++) burst(NX[k],NY[k],LC(vDist[k]),4);
      sfx(7);
      break;
  }
}

/* ---------- 8. AUDIO ENGINE (Web Audio, NES-style, procedural) ---------- */
// (Background music intentionally omitted: event sounds are what matters.)
let actx = null, master = null, noiseBuf = null, soundOn = true;
function initAudio(){
  try {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0.16; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate >> 2, actx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    let s = 1; for (let i = 0; i < ch.length; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; ch[i] = (s / 0x3fffffff) - 1; }
  } catch (e) { actx = null; }
}
// short envelope voice: square / triangle, optional pitch slide
function tone(f, dur, type, vol, off, slideTo){
  const t = actx.currentTime + off;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, off){
  const t = actx.currentTime + off;
  const s = actx.createBufferSource(), g = actx.createGain();
  s.buffer = noiseBuf; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
/* ---------- 13. AUDIO EVENT DISPATCH ---------- */
// 0 start, 1 enqueue, 2 dequeue, 3 discover, 4 inspect tick, 5 skip, 6 level done,
// 7 complete, 8 level start, 9 reset
function sfx(k){
  if (!actx || !soundOn) return;
  switch (k) {
    case 0: tone(523,.07,'square',.5,0); tone(659,.07,'square',.5,.07); tone(784,.07,'square',.5,.14); tone(1047,.12,'square',.5,.21); break;
    case 1: tone(1480,.06,'square',.45,0,1760); break;
    case 2: tone(900,.08,'square',.45,0,500); break;
    case 3: tone(988,.05,'square',.45,0); tone(1319,.07,'square',.45,.05); break;
    case 4: tone(2400,.015,'square',.10,0); break;
    case 5: tone(180,.08,'triangle',.55,0,140); break;
    case 6: tone(440,.06,'square',.4,0); tone(554,.06,'square',.4,.06); tone(659,.06,'square',.4,.12); tone(880,.1,'square',.4,.18); break;
    case 7: {
      const m = [523,659,784,1047,784,1047,1319];
      for (let i = 0; i < m.length; i++) tone(m[i], i === 6 ? .3 : .09, 'square', .45, i*.1);
      tone(262,.35,'triangle',.6,0); tone(392,.5,'triangle',.6,.35);
      break; }
    case 8: tone(784,.08,'square',.35,0); break;
    case 9: tone(800,.25,'square',.4,0,200); noise(.18,.3,0); break;
  }
}

/* ---------- 9. PARTICLE POOL (preallocated, allocation-free) ---------- */
const NP = 256;
const pX = new Int32Array(NP), pY = new Int32Array(NP), pVX = new Int32Array(NP), pVY = new Int32Array(NP);
const pLife = new Uint8Array(NP), pCol = new Uint8Array(NP);
let pNext = 0;
let rs = 0x1234567;                                   // deterministic xorshift RNG
function rnd(){ rs ^= rs << 13; rs ^= rs >>> 17; rs ^= rs << 5; return rs >>> 0; }
const DX8 = new Int8Array([1,1,0,-1,-1,-1,0,1]), DY8 = new Int8Array([0,1,1,1,0,-1,-1,-1]);
function spawn(x, y, vx, vy, life, col){
  let j = pNext;
  for (let k = 0; k < NP; k++) { if (pLife[j] === 0) break; j = (j + 1) % NP; }
  pNext = (j + 1) % NP;
  pX[j]=x<<8; pY[j]=y<<8; pVX[j]=vx; pVY[j]=vy; pLife[j]=life; pCol[j]=col;
}
function burst(x, y, col, n){
  for (let k = 0; k < n; k++) {
    const r = rnd(), a = r & 7, sp = 90 + ((r >> 4) & 63);
    spawn(x, y, DX8[a]*sp, DY8[a]*sp, 8 + ((r >> 10) & 7), col);
  }
}
function stream(x0, y0, x1, y1, col, n){        // particles travelling from A to B
  for (let k = 0; k < n; k++) {
    const life = 10 + k * 2;
    spawn(x0, y0, ((x1 - x0) * 256 / life) | 0, ((y1 - y0) * 256 / life) | 0, life, col);
  }
}
function updateParticles(){
  for (let j = 0; j < NP; j++) if (pLife[j] > 0) { pX[j] += pVX[j]; pY[j] += pVY[j]; pLife[j]--; }
}

/* ---------- 11. PIXEL ART RENDERING (primitives) ---------- */
const screen = document.getElementById('screen');
const sctx = screen.getContext('2d', { alpha: false });
const off = document.createElement('canvas'); off.width = W; off.height = H;
const ctx = off.getContext('2d', { alpha: false });
let curCol = -1;
function setCol(c){ if (c !== curCol) { ctx.fillStyle = PAL[c]; curCol = c; } }
function px(x, y, c){ if (x < 0 || y < 0 || x >= W || y >= H) return; setCol(c); ctx.fillRect(x, y, 1, 1); }
function rect(x, y, w, h, c){ setCol(c); ctx.fillRect(x, y, w, h); }
function frame(x, y, w, h, c){ setCol(c); ctx.fillRect(x,y,w,1); ctx.fillRect(x,y+h-1,w,1); ctx.fillRect(x,y,1,h); ctx.fillRect(x+w-1,y,1,h); }
function ditherFrame(x, y, w, h, c, ph){       // checkerboard outline
  setCol(c);
  for (let i = 0; i < w; i++) { if (((i + ph) & 1) === 0) { ctx.fillRect(x+i,y,1,1); ctx.fillRect(x+i,y+h-1,1,1); } }
  for (let j = 1; j < h - 1; j++) { if (((j + ph) & 1) === 0) { ctx.fillRect(x,y+j,1,1); ctx.fillRect(x+w-1,y+j,1,1); } }
}
function line(x0, y0, x1, y1, c){               // Bresenham: crisp, no anti-aliasing
  setCol(c);
  const dx = Math.abs(x1-x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1-y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    ctx.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function line2(x0, y0, x1, y1, c){               // 2px-thick highlight
  line(x0, y0, x1, y1, c);
  if (Math.abs(x1-x0) >= Math.abs(y1-y0)) line(x0, y0+1, x1, y1+1, c); else line(x0+1, y0, x1+1, y1, c);
}

// 3x5 pixel font
const FONT = new Uint16Array(128);
(function(){
  const defs = [
    ['A','010101111101101'],['B','110101110101110'],['C','011100100100011'],['D','110101101101110'],
    ['E','111100110100111'],['F','111100110100100'],['G','011100101101011'],['H','101101111101101'],
    ['I','111010010010111'],['J','001001001101010'],['K','101101110101101'],['L','100100100100111'],
    ['M','101111111101101'],['N','111101101101101'],['O','010101101101010'],['P','110101110100100'],
    ['Q','010101101110011'],['R','110101110101101'],['S','011100010001110'],['T','111010010010010'],
    ['U','101101101101111'],['V','101101101101010'],['W','101101111111101'],['X','101101010101101'],
    ['Y','101101010010010'],['Z','111001010100111'],
    ['0','111101101101111'],['1','010110010010111'],['2','110001010100111'],['3','110001110001110'],
    ['4','101101111001001'],['5','111100110001110'],['6','011100111101111'],['7','111001010010010'],
    ['8','111101111101111'],['9','111101111001110'],
    ['-','000000111000000'],['>','100010001010100'],['<','001010100010001'],[':','000010000010000'],
    ['/','001001010100100'],['?','110001010000010'],['!','010010010000010'],['.','000000000000010'],
    ['+','000010111010000'],['=','000111000111000'],['#','101111101111101'],['[','110100100100110'],
    [']','011001001001011'],['_','000000000000111'],['^','010101000000000']
  ];
  for (let i = 0; i < defs.length; i++) FONT[defs[i][0].charCodeAt(0)] = parseInt(defs[i][1], 2);
})();
function glyph(code, x, y, c, sc){
  if (code >= 97 && code <= 122) code -= 32;
  const g = FONT[code & 127]; if (!g) return;
  setCol(c);
  for (let r = 0; r < 5; r++) for (let k = 0; k < 3; k++)
    if (g & (1 << (14 - (r*3 + k)))) ctx.fillRect(x + k*sc, y + r*sc, sc, sc);
}
// text cursor helpers (allocation-free: literals in, digits/letters by code)
let tcx = 0, tcy = 0, tcol = 12;
function at(x, y, c){ tcx = x; tcy = y; tcol = c; }
function ts(s){ for (let i = 0; i < s.length; i++) { glyph(s.charCodeAt(i), tcx, tcy, tcol, 1); tcx += 4; } }
function tc(code){ glyph(code, tcx, tcy, tcol, 1); tcx += 4; }
function tn(n){ if (n < 0) { ts('-'); return; } if (n >= 10) tc(48 + ((n / 10) | 0)); tc(48 + (n % 10)); }
function textBig(s, x, y, sc, c){ for (let i = 0; i < s.length; i++) { glyph(s.charCodeAt(i), x, y, c, sc); x += 4*sc; } }
function centerX(len, sc){ return (W - (len*4*sc - sc)) >> 1; }

/* ---------- 12. HUD / SCENE RENDERING ---------- */
function drawTopBar(){
  rect(0, 0, W, 7, C_PANEL); rect(0, 7, W, 1, C_EDGE);
  at(2, 1, C_WHITE); ts('BFS');
  at(22, 1, C_GRAY); ts('LEVEL');
  for (let d = 0; d < 6; d++) {
    const x = 46 + d*8;
    glyph(48 + d, x, 1, LC(d), 1);
    if (vLevel === d && !vDone) rect(x, 6, 3, 1, LC(d));
  }
  if (!actx) { if ((frameNo >> 5) & 1) { at(108, 1, C_GRAY); ts('SND?'); } }
  else if (soundOn) { at(108, 1, C_GRN); ts('SND'); }
  else { at(108, 1, C_RED); ts('MUTE'); }
}

function drawGraph(){
  // faint dot grid (background atmosphere)
  setCol(C_PANEL);
  for (let y = 10; y < 62; y += 8) for (let x = 4; x < 96; x += 8) ctx.fillRect(x, y, 1, 1);

  // level-pulse sweep (triggered by LEVEL_COMPLETE)
  if (pulseT > 0) {
    const sx = (18 - pulseT) * 5 + 2, col = LC(pulseLevel);
    setCol(col);
    for (let y = 9; y < 62; y++) if ((y & 1) === 0) { ctx.fillRect(sx, y, 1, 1); if (sx > 0) ctx.fillRect(sx-1, y+1 > 61 ? y : y+1, 1, 1); }
  }

  // edges
  for (let k = 0; k < NE; k++) {
    const a = EA[k], b = EB[k];
    let c = C_EDGE;
    if (vState[a] && vState[b]) c = C_UNVB;
    if (vPar[a] === b || vPar[b] === a) c = C_EDGEL;
    line(NX[a], NY[a], NX[b], NY[b], c);
  }
  if (vEdgeA >= 0) {                                    // edge being inspected
    if (vNbKind === 1) { if (skipT === 0 || (skipT & 2)) line2(NX[vEdgeA], NY[vEdgeA], NX[vEdgeB], NY[vEdgeB], C_RED); }
    else line2(NX[vEdgeA], NY[vEdgeA], NX[vEdgeB], NY[vEdgeB], C_INSP);
  }

  // START marker (blinking arrow left of START node)
  if ((frameNo >> 4) & 1) { px(0,35,C_WHITE); px(0,39,C_WHITE); px(1,36,C_WHITE); px(1,38,C_WHITE); px(2,37,C_WHITE); }

  // nodes
  const ph = (frameNo >> 3) & 1;
  for (let i = 0; i < N; i++) {
    const x0 = NX[i] - 4, y0 = NY[i] - 3, st = vState[i];
    let fill = C_UNV, border = C_UNVB, tl = C_LGRAY, td = C_BLK;
    if (st === 1) { fill = C_QUE; border = LC(vDist[i]); tl = C_WHITE; td = LC(vDist[i]); }
    else if (st === 2) { fill = C_CUR; border = C_WHITE; tl = C_BLK; td = C_BLK; }
    else if (st === 3) { fill = C_PROCD; border = LC(vDist[i]); tl = C_WHITE; td = LC(vDist[i]); }
    if (i === START && st === 0) border = C_WHITE;
    if (i === vNb) {
      if (vNbKind === 1) border = (skipT > 0 && !(skipT & 2)) ? C_DRED : C_RED;
      else border = C_INSP;
    }
    // halo: nodes of the level BFS is currently working through (from real distances)
    if (!vDone && vLevel >= 0 && st !== 0 && vDist[i] === vLevel && st !== 3) ditherFrame(x0 - 2, y0 - 2, 13, 11, C_GRND, ph);
    rect(x0, y0, 9, 7, fill);
    frame(x0, y0, 9, 7, border);
    glyph(65 + i, x0 + 1, y0 + 1, tl, 1);
    if (st !== 0) glyph(48 + vDist[i], x0 + 5, y0 + 1, td, 1);
    if (i === vCur) ditherFrame(x0 - 2, y0 - 2, 13, 11, C_CUR, ph);              // current node marker
    if (i === vNb && vNbKind !== 1) ditherFrame(x0 - 2, y0 - 2, 13, 11, C_INSP, 1 - ph);
  }

  // particles
  for (let j = 0; j < NP; j++) {
    if (pLife[j] === 0) continue;
    if (pLife[j] < 3 && (frameNo & 1)) continue;
    px(pX[j] >> 8, pY[j] >> 8, pCol[j]);
  }
}

function drawHUD(){
  rect(98, 9, 30, 59, C_PANEL); frame(98, 9, 30, 59, C_UNVB);
  rect(99, 10, 28, 7, C_EDGE);
  if (evName >= 0) { at(100, 11, EV_COL[evName]); ts(EV_NAME[evName]); }
  at(100, 19, C_GRAY); ts('CUR:'); tcol = C_CUR; if (vCur >= 0) tc(65 + vCur); else ts('-');
  at(100, 25, C_GRAY); ts('DST:'); tcol = vCur >= 0 ? LC(vDist[vCur]) : C_GRAY; if (vCur >= 0) tn(vDist[vCur]); else ts('-');
  at(100, 31, C_GRAY); ts('V:'); tcol = C_PROC; tn(vVisited); tcol = C_GRAY; ts('/'); tn(N);
  at(100, 37, C_GRAY); ts('Q:'); tcol = C_GRN; tn(vqLen); tcol = C_GRAY; ts('/'); tn(vMaxQ);
  at(100, 43, C_GRAY); ts('ENQ:'); tcol = C_WHITE; tn(vEnq);
  at(100, 49, C_GRAY); ts('DEQ:'); tcol = C_WHITE; tn(vDeq);
  at(100, 55, C_GRAY); ts('LV:'); tcol = LC(vLevel);
  if (vLevel >= 0) { tn(vLevel); tcol = C_GRAY; ts('>'); if (vDone) ts('-'); else { tcol = LC(vLevel + 1); tn(vLevel + 1); } } else ts('-');
  at(100, 61, C_GRAY); ts('IN:'); tcol = C_WHITE; if (vLevel >= 0) tn(vLevelNodes); else ts('-');
}

function drawCaption(){
  at(1, 63, C_LGRAY);
  switch (capKind) {
    case CAP_START: tcol = C_GRN; ts('MARK+ENQUEUE START '); tc(65 + capA); break;
    case CAP_DEQ:   tcol = C_CUR; ts('DEQUEUE FRONT '); tc(65 + capA); ts(' DIST '); tn(capB); break;
    case CAP_VISIT: tcol = C_CUR; ts('PROCESS '); tc(65 + capA); ts(' ORDER '); tn(capB + 1); break;
    case CAP_INS_U: tcol = C_INSP; ts('CHECK '); tc(65 + capA); ts(': UNVISITED'); break;
    case CAP_INS_V: tcol = C_RED; ts('CHECK '); tc(65 + capA); ts(': VISITED'); break;
    case CAP_DISC:  tcol = C_PINK; ts('MARK '); tc(65 + capA); ts(' VISITED DIST '); tn(capB); break;
    case CAP_ENQ:   tcol = C_GRN; ts('ENQUEUE '); tc(65 + capA); ts(' AT BACK'); break;
    case CAP_SKIP:  tcol = C_RED; tc(65 + capA); ts(' ALREADY VISITED: SKIP'); break;
    case CAP_FIN:   tcol = C_PROC; ts('FINISHED '); tc(65 + capA); break;
    case CAP_LVS:   tcol = C_SKY; ts('LEVEL '); tn(capA); ts(' START: '); tn(capB); ts(' NODES'); break;
    case CAP_LVD:   tcol = C_SKY; ts('LEVEL '); tn(capA); ts(' COMPLETE'); break;
    case CAP_DONE:  tcol = C_WHITE; ts('BFS COMPLETE'); break;
  }
}

function drawQueue(){
  rect(0, 68, W, 1, C_EDGE);
  at(QX0, 70, C_GRAY); ts('FRONT');
  at(80, 70, C_GRAY); ts('FIFO'); tcol = C_UNVB; ts(' IN>OUT');
  for (let i = 0; i < 12; i++) frame(QX0 + i*QPITCH, QY, 9, 9, C_EDGE);       // empty slots
  for (let i = 0; i < vqLen; i++) {
    const n = vQ[i], x = QX0 + i*QPITCH + qShift;
    rect(x, QY, 9, 9, C_QUE);
    frame(x, QY, 9, 9, (i === vqLen - 1 && qFlash > 0 && (qFlash & 2)) ? C_WHITE : (i === 0 ? C_CUR : C_QUEB));
    glyph(65 + n, x + 1, QY + 2, C_WHITE, 1);
    glyph(48 + vDist[n], x + 5, QY + 2, LC(vDist[n]), 1);
  }
  if (vqLen > 0) {                                            // BACK marker under the last slot
    let bx = QX0 + (vqLen - 1) * QPITCH - 3; if (bx > W - 17) bx = W - 17; if (bx < 0) bx = 0;
    px(QX0 + (vqLen - 1) * QPITCH + 4, 85, C_GRN);
    at(bx, 86, C_GRN); ts('BACK');
  } else { at(QX0, 86, C_GRAY); ts('EMPTY'); }
}

function drawOrder(){
  at(1, 91, C_GRAY); ts('ORD:');
  let x = 19;
  for (let i = 0; i < vOrderLen; i++) {
    const n = vOrder[i];
    if (phase === 2 && i === resCursor - 1) { rect(x - 1, 90, 5, 7, C_WHITE); glyph(65 + n, x, 91, C_BLK, 1); }
    else glyph(65 + n, x, 91, LC(vDist[n]), 1);
    x += 4;
  }
}

function drawResults(){
  if (phT < 6 * N + 20) return;
  rect(10, 11, 80, 52, C_PANEL); frame(10, 11, 80, 52, C_WHITE);
  at(14, 14, C_WHITE); ts('BFS DISTANCES');
  for (let L = 0; L <= resMaxD; L++) {
    at(14, 22 + L * 6, LC(L)); ts('L'); tn(L); ts(':');
    for (let i = 0; i < N; i++) if (vDist[i] === L) tc(65 + i);
  }
}

function drawIntro(){
  rect(0, 0, W, H, C_BG);
  const sw = ((frameNo >> 3) & 1);
  textBig('BFS', centerX(3, 5), 14, 5, C_CUR);
  textBig('BFS', centerX(3, 5) + 1, 15, 5, C_DORANGE);
  textBig('BFS', centerX(3, 5), 14, 5, C_CUR);
  at(centerX(20, 1), 46, C_WHITE); ts('BREADTH FIRST SEARCH');
  at(centerX(19, 1), 56, C_GRN); ts('FIFO QUEUE + LEVELS');
  for (let i = 0; i < 6; i++) { const x = 34 + i*10; rect(x, 66, 7, 5, LC(i)); }
  if (((frameNo >> 4) & 1) || sw) { at(centerX(23, 1), 78, C_LGRAY); ts('PRESS ANY KEY FOR SOUND'); }
  at(centerX(25, 1), 88, C_GRAY); ts('M MUTE  SPACE PAUSE  F FAST');
}

function drawWipe(){
  // pixel-art dither wipe: 4x4 blocks, coverage from phT
  const p = phT <= 24 ? phT / 24 : (48 - phT) / 24;
  const thr = (p * 16) | 0;
  setCol(C_BG);
  for (let cy = 0; cy < 24; cy++) for (let cx = 0; cx < 32; cx++)
    if (((cx * 7 + cy * 13) & 15) < thr) ctx.fillRect(cx * 4, cy * 4, 4, 4);
}

function drawFatal(){
  rect(0, 0, W, H, C_DRED);
  at(4, 10, C_WHITE); ts('ASSERTION FAILED');
  at(4, 24, C_CUR); ts(fatal);
  at(4, 40, C_LGRAY); ts('ALGORITHM STATE IS');
  at(4, 46, C_LGRAY); ts('AUTHORITATIVE. STOPPED.');
}

function render(){
  curCol = -1;
  if (fatal) { drawFatal(); return; }
  if (phase === 0) { drawIntro(); return; }
  rect(0, 0, W, H, C_BG);
  drawTopBar();
  drawGraph();
  drawHUD();
  if (phase === 2) {
    if (phT < 6 * N + 20) { at(1, 63, C_WHITE); ts('TRAVERSAL ORDER'); }
    else { at(1, 63, C_WHITE); ts('DISTANCES FROM START'); }
    drawResults();
  } else drawCaption();
  drawQueue();
  drawOrder();
  if (phase === 3) drawWipe();
}

/* ---------- 10. UPDATE LOOP (fixed 60Hz) ---------- */
function update(){
  frameNo++;
  if (fatal || paused) return;
  updateParticles();
  if (qShift > 0) { qShift -= 2; if (qShift < 0) qShift = 0; }
  if (qFlash > 0) qFlash--;
  if (skipT > 0) skipT--;
  if (pulseT > 0) pulseT--;

  if (phase === 0) {                                   // INTRO
    if (++phT >= 180) { phase = 1; phT = 0; evIdx = 0; evWait = 0; }
  } else if (phase === 1) {                            // PLAY: consume the generated event stream
    evWait -= speedMul;
    if (evWait <= 0) {
      if (evIdx < evCount) applyEvent(evIdx++);
      else {
        phase = 2; phT = 0; resCursor = 0; resPrev = -1; resMaxD = 0;
        for (let i = 0; i < N; i++) if (vDist[i] > resMaxD) resMaxD = vDist[i];
      }
    }
  } else if (phase === 2) {                            // RESULT: order, then distances
    phT++;
    resCursor = Math.min(vOrderLen, (phT / 6) | 0);
    if (resCursor !== resPrev) { resPrev = resCursor; if (resCursor > 0) sfx(4); }
    if (phT >= 6 * N + 20 + 220) { phase = 3; phT = 0; }
  } else if (phase === 3) {                            // RESET: wipe, rerun BFS, replay from scratch
    phT++;
    if (phT === 1) sfx(9);
    if (phT === 24) resetAll();
    if (phT >= 48) { phase = 1; phT = 0; evIdx = 0; evWait = 0; }
  }
}

/* ---------- 14. RESIZE / DISPLAY SCALING ---------- */
let scale = 1, ox = 0, oy = 0;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, Math.floor(window.innerWidth * dpr));
  const ch = Math.max(1, Math.floor(window.innerHeight * dpr));
  screen.width = cw; screen.height = ch;
  scale = Math.max(1, Math.floor(Math.min(cw / W, ch / H)));      // largest integer factor
  ox = (cw - W * scale) >> 1; oy = (ch - H * scale) >> 1;
  sctx.imageSmoothingEnabled = false;
}
function present(){
  sctx.fillStyle = '#000'; sctx.fillRect(0, 0, screen.width, screen.height);
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(off, 0, 0, W, H, ox, oy, W * scale, H * scale);
}

/* ---------- 15. INPUT / SOUND TOGGLE ---------- */
function firstGesture(){ initAudio(); }
window.addEventListener('pointerdown', firstGesture);
window.addEventListener('keydown', (e) => {
  firstGesture();                                       // AudioContext only after user interaction
  const k = e.key;
  if (k === 'm' || k === 'M') soundOn = !soundOn;
  else if (k === ' ') { paused = !paused; e.preventDefault(); }
  else if (k === 'f' || k === 'F') speedMul = speedMul === 1 ? 2 : (speedMul === 2 ? 4 : 1);
});
window.addEventListener('resize', resize);

/* ---------- 16. MAIN LOOP ---------- */
resetAll();                                             // generate the BFS event stream before playback
resize();
let last = 0, acc = 0;
const STEP = 1000 / 60;
function loop(t){
  requestAnimationFrame(loop);
  if (!last) last = t;
  let dt = t - last; last = t; if (dt > 250) dt = 250;
  acc += dt;
  while (acc >= STEP) { update(); acc -= STEP; }
  render(); present();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
